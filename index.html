const DEEP={};
function D(n,o){DEEP[n]=o;}

D(1,{
h:"O termo \"inteligência artificial\" apareceu em 1955, na proposta que John McCarthy e colegas escreveram para o workshop de Dartmouth. Desde então, a definição mudou muitas vezes: jogar damas ou resolver equações parecia IA nos anos 1960 e virou \"só software\" quando ficou comum, fenômeno conhecido como efeito IA. O livro-texto mais usado da área, Artificial Intelligence: A Modern Approach, de Stuart Russell e Peter Norvig (1995, hoje na 4ª edição), organiza o campo em torno de agentes racionais: sistemas que percebem o ambiente e agem para atingir objetivos.",
he:"The term \"artificial intelligence\" first appeared in 1955, in the proposal John McCarthy and colleagues wrote for the Dartmouth workshop. The definition has shifted many times since: playing checkers or solving equations looked like AI in the 1960s and became \"just software\" once it was common, a phenomenon known as the AI effect. The field's most widely used textbook, Artificial Intelligence: A Modern Approach by Stuart Russell and Peter Norvig (1995, now in its 4th edition), organizes the field around rational agents: systems that perceive their environment and act to achieve goals.",
a:"Hoje, quando se fala em IA, quase sempre se fala de modelos de fundação: modelos muito grandes, treinados com volumes enormes de dados, que servem de base para muitas tarefas diferentes. O AI Index, relatório anual de Stanford, mostra que entre 2023 e 2025 esses modelos avançaram rapidamente em raciocínio, programação e compreensão de imagens, enquanto o custo por uso caiu de forma acentuada. A fronteira da pesquisa também mudou de pergunta: saiu de \"o modelo sabe responder?\" para \"o sistema consegue executar tarefas longas com confiabilidade?\". Por isso agentes, avaliação e segurança passaram a ocupar o centro da conversa.",
ae:"Today, talking about AI almost always means talking about foundation models: very large models trained on huge amounts of data that serve as the base for many different tasks. Stanford's annual AI Index shows that between 2023 and 2025 these models advanced quickly in reasoning, coding and image understanding, while the cost of using them fell sharply. The research frontier also changed its question, from \"can the model answer?\" to \"can the system carry out long tasks reliably?\". That is why agents, evaluation and safety moved to the center of the conversation.",
r:"No dia a dia, o AI PM é quem transforma \"vamos usar IA\" em uma pergunta de produto: que tarefa ou decisão do usuário vai mudar, e como saberemos que mudou? Na prática, isso significa escrever o problema antes da solução, mapear onde regras simples bastam e onde um modelo agrega valor de verdade, e explicar para stakeholders a diferença entre um modelo (um componente) e um produto (a experiência completa, com dados, interface, operação e métricas). Essa clareza evita projetos que viram demonstrações bonitas sem adoção.",
re:"Day to day, the AI PM is the one who turns \"let's use AI\" into a product question: which user task or decision will change, and how will we know it changed? In practice, that means writing the problem before the solution, mapping where simple rules are enough and where a model truly adds value, and explaining to stakeholders the difference between a model (a component) and a product (the full experience, with data, interface, operations and metrics). That clarity prevents projects that become beautiful demos with no adoption.",
refs:[["Russell, S. e Norvig, P. (2020). Artificial Intelligence: A Modern Approach, 4ª ed. Pearson.","Artificial Intelligence: A Modern Approach Russell Norvig"],
["Stanford HAI (2025). AI Index Report 2025.","Stanford AI Index Report 2025","w"],
["Bommasani, R. et al. (2021). On the Opportunities and Risks of Foundation Models. Stanford CRFM.","On the Opportunities and Risks of Foundation Models"]]
});

D(2,{
h:"Em 1950, Alan Turing publicou \"Computing Machinery and Intelligence\" na revista Mind. Em 1958, Frank Rosenblatt apresentou o perceptron, uma das primeiras redes neurais. O otimismo inicial esbarrou em limites: o livro Perceptrons (Minsky e Papert, 1969) mostrou o que redes simples não conseguiam aprender, e o relatório Lighthill (1973) levou o governo britânico a cortar financiamento, abrindo o primeiro inverno da IA. O segundo veio no fim dos anos 1980, com o colapso do mercado de sistemas especialistas. A retomada das redes neurais começou com a popularização da retropropagação por Rumelhart, Hinton e Williams (1986).",
he:"In 1950, Alan Turing published \"Computing Machinery and Intelligence\" in the journal Mind. In 1958, Frank Rosenblatt introduced the perceptron, one of the first neural networks. Early optimism hit limits: the book Perceptrons (Minsky and Papert, 1969) showed what simple networks could not learn, and the Lighthill report (1973) led the British government to cut funding, opening the first AI winter. The second came in the late 1980s, when the expert systems market collapsed. The comeback of neural networks began when Rumelhart, Hinton and Williams popularized backpropagation (1986).",
a:"A história recente reconciliou as duas tradições. O deep learning ganhou força com a AlexNet (2012), e o Prêmio Turing de 2018 foi para Hinton, LeCun e Bengio. Em 2024, o Nobel de Física reconheceu Hopfield e Hinton pelos fundamentos das redes neurais, e o de Química premiou Baker, Hassabis e Jumper, estes dois pelo AlphaFold. Ao mesmo tempo, abordagens neurossimbólicas voltaram à pauta: modelos de linguagem que chamam ferramentas, executam código ou usam verificadores formais combinam aprendizado estatístico com regras explícitas.",
ae:"Recent history has reconciled the two traditions. Deep learning took off with AlexNet (2012), and the 2018 Turing Award went to Hinton, LeCun and Bengio. In 2024, the Nobel Prize in Physics recognized Hopfield and Hinton for the foundations of neural networks, and the Chemistry prize went to Baker, Hassabis and Jumper, the latter two for AlphaFold. At the same time, neurosymbolic approaches are back: language models that call tools, run code or use formal verifiers combine statistical learning with explicit rules.",
r:"Conhecer a história ajuda o AI PM a reconhecer padrões de hype. Quando alguém promete que \"a IA vai resolver tudo em seis meses\", vale lembrar que os invernos vieram justamente de promessas maiores do que a entrega. Na rotina, isso vira roadmaps com marcos verificáveis, pilotos pequenos antes de grandes compromissos e comunicação honesta sobre as incertezas técnicas. É uma postura que gera confiança com liderança e clientes enterprise.",
re:"Knowing the history helps the AI PM recognize hype patterns. When someone promises that \"AI will solve everything in six months\", it is worth remembering that the winters came precisely from promises bigger than what was delivered. Day to day, this becomes roadmaps with verifiable milestones, small pilots before big commitments and honest communication about technical uncertainty. It is a stance that builds trust with leadership and enterprise clients.",
refs:[["Turing, A. (1950). Computing Machinery and Intelligence. Mind, 59(236).","Computing Machinery and Intelligence Turing 1950"],
["McCarthy, J. et al. (1955). A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence.","A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence"],
["Rumelhart, D., Hinton, G. e Williams, R. (1986). Learning representations by back-propagating errors. Nature.","Learning representations by back-propagating errors"],
["The Nobel Prize (2024). Prêmio Nobel de Física 2024: Hopfield e Hinton.","Nobel Prize Physics 2024 Hopfield Hinton","w"]]
});

D(3,{
h:"Nos anos 1950, Newell e Simon criaram o Logic Theorist, que provava teoremas com regras de raciocínio. Em 1965, Edward Feigenbaum iniciou em Stanford o DENDRAL, considerado o primeiro sistema especialista, voltado à química. O MYCIN, desenvolvido por Edward Shortliffe nos anos 1970, recomendava antibióticos com desempenho comparável ao de especialistas em avaliações, mas nunca foi usado na prática clínica, por questões legais, éticas e de integração. O XCON, da Digital Equipment Corporation (1980), configurava computadores VAX e economizava milhões por ano. Foi Feigenbaum quem nomeou o gargalo de aquisição de conhecimento.",
he:"In the 1950s, Newell and Simon created the Logic Theorist, which proved theorems using reasoning rules. In 1965, Edward Feigenbaum started DENDRAL at Stanford, considered the first expert system, focused on chemistry. MYCIN, developed by Edward Shortliffe in the 1970s, recommended antibiotics with performance comparable to experts in evaluations, but was never used in clinical practice because of legal, ethical and integration issues. Digital Equipment Corporation's XCON (1980) configured VAX computers and saved millions per year. It was Feigenbaum who named the knowledge acquisition bottleneck.",
a:"As regras nunca saíram de cena: motores de regras de negócio, sistemas antifraude e checagens de compliance continuam por toda parte. Grafos de conhecimento, como o Knowledge Graph do Google (2012), são herdeiros diretos dessa tradição. O movimento atual é híbrido: o modelo de linguagem interpreta texto bagunçado e extrai informação, e regras determinísticas tomam as decisões sensíveis. Técnicas como saída estruturada com validação, motores de políticas usados como guardrails e o GraphRAG (Microsoft, 2024), que combina grafos com LLMs, são exemplos dessa combinação.",
ae:"Rules never left the scene: business rule engines, anti-fraud systems and compliance checks are still everywhere. Knowledge graphs, such as Google's Knowledge Graph (2012), are direct heirs of this tradition. Today's movement is hybrid: the language model interprets messy text and extracts information, and deterministic rules make the sensitive decisions. Structured output with validation, policy engines used as guardrails and GraphRAG (Microsoft, 2024), which combines graphs with LLMs, are examples of this combination.",
r:"Uma decisão recorrente do AI PM é \"regra ou modelo?\". No caso de atendimento, a elegibilidade para reembolso é uma regra de política da empresa, que precisa ser auditável; já entender a mensagem confusa do cliente é trabalho para um modelo. Na rotina, isso significa documentar tabelas de decisão junto com operações e jurídico, deixar claro o que o modelo pode decidir sozinho e garantir que cada decisão sensível possa ser explicada depois.",
re:"A recurring AI PM decision is \"rule or model?\". In the support case, refund eligibility is a company policy rule that must be auditable, while understanding a customer's messy message is work for a model. Day to day, that means documenting decision tables with operations and legal, making clear what the model may decide on its own and ensuring every sensitive decision can be explained later.",
refs:[["Shortliffe, E. (1976). Computer-Based Medical Consultations: MYCIN. Elsevier.","Computer-Based Medical Consultations MYCIN Shortliffe"],
["Feigenbaum, E. (1977). The Art of Artificial Intelligence: Themes and Case Studies of Knowledge Engineering. IJCAI.","The Art of Artificial Intelligence Themes and Case Studies of Knowledge Engineering"],
["Edge, D. et al. (2024). From Local to Global: A Graph RAG Approach to Query-Focused Summarization. Microsoft Research.","From Local to Global: A Graph RAG Approach to Query-Focused Summarization"]]
});

D(4,{
h:"Joseph Weizenbaum publicou o ELIZA em 1966, na revista Communications of the ACM. O roteiro mais famoso, DOCTOR, imitava um terapeuta. Weizenbaum ficou perturbado ao ver pessoas, incluindo sua secretária, pedindo privacidade para conversar com o programa, e virou um crítico importante da área no livro Computer Power and Human Reason (1976). Décadas depois, Byron Reeves e Clifford Nass mostraram em The Media Equation (1996) que as pessoas tratam computadores socialmente, com cortesia e até constrangimento, mesmo sabendo que são máquinas.",
he:"Joseph Weizenbaum published ELIZA in 1966, in Communications of the ACM. Its most famous script, DOCTOR, imitated a therapist. Weizenbaum was disturbed to see people, including his secretary, ask for privacy to talk to the program, and he became an important critic of the field in Computer Power and Human Reason (1976). Decades later, Byron Reeves and Clifford Nass showed in The Media Equation (1996) that people treat computers socially, with courtesy and even embarrassment, while knowing they are machines.",
a:"Com os LLMs, o efeito ELIZA ficou muito mais forte, porque agora a fluência é real. Pesquisas da Anthropic (Sharma et al., 2023) documentaram a bajulação (sycophancy): a tendência dos modelos de concordar com o usuário mesmo quando ele está errado. Somam-se a isso as alucinações e a dependência excessiva, tema de uma revisão da Microsoft Research (2022) que mostra que usuários aceitam respostas erradas quando elas parecem confiantes. O caminho que a indústria segue inclui citar fontes, comunicar incerteza de forma calibrada e treinar modelos para discordar com respeito.",
ae:"With LLMs, the ELIZA effect became much stronger, because the fluency is now real. Research by Anthropic (Sharma et al., 2023) documented sycophancy: models' tendency to agree with users even when they are wrong. Add hallucinations and overreliance, the subject of a Microsoft Research review (2022) showing that users accept wrong answers when they sound confident. The industry's path includes citing sources, communicating uncertainty in a calibrated way and training models to disagree respectfully.",
r:"O AI PM desenha a confiança do usuário de propósito. Isso inclui deixar claro que a pessoa está falando com uma IA, mostrar fontes, facilitar a verificação e evitar antropomorfização que engane. Nas avaliações, vale incluir casos em que a resposta \"soa certa, mas está errada\" e medir quantas vezes usuários aceitam respostas incorretas. Com seu background em design, esse é um tema em que você pode se destacar nas entrevistas.",
re:"The AI PM designs user trust on purpose. That includes making clear that the person is talking to an AI, showing sources, making verification easy and avoiding misleading anthropomorphism. In evaluations, it is worth including cases where the answer \"sounds right but is wrong\" and measuring how often users accept incorrect answers. With your design background, this is a topic where you can stand out in interviews.",
refs:[["Weizenbaum, J. (1966). ELIZA: A Computer Program for the Study of Natural Language Communication Between Man and Machine. CACM.","ELIZA A Computer Program For the Study of Natural Language Communication Between Man And Machine"],
["Reeves, B. e Nass, C. (1996). The Media Equation. Cambridge University Press.","The Media Equation Reeves Nass"],
["Sharma, M. et al. (2023). Towards Understanding Sycophancy in Language Models. Anthropic.","Towards Understanding Sycophancy in Language Models"],
["Passi, S. e Vorvoreanu, M. (2022). Overreliance on AI: Literature Review. Microsoft Research.","Overreliance on AI Literature Review Passi Vorvoreanu","w"]]
});

D(5,{
h:"A distinção entre IA \"fraca\" e \"forte\" foi proposta pelo filósofo John Searle em 1980, no argumento do Quarto Chinês. O termo AGI (inteligência artificial geral) se popularizou no começo dos anos 2000, com pesquisadores como Ben Goertzel e Shane Legg. A ideia de superinteligência vem de I. J. Good, que em 1965 descreveu uma \"explosão de inteligência\", e foi retomada por Nick Bostrom no livro Superintelligence (2014).",
he:"The distinction between \"weak\" and \"strong\" AI was proposed by philosopher John Searle in 1980, in the Chinese Room argument. The term AGI (artificial general intelligence) became popular in the early 2000s through researchers such as Ben Goertzel and Shane Legg. The idea of superintelligence comes from I. J. Good, who described an \"intelligence explosion\" in 1965, and was revisited by Nick Bostrom in Superintelligence (2014).",
a:"Ainda não há definição consensual de AGI. O Google DeepMind propôs uma escala de \"níveis de AGI\" (Morris et al., 2023) que combina desempenho e generalidade. Os modelos de fundação embaralham as categorias: um mesmo modelo lê imagens, escreve código e conversa, mas ainda falha de forma imprevisível em tarefas longas. Reguladores e empresas passaram a usar limites de capacidade: o AI Act europeu trata como risco sistêmico modelos treinados acima de 10^25 operações, e a Anthropic organiza suas salvaguardas em níveis de segurança (ASL) na sua política de escalonamento responsável.",
ae:"There is still no consensus definition of AGI. Google DeepMind proposed a scale of \"levels of AGI\" (Morris et al., 2023) combining performance and generality. Foundation models blur the categories: the same model reads images, writes code and chats, yet still fails unpredictably on long tasks. Regulators and companies started using capability thresholds: the EU AI Act treats models trained above 10^25 operations as systemic risk, and Anthropic organizes its safeguards into AI Safety Levels (ASL) in its Responsible Scaling Policy.",
r:"Para o AI PM, rótulos importam menos do que capacidades medidas. Quando um fornecedor fala em \"nível AGI\", a pergunta certa é: qual é o desempenho na nossa tarefa, no nosso conjunto de testes? Classificar a funcionalidade por abordagem e aplicação também ajuda na conversa com o jurídico, porque regulações como o AI Act definem obrigações de acordo com o uso (por exemplo, recrutamento e crédito são de alto risco), e não com a tecnologia.",
re:"For the AI PM, labels matter less than measured capabilities. When a vendor talks about \"AGI level\", the right question is: what is the performance on our task, on our test set? Classifying the feature by approach and application also helps in conversations with legal, because regulations such as the AI Act set obligations according to the use (for example, hiring and credit are high risk), not the technology.",
refs:[["Searle, J. (1980). Minds, Brains, and Programs. Behavioral and Brain Sciences.","Minds, Brains, and Programs Searle"],
["Morris, M. R. et al. (2023). Levels of AGI for Operationalizing Progress on the Path to AGI. Google DeepMind.","Levels of AGI for Operationalizing Progress on the Path to AGI"],
["Bostrom, N. (2014). Superintelligence: Paths, Dangers, Strategies. Oxford University Press.","Superintelligence Paths Dangers Strategies"],
["União Europeia (2024). Regulamento de Inteligência Artificial (AI Act).","EU AI Act official text","w"]]
});

D(6,{
h:"Arthur Samuel cunhou o termo machine learning em 1959, com um programa que aprendia a jogar damas. Tom Mitchell deu a definição clássica em 1997: um programa aprende com a experiência E em uma tarefa T se seu desempenho P melhora com E. A linha do tempo das redes neurais passa pelo perceptron (1958), pela retropropagação (1986), pelas redes convolucionais de Yann LeCun (1989), pela AlexNet (2012), pelo AlphaGo com aprendizado por reforço (2016) e pelo Transformer (2017).",
he:"Arthur Samuel coined the term machine learning in 1959, with a program that learned to play checkers. Tom Mitchell gave the classic definition in 1997: a program learns from experience E on task T if its performance P improves with E. The neural network timeline runs through the perceptron (1958), backpropagation (1986), Yann LeCun's convolutional networks (1989), AlexNet (2012), AlphaGo with reinforcement learning (2016) and the Transformer (2017).",
a:"A receita dominante hoje tem duas fases: pré-treino autossupervisionado em escala gigantesca e pós-treino, que inclui ajuste supervisionado, aprendizado por reforço com feedback humano (RLHF, popularizado pelo InstructGPT em 2022) e feedback de IA guiado por princípios (Constitutional AI, Anthropic, 2022). Desde 2024, o aprendizado por reforço com recompensas verificáveis passou a treinar modelos de raciocínio, como o o1 da OpenAI e o DeepSeek-R1 (2025). As leis de escala (Kaplan, 2020; Hoffmann, 2022) orientam quanto dado e computação usar. Mesmo assim, para dados tabulares, métodos clássicos como gradient boosting ainda costumam vencer o deep learning (Grinsztajn et al., 2022).",
ae:"Today's dominant recipe has two phases: self-supervised pre-training at massive scale and post-training, which includes supervised fine-tuning, reinforcement learning from human feedback (RLHF, popularized by InstructGPT in 2022) and principle-guided AI feedback (Constitutional AI, Anthropic, 2022). Since 2024, reinforcement learning with verifiable rewards has been used to train reasoning models such as OpenAI's o1 and DeepSeek-R1 (2025). Scaling laws (Kaplan, 2020; Hoffmann, 2022) guide how much data and compute to use. Even so, for tabular data, classic methods such as gradient boosting still tend to beat deep learning (Grinsztajn et al., 2022).",
r:"Na rotina, o AI PM ajuda a escolher a ferramenta certa para cada problema. Previsão de churn ou detecção de fraude em dados de planilha? Machine learning clássico costuma ser mais barato e explicável. Entender textos livres de clientes? Um LLM brilha. Também é papel do PM saber se existem dados rotulados, quanto custaria rotular e como o feedback dos usuários pode virar dado de melhoria, sempre com atenção à privacidade.",
re:"Day to day, the AI PM helps choose the right tool for each problem. Churn prediction or fraud detection on spreadsheet-like data? Classic machine learning is usually cheaper and more explainable. Understanding free text from customers? An LLM shines. It is also the PM's role to know whether labeled data exists, how much labeling would cost and how user feedback can become improvement data, always with attention to privacy.",
refs:[["Samuel, A. (1959). Some Studies in Machine Learning Using the Game of Checkers. IBM Journal.","Some Studies in Machine Learning Using the Game of Checkers"],
["Ouyang, L. et al. (2022). Training language models to follow instructions with human feedback. OpenAI.","Training language models to follow instructions with human feedback"],
["DeepSeek-AI (2025). DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning.","DeepSeek-R1 Incentivizing Reasoning Capability in LLMs via Reinforcement Learning"],
["Grinsztajn, L. et al. (2022). Why do tree-based models still outperform deep learning on tabular data? NeurIPS.","Why do tree-based models still outperform deep learning on tabular data"]]
});

D(7,{
h:"A expressão \"garbage in, garbage out\" circula desde os primeiros computadores, nos anos 1950 e 1960. A separação entre treino e teste vem da estatística, e a validação cruzada foi formalizada por Stone em 1974. O ImageNet (Deng et al., 2009), com milhões de imagens rotuladas, mostrou o poder de grandes bases de dados e abriu caminho para a AlexNet. Em 2015, o artigo do Google \"Hidden Technical Debt in Machine Learning Systems\" mostrou que o modelo é uma pequena parte de um sistema de ML real, cercado de dados, monitoramento e infraestrutura.",
he:"The phrase \"garbage in, garbage out\" has been around since the first computers in the 1950s and 1960s. Separating training and test data comes from statistics, and cross-validation was formalized by Stone in 1974. ImageNet (Deng et al., 2009), with millions of labeled images, showed the power of large datasets and paved the way for AlexNet. In 2015, Google's paper \"Hidden Technical Debt in Machine Learning Systems\" showed that the model is a small part of a real ML system, surrounded by data, monitoring and infrastructure.",
a:"Andrew Ng popularizou em 2021 a ideia de IA centrada em dados: melhorar a qualidade dos dados costuma render mais do que trocar de modelo. Nos LLMs, surgiu o problema da contaminação de benchmarks, quando perguntas de teste aparecem nos dados de pré-treino, o que levou à criação de testes renovados e privados. Kapoor e Narayanan (2023) encontraram vazamento de dados em centenas de estudos científicos com ML. Sobre calibração, Guo et al. (2017) mostraram que redes modernas tendem a ser confiantes demais. E a inferência virou parte central do custo, porque modelos de raciocínio gastam mais tokens \"pensando\" antes de responder.",
ae:"In 2021, Andrew Ng popularized data-centric AI: improving data quality often pays off more than switching models. With LLMs came benchmark contamination, when test questions show up in pre-training data, leading to refreshed and private tests. Kapoor and Narayanan (2023) found data leakage in hundreds of scientific studies using ML. On calibration, Guo et al. (2017) showed that modern networks tend to be overconfident. And inference became a central part of cost, because reasoning models spend more tokens \"thinking\" before answering.",
r:"O AI PM faz as perguntas que evitam surpresas em produção: de onde vieram os dados de treino e de teste? O teste representa o que os usuários realmente fazem? Como vamos detectar mudanças no perfil dos dados depois do lançamento? Quando uma pontuação do modelo vira gatilho de decisão (por exemplo, aprovar automaticamente acima de 0,9), o PM deve exigir uma checagem de calibração e definir o custo de cada tipo de erro.",
re:"The AI PM asks the questions that prevent surprises in production: where did training and test data come from? Does the test reflect what users actually do? How will we detect shifts in the data after launch? When a model score becomes a decision trigger (for example, auto-approve above 0.9), the PM should require a calibration check and define the cost of each type of error.",
refs:[["Sculley, D. et al. (2015). Hidden Technical Debt in Machine Learning Systems. NeurIPS.","Hidden Technical Debt in Machine Learning Systems"],
["Guo, C. et al. (2017). On Calibration of Modern Neural Networks. ICML.","On Calibration of Modern Neural Networks"],
["Kapoor, S. e Narayanan, A. (2023). Leakage and the reproducibility crisis in machine-learning-based science. Patterns.","Leakage and the reproducibility crisis in machine-learning-based science"],
["Deng, J. et al. (2009). ImageNet: A large-scale hierarchical image database. CVPR.","ImageNet A large-scale hierarchical image database"]]
});

D(8,{
h:"LLM significa Large Language Model, ou modelo de linguagem de grande porte. \"Modelo de linguagem\" é um modelo que atribui probabilidades a sequências de texto; \"grande\" se refere aos bilhões de parâmetros e ao volume enorme de dados de treino. A geração de texto por probabilidade existe desde Claude Shannon (1948). Vieram depois os VAEs (2013), as GANs (Goodfellow, 2014), o Transformer (2017), a série GPT (2018 a 2020, com o GPT-3 mostrando aprendizado com poucos exemplos) e o ChatGPT (novembro de 2022), que levou a IA generativa ao grande público. Em imagens, os modelos de difusão (2020) e o Stable Diffusion (2022) mudaram o jogo. O termo \"modelo de fundação\" foi cunhado em Stanford em 2021.",
he:"LLM stands for Large Language Model. A \"language model\" assigns probabilities to sequences of text; \"large\" refers to billions of parameters and a huge volume of training data. Probabilistic text generation goes back to Claude Shannon (1948). Then came VAEs (2013), GANs (Goodfellow, 2014), the Transformer (2017), the GPT series (2018 to 2020, with GPT-3 showing few-shot learning) and ChatGPT (November 2022), which brought generative AI to the general public. In images, diffusion models (2020) and Stable Diffusion (2022) changed the game. The term \"foundation model\" was coined at Stanford in 2021.",
a:"Os modelos de fronteira hoje são nativamente multimodais (entendem texto, imagem e áudio), trabalham com contextos de centenas de milhares de tokens, têm modos de raciocínio e usam ferramentas. A geração de vídeo avançou rapidamente a partir de 2024. Modelos de pesos abertos, como Llama, Qwen, DeepSeek e Mistral, ficaram próximos dos fechados em várias tarefas, e modelos pequenos passaram a rodar direto no celular. Outra tendência é a interface generativa, em que o modelo cria a própria tela ou documento, e não só texto de chat.",
ae:"Frontier models today are natively multimodal (they understand text, images and audio), work with contexts of hundreds of thousands of tokens, have reasoning modes and use tools. Video generation advanced quickly from 2024 onward. Open-weight models such as Llama, Qwen, DeepSeek and Mistral came close to closed ones on many tasks, and small models started running directly on phones. Another trend is generative UI, where the model creates the screen or document itself, not just chat text.",
r:"O AI PM decide a forma da experiência: chat, sugestão embutida, geração em lote ou algo invisível no fluxo. Conteúdo gerado precisa de fluxo de revisão, voz de marca e política de propriedade intelectual. Na rotina, vale preferir saídas verificáveis (um rascunho que alguém aprova, um código que passa em testes) e estimar o custo por geração desde o início.",
re:"The AI PM decides the shape of the experience: chat, embedded suggestion, batch generation or something invisible in the flow. Generated content needs a review workflow, brand voice and an intellectual property policy. Day to day, it is worth preferring verifiable outputs (a draft someone approves, code that passes tests) and estimating the cost per generation from the start.",
refs:[["Vaswani, A. et al. (2017). Attention Is All You Need. NeurIPS.","Attention Is All You Need"],
["Brown, T. et al. (2020). Language Models are Few-Shot Learners. NeurIPS.","Language Models are Few-Shot Learners"],
["Ho, J., Jain, A. e Abbeel, P. (2020). Denoising Diffusion Probabilistic Models. NeurIPS.","Denoising Diffusion Probabilistic Models"],
["Bommasani, R. et al. (2021). On the Opportunities and Risks of Foundation Models.","On the Opportunities and Risks of Foundation Models"]]
});

D(9,{
h:"Claude Shannon já estimava, em 1948 e 1951, a probabilidade da próxima letra ou palavra em textos em inglês. Nos anos 1980, a IBM usou modelos estatísticos de linguagem em reconhecimento de fala. Yoshua Bengio propôs um modelo de linguagem neural em 2003. A tokenização por subpalavras (BPE) foi adaptada por Sennrich et al. em 2016 para tradução automática. O mecanismo de atenção apareceu em 2014 (Bahdanau et al.) e virou a base do Transformer em 2017, que permitiu treinar modelos muito maiores em paralelo.",
he:"Claude Shannon was already estimating, in 1948 and 1951, the probability of the next letter or word in English text. In the 1980s, IBM used statistical language models for speech recognition. Yoshua Bengio proposed a neural language model in 2003. Subword tokenization (BPE) was adapted by Sennrich et al. in 2016 for machine translation. The attention mechanism appeared in 2014 (Bahdanau et al.) and became the basis of the Transformer in 2017, which made it possible to train much larger models in parallel.",
a:"Além da temperatura, estratégias como top-p (amostragem por núcleo, Holtzman et al., 2019) controlam a escolha dos tokens. As janelas de contexto cresceram de cerca de 2 mil tokens (GPT-3) para centenas de milhares e até milhões. Mas contexto longo não é garantia: o estudo \"Lost in the Middle\" (Liu et al., 2023) mostrou que modelos usam pior a informação que fica no meio de textos longos. Modelos de raciocínio geram tokens de \"pensamento\" antes da resposta, trocando custo e tempo por qualidade. E a tokenização não é neutra: Petrov et al. (2023) mostraram que idiomas diferentes do inglês podem custar bem mais tokens para o mesmo conteúdo.",
ae:"Besides temperature, strategies such as top-p (nucleus sampling, Holtzman et al., 2019) control token selection. Context windows grew from about 2 thousand tokens (GPT-3) to hundreds of thousands and even millions. But long context is no guarantee: the \"Lost in the Middle\" study (Liu et al., 2023) showed that models make worse use of information placed in the middle of long texts. Reasoning models generate \"thinking\" tokens before answering, trading cost and time for quality. And tokenization is not neutral: Petrov et al. (2023) showed that languages other than English can cost many more tokens for the same content.",
r:"Na rotina, o AI PM estima tokens por tarefa para projetar custos (lembrando que tokens de saída costumam ser mais caros que os de entrada), define limites de resposta e escolhe a temperatura por caso de uso: baixa para extração de dados, mais alta para brainstorming. Para usuários brasileiros, vale medir o custo real em português. E exibir a resposta em streaming melhora muito a percepção de velocidade.",
re:"Day to day, the AI PM estimates tokens per task to project costs (remembering that output tokens usually cost more than input tokens), sets response limits and picks the temperature per use case: low for data extraction, higher for brainstorming. For Brazilian users, it is worth measuring the real cost in Portuguese. And streaming the answer greatly improves perceived speed.",
refs:[["Sennrich, R., Haddow, B. e Birch, A. (2016). Neural Machine Translation of Rare Words with Subword Units. ACL.","Neural Machine Translation of Rare Words with Subword Units"],
["Holtzman, A. et al. (2019). The Curious Case of Neural Text Degeneration. ICLR 2020.","The Curious Case of Neural Text Degeneration"],
["Liu, N. et al. (2023). Lost in the Middle: How Language Models Use Long Contexts. TACL.","Lost in the Middle: How Language Models Use Long Contexts"],
["Petrov, A. et al. (2023). Language Model Tokenizers Introduce Unfairness Between Languages. NeurIPS.","Language Model Tokenizers Introduce Unfairness Between Languages"]]
});

D(10,{
h:"A ideia por trás dos embeddings é a hipótese distribucional, resumida pelo linguista J. R. Firth em 1957: você conhece uma palavra pelas companhias que ela tem. A análise semântica latente (1990) já representava documentos como vetores. O word2vec (Mikolov et al., 2013) ficou famoso pelo exemplo \"rei menos homem mais mulher dá rainha\". Vieram depois o GloVe (2014), o BERT (2018), com vetores que mudam conforme o contexto, e o Sentence-BERT (2019), para frases inteiras. Do lado da busca lexical, o BM25 nasceu no sistema Okapi, nos anos 1990.",
he:"The idea behind embeddings is the distributional hypothesis, summed up by linguist J. R. Firth in 1957: you shall know a word by the company it keeps. Latent semantic analysis (1990) already represented documents as vectors. word2vec (Mikolov et al., 2013) became famous for the example \"king minus man plus woman gives queen\". Then came GloVe (2014), BERT (2018), with vectors that change with context, and Sentence-BERT (2019), for whole sentences. On the lexical side, BM25 was born in the Okapi system in the 1990s.",
a:"Hoje, modelos de embedding multilíngues estão disponíveis por API e são comparados no benchmark MTEB (Muennighoff et al., 2022). A combinação de busca híbrida com reordenação (reranking) virou padrão. A Anthropic publicou em 2024 a técnica Contextual Retrieval, que acrescenta contexto a cada trecho antes de gerar o embedding e reduziu bastante as falhas de recuperação nos testes da empresa. Bancos tradicionais também passaram a oferecer busca vetorial, como o pgvector no Postgres, o que muitas vezes dispensa um banco vetorial dedicado.",
ae:"Today, multilingual embedding models are available via API and compared on the MTEB benchmark (Muennighoff et al., 2022). Hybrid search combined with reranking became standard. In 2024, Anthropic published Contextual Retrieval, a technique that adds context to each chunk before embedding it and substantially reduced retrieval failures in the company's tests. Traditional databases also started offering vector search, such as pgvector in Postgres, which often removes the need for a dedicated vector database.",
r:"O AI PM decide que tipo de busca atende quais perguntas e mede o resultado com perguntas reais de usuários (por exemplo, quantas vezes o trecho certo aparece entre os cinco primeiros). Também precisa considerar o suporte ao português, o custo de regerar todos os embeddings ao trocar de modelo e as permissões de acesso aos documentos indexados.",
re:"The AI PM decides which kind of search serves which questions and measures results with real user queries (for example, how often the right passage appears in the top five). They also need to consider Portuguese support, the cost of regenerating all embeddings when switching models and access permissions on indexed documents.",
refs:[["Mikolov, T. et al. (2013). Efficient Estimation of Word Representations in Vector Space.","Efficient Estimation of Word Representations in Vector Space"],
["Reimers, N. e Gurevych, I. (2019). Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks. EMNLP.","Sentence-BERT Sentence Embeddings using Siamese BERT-Networks"],
["Muennighoff, N. et al. (2022). MTEB: Massive Text Embedding Benchmark. EACL 2023.","MTEB Massive Text Embedding Benchmark"],
["Anthropic (2024). Introducing Contextual Retrieval.","Anthropic Introducing Contextual Retrieval","w"],
["Robertson, S. e Zaragoza, H. (2009). The Probabilistic Relevance Framework: BM25 and Beyond.","The Probabilistic Relevance Framework: BM25 and Beyond"]]
});

D(11,{
h:"O movimento de software livre começou com Richard Stallman e a Free Software Foundation (1985), e a Open Source Initiative surgiu em 1998 com a Definição de Open Source. Em IA, a cultura de pesquisa aberta prevaleceu por muito tempo: o BERT foi liberado em 2018. A virada veio com o GPT-2 (2019), liberado em etapas por receio de uso indevido, e com o GPT-3 (2020), disponível só por API. Em 2023, os pesos do LLaMA da Meta vazaram, e o Llama 2 saiu com licença própria; a Mistral lançou modelos sob Apache 2.0.",
he:"The free software movement began with Richard Stallman and the Free Software Foundation (1985), and the Open Source Initiative appeared in 1998 with the Open Source Definition. In AI, open research culture prevailed for a long time: BERT was released in 2018. The shift came with GPT-2 (2019), released in stages over misuse concerns, and GPT-3 (2020), available only via API. In 2023, Meta's LLaMA weights leaked, and Llama 2 shipped with its own license; Mistral released models under Apache 2.0.",
a:"Em outubro de 2024, a OSI publicou a Open Source AI Definition 1.0. Vários modelos chamados de \"abertos\", como o Llama, não atendem à definição por causa de restrições de licença, fenômeno que pesquisadores chamam de open-washing. Exemplos realmente abertos, com dados, código e pesos, incluem o OLMo, do Allen Institute for AI. A qualidade dos modelos de pesos abertos subiu muito: o DeepSeek-R1 (2025) saiu com licença MIT, e a própria OpenAI lançou modelos de pesos abertos (gpt-oss) em 2025. As model cards, propostas por Mitchell et al. (2019), viraram prática padrão de documentação.",
ae:"In October 2024, the OSI published the Open Source AI Definition 1.0. Several models called \"open\", such as Llama, do not meet the definition because of license restrictions, a phenomenon researchers call open-washing. Truly open examples, with data, code and weights, include OLMo from the Allen Institute for AI. Open-weight model quality rose sharply: DeepSeek-R1 (2025) shipped under the MIT license, and OpenAI itself released open-weight models (gpt-oss) in 2025. Model cards, proposed by Mitchell et al. (2019), became standard documentation practice.",
r:"O AI PM lê a licença junto com o jurídico: uso comercial é permitido? Há limite de usuários ou restrições de uso aceitável? A model card revela limitações e riscos que viram requisitos do produto. Modelos de pesos abertos podem ser a saída para clientes enterprise que exigem rodar dentro da própria infraestrutura ou ajustar o modelo, mas trazem responsabilidade de operação e segurança.",
re:"The AI PM reads the license together with legal: is commercial use allowed? Are there user limits or acceptable use restrictions? The model card reveals limitations and risks that become product requirements. Open-weight models may be the answer for enterprise clients who require running inside their own infrastructure or fine-tuning the model, but they bring operational and security responsibility.",
refs:[["Mitchell, M. et al. (2019). Model Cards for Model Reporting. FAT* 2019.","Model Cards for Model Reporting"],
["Open Source Initiative (2024). The Open Source AI Definition 1.0.","Open Source AI Definition 1.0 OSI","w"],
["Groeneveld, D. et al. (2024). OLMo: Accelerating the Science of Language Models. ACL.","OLMo: Accelerating the Science of Language Models"],
["Liesenfeld, A. e Dingemanse, M. (2024). Rethinking open source generative AI: open-washing and the EU AI Act. FAccT.","Rethinking open source generative AI: open-washing and the EU AI Act"]]
});
D(12,{
h:"A computação passou de servidores próprios para a nuvem a partir de 2006, com o lançamento da AWS, e o modelo \"como serviço\" se espalhou. Por volta de 2016, grandes nuvens passaram a vender APIs de ML prontas, como visão e tradução. A API da OpenAI (2020) popularizou a ideia de acessar um modelo de linguagem como serviço. Por trás de tudo estão as GPUs: a plataforma CUDA da NVIDIA (2007) transformou placas gráficas no motor do deep learning.",
he:"Computing moved from on-premise servers to the cloud starting in 2006, with the launch of AWS, and the \"as a service\" model spread. Around 2016, major clouds began selling ready-made ML APIs, such as vision and translation. The OpenAI API (2020) popularized the idea of accessing a language model as a service. Behind it all are GPUs: NVIDIA's CUDA platform (2007) turned graphics cards into the engine of deep learning.",
a:"Hoje, modelos proprietários estão disponíveis nas APIs dos próprios fornecedores e também dentro das grandes nuvens: o Claude no Amazon Bedrock e no Google Vertex AI, os modelos da OpenAI no Azure. Modelos abertos são oferecidos por provedores de inferência e catálogos de nuvem. Rodar por conta própria ficou mais fácil com motores como o vLLM (técnica PagedAttention, Kwon et al., 2023) e ferramentas como llama.cpp e Ollama para uso local. Modelos pequenos passaram a rodar no próprio aparelho, e fornecedores oferecem opções de residência de dados e de retenção zero.",
ae:"Today, proprietary models are available through the vendors' own APIs and inside the major clouds: Claude on Amazon Bedrock and Google Vertex AI, OpenAI models on Azure. Open models are offered by inference providers and cloud catalogs. Running them yourself became easier with engines such as vLLM (PagedAttention, Kwon et al., 2023) and tools such as llama.cpp and Ollama for local use. Small models started running on the device itself, and vendors offer data residency and zero data retention options.",
r:"O AI PM levanta os requisitos não funcionais cedo: residência de dados (a LGPD no Brasil), questionários de segurança de clientes, SLAs e latência por região. Contratar o modelo pelo marketplace da nuvem que o cliente já usa pode simplificar muito a compra em contas enterprise. Também vale planejar uma camada de abstração para trocar de fornecedor sem reescrever o produto.",
re:"The AI PM gathers non-functional requirements early: data residency (LGPD in Brazil), client security questionnaires, SLAs and latency by region. Buying the model through the cloud marketplace the client already uses can greatly simplify procurement in enterprise accounts. It is also worth planning an abstraction layer to switch vendors without rewriting the product.",
refs:[["Kwon, W. et al. (2023). Efficient Memory Management for Large Language Model Serving with PagedAttention. SOSP.","Efficient Memory Management for Large Language Model Serving with PagedAttention"],
["Huyen, C. (2025). AI Engineering: Building Applications with Foundation Models. O'Reilly.","AI Engineering Building Applications with Foundation Models Chip Huyen","w"],
["Brasil (2018). Lei Geral de Proteção de Dados (Lei nº 13.709).","LGPD Lei 13.709","w"]]
});

D(13,{
h:"A nuvem trocou investimento fixo (comprar servidores) por custo variável (pagar pelo uso), e isso deu origem à prática de FinOps, organizada pela FinOps Foundation a partir de 2019. Nos LLMs, os preços caíram de forma impressionante: uma análise da a16z (2024) estimou que o custo para obter um mesmo nível de desempenho vinha caindo cerca de dez vezes por ano, fenômeno apelidado de \"LLMflation\".",
he:"The cloud swapped fixed investment (buying servers) for variable cost (paying for usage), giving rise to FinOps, organized by the FinOps Foundation from 2019. With LLMs, prices fell impressively: an a16z analysis (2024) estimated that the cost to reach a given level of performance was falling about tenfold per year, a phenomenon nicknamed \"LLMflation\".",
a:"A estrutura de preços atual separa tokens de entrada e de saída, com descontos para entrada em cache e para processamento em lote (em geral, cerca de metade do preço). Em modelos de raciocínio, os tokens de pensamento são cobrados como saída, o que pode surpreender. O aluguel de GPUs ficou mais barato entre 2024 e 2025 com o aumento da oferta, mas hospedar por conta própria ainda exige engenharia, e o fator que mais pesa é a taxa de utilização. Organizações como a Epoch AI acompanham essas tendências.",
ae:"Current pricing separates input and output tokens, with discounts for cached input and batch processing (often around half price). With reasoning models, thinking tokens are billed as output, which can be surprising. GPU rental got cheaper between 2024 and 2025 as supply grew, but self-hosting still requires engineering, and utilization is the factor that weighs most. Organizations such as Epoch AI track these trends.",
r:"O AI PM monta o modelo de custo: tokens por tarefa vezes tarefas por mês vezes preço, somando novas tentativas e chamadas de ferramentas. A partir daí, calcula a economia por cliente (unit economics), discute a estratégia de preço (por assento ou por uso) e define orçamentos e alertas. Como os preços caem rápido, revisar essa conta a cada trimestre é parte da rotina.",
re:"The AI PM builds the cost model: tokens per task times tasks per month times price, plus retries and tool calls. From there, they compute per-customer unit economics, discuss pricing strategy (per seat or per usage) and set budgets and alerts. Since prices fall quickly, revisiting this math every quarter is part of the routine.",
refs:[["Appenzeller, G. / a16z (2024). Welcome to LLMflation: LLM inference cost is going down fast.","a16z Welcome to LLMflation","w"],
["FinOps Foundation. What is FinOps?","FinOps Foundation what is FinOps","w"],
["Epoch AI. Trends in Machine Learning.","Epoch AI trends machine learning","w"]]
});

D(14,{
h:"O teorema \"No Free Lunch\" (Wolpert e Macready, 1997) mostrou que nenhum algoritmo é o melhor para todos os problemas. A ideia de cascata também é antiga: o detector de rostos de Viola e Jones (2001) usava classificadores simples e rápidos primeiro, e só chamava os mais caros quando necessário. A arquitetura de mistura de especialistas (Jacobs et al., 1991) já roteava cada entrada para uma parte especializada do modelo.",
he:"The \"No Free Lunch\" theorem (Wolpert and Macready, 1997) showed that no algorithm is best for every problem. The cascade idea is old too: Viola and Jones' face detector (2001) ran simple, fast classifiers first and only called the expensive ones when needed. The mixture of experts architecture (Jacobs et al., 1991) already routed each input to a specialized part of the model.",
a:"Pesquisas como o FrugalGPT (Chen et al., 2023) mostraram que cascatas de modelos podem cortar custos drasticamente mantendo a qualidade, e o RouteLLM (Ong et al., 2024) treinou roteadores a partir de preferências humanas. Os fornecedores organizam seus modelos em famílias com níveis (por exemplo, Haiku, Sonnet e Opus no Claude). Rankings públicos como o LMArena (antes Chatbot Arena) e o HELM ajudam, mas sofrem com otimização para benchmark. Por isso, a decisão final depende de avaliações internas na sua tarefa.",
ae:"Research such as FrugalGPT (Chen et al., 2023) showed that model cascades can cut costs drastically while keeping quality, and RouteLLM (Ong et al., 2024) trained routers from human preferences. Vendors organize their models into tiered families (for example, Haiku, Sonnet and Opus for Claude). Public rankings such as LMArena (formerly Chatbot Arena) and HELM help but suffer from benchmark optimization. That is why the final decision depends on internal evaluations on your task.",
r:"Na rotina, o AI PM organiza uma \"disputa\" entre modelos: o mesmo conjunto de testes rodando em três ou quatro opções, comparando qualidade, custo e latência nos casos mais lentos. A decisão fica registrada numa matriz, e o produto é desenhado para permitir troca de modelo, porque surgem versões novas a cada poucos meses e reavaliar faz parte do trabalho.",
re:"Day to day, the AI PM runs a \"bake-off\" between models: the same test set on three or four options, comparing quality, cost and latency in the slowest cases. The decision is recorded in a matrix, and the product is designed to allow model swaps, because new versions arrive every few months and re-evaluating is part of the job.",
refs:[["Wolpert, D. e Macready, W. (1997). No Free Lunch Theorems for Optimization. IEEE TEC.","No Free Lunch Theorems for Optimization"],
["Viola, P. e Jones, M. (2001). Rapid Object Detection using a Boosted Cascade of Simple Features. CVPR.","Rapid Object Detection using a Boosted Cascade of Simple Features"],
["Chen, L., Zaharia, M. e Zou, J. (2023). FrugalGPT: How to Use Large Language Models While Reducing Cost and Improving Performance.","FrugalGPT How to Use Large Language Models While Reducing Cost and Improving Performance"],
["Ong, I. et al. (2024). RouteLLM: Learning to Route LLMs with Preference Data.","RouteLLM Learning to Route LLMs with Preference Data"],
["Chiang, W. et al. (2024). Chatbot Arena: An Open Platform for Evaluating LLMs by Human Preference. ICML.","Chatbot Arena An Open Platform for Evaluating LLMs by Human Preference"]]
});

D(15,{
h:"Com o GPT-3 (2020), ficou claro que modelos grandes aprendem tarefas a partir de exemplos colocados no próprio pedido, o chamado aprendizado em contexto. O termo \"prompt engineering\" se espalhou entre 2021 e 2022. Em 2022, o chain-of-thought (Wei et al.) mostrou que pedir o raciocínio passo a passo melhorava resultados, e Kojima et al. mostraram que a frase \"vamos pensar passo a passo\" já ajudava. O ajuste por instruções (FLAN e InstructGPT) tornou os modelos muito melhores em seguir pedidos diretos.",
he:"With GPT-3 (2020), it became clear that large models learn tasks from examples placed in the request itself, so-called in-context learning. The term \"prompt engineering\" spread between 2021 and 2022. In 2022, chain-of-thought (Wei et al.) showed that asking for step-by-step reasoning improved results, and Kojima et al. showed that the phrase \"let's think step by step\" already helped. Instruction tuning (FLAN and InstructGPT) made models much better at following direct requests.",
a:"Os modelos atuais seguem instruções bem, e os fornecedores publicam guias de boas práticas (a documentação de prompt engineering da Anthropic recomenda clareza, exemplos, marcação com tags XML e espaço para o modelo pensar). Saída estruturada virou recurso nativo. Ferramentas como o DSPy (Khattab et al., 2023) otimizam prompts automaticamente a partir de métricas. Com os modelos de raciocínio, truques como \"pense passo a passo\" perderam importância, e o foco passou a ser especificar bem o objetivo e os critérios.",
ae:"Current models follow instructions well, and vendors publish best-practice guides (Anthropic's prompt engineering docs recommend clarity, examples, XML tag structure and room for the model to think). Structured output became a native feature. Tools such as DSPy (Khattab et al., 2023) optimize prompts automatically from metrics. With reasoning models, tricks like \"think step by step\" lost importance, and the focus shifted to specifying the goal and criteria well.",
r:"Muitas vezes é o AI PM quem escreve ou revisa o prompt de sistema, porque ele funciona como especificação do produto: tom de voz, políticas, o que fazer em casos de borda. Na rotina, vale manter um histórico de mudanças do prompt ligado aos resultados das avaliações e revisar a linguagem das políticas junto com o jurídico.",
re:"The AI PM often writes or reviews the system prompt, because it works as the product spec: tone of voice, policies, what to do in edge cases. Day to day, it is worth keeping a prompt changelog linked to evaluation results and reviewing policy language with legal.",
refs:[["Wei, J. et al. (2022). Chain-of-Thought Prompting Elicits Reasoning in Large Language Models. NeurIPS.","Chain-of-Thought Prompting Elicits Reasoning in Large Language Models"],
["Kojima, T. et al. (2022). Large Language Models are Zero-Shot Reasoners. NeurIPS.","Large Language Models are Zero-Shot Reasoners"],
["Khattab, O. et al. (2023). DSPy: Compiling Declarative Language Model Calls into Self-Improving Pipelines.","DSPy Compiling Declarative Language Model Calls into Self-Improving Pipelines"],
["Anthropic. Prompt engineering overview (documentação).","Anthropic prompt engineering overview docs","w"]]
});

D(16,{
h:"O termo \"context engineering\" se popularizou em meados de 2025, com posts de Tobi Lütke (Shopify) e Andrej Karpathy defendendo que a habilidade central não é escrever o pedido, mas montar todo o contexto que o modelo recebe. A preocupação é antiga: sistemas de diálogo sempre precisaram lembrar o histórico, e assistentes passaram a oferecer memória entre conversas a partir de 2024.",
he:"The term \"context engineering\" became popular in mid-2025, with posts by Tobi Lütke (Shopify) and Andrej Karpathy arguing that the core skill is not writing the request but assembling all the context the model receives. The concern is old: dialogue systems always needed to remember history, and assistants started offering memory across conversations in 2024.",
a:"A Anthropic publicou em 2025 um guia sobre context engineering para agentes, com técnicas como compactação de conversas longas, anotações estruturadas que o agente mantém fora da janela, subagentes com contexto limpo e busca de informação no momento em que é necessária. Pesquisas mostraram que o desempenho cai à medida que o contexto cresce, efeito apelidado de \"context rot\" em um estudo da Chroma (2025). O MCP facilita puxar contexto de ferramentas, e o MemGPT (Packer et al., 2023) inspirou arquiteturas de memória em camadas.",
ae:"In 2025, Anthropic published a guide on context engineering for agents, with techniques such as compacting long conversations, structured notes the agent keeps outside the window, subagents with clean context and fetching information just in time. Research showed that performance drops as context grows, an effect nicknamed \"context rot\" in a Chroma study (2025). MCP makes it easier to pull context from tools, and MemGPT (Packer et al., 2023) inspired layered memory architectures.",
r:"O AI PM define o que o assistente precisa saber em cada momento: perfil do usuário, dados da conta, políticas vigentes. Também decide o que a memória guarda, com controles para o usuário ver e apagar, o que é essencial para a LGPD. Na rotina, vale acompanhar o custo por conversa conforme o contexto cresce e investigar respostas ruins olhando primeiro o que chegou ao modelo.",
re:"The AI PM defines what the assistant needs to know at each moment: user profile, account data, current policies. They also decide what memory stores, with controls for users to view and delete it, which is essential under LGPD. Day to day, it is worth tracking cost per conversation as context grows and investigating bad answers by first looking at what reached the model.",
refs:[["Anthropic (2025). Effective context engineering for AI agents.","Anthropic Effective context engineering for AI agents","w"],
["Liu, N. et al. (2023). Lost in the Middle: How Language Models Use Long Contexts.","Lost in the Middle: How Language Models Use Long Contexts"],
["Chroma (2025). Context Rot: How Increasing Input Tokens Impacts LLM Performance.","Chroma Context Rot increasing input tokens","w"],
["Packer, C. et al. (2023). MemGPT: Towards LLMs as Operating Systems.","MemGPT Towards LLMs as Operating Systems"]]
});

D(17,{
h:"A recuperação de informação é uma área antiga: o sistema SMART, de Gerard Salton, surgiu nos anos 1960, e Karen Spärck Jones propôs em 1972 o peso IDF, base do TF-IDF. Em 2011, o IBM Watson venceu no Jeopardy! combinando busca e análise de texto. O DrQA (Chen et al., 2017) respondia perguntas lendo a Wikipedia, e o DPR (Karpukhin et al., 2020) trouxe a busca densa com embeddings. O termo RAG foi cunhado por Lewis et al., do Facebook AI, em 2020.",
he:"Information retrieval is an old field: Gerard Salton's SMART system appeared in the 1960s, and Karen Spärck Jones proposed IDF weighting in 1972, the basis of TF-IDF. In 2011, IBM Watson won Jeopardy! by combining search and text analysis. DrQA (Chen et al., 2017) answered questions by reading Wikipedia, and DPR (Karpukhin et al., 2020) brought dense retrieval with embeddings. The term RAG was coined by Lewis et al., at Facebook AI, in 2020.",
a:"RAG virou o padrão para assistentes corporativos. As versões avançadas combinam busca híbrida, reranking e recuperação contextual; o GraphRAG usa grafos de conhecimento; e o RAG agêntico deixa o modelo decidir quando buscar, o que buscar e se precisa buscar de novo. Para avaliar, frameworks como o RAGAS (Es et al., 2023) medem fidelidade às fontes, relevância da resposta e qualidade da recuperação. Modelos com contexto longo reduziram a necessidade em bases pequenas, mas o RAG segue vencendo em bases grandes, dinâmicas e com permissões.",
ae:"RAG became the standard for enterprise assistants. Advanced versions combine hybrid search, reranking and contextual retrieval; GraphRAG uses knowledge graphs; and agentic RAG lets the model decide when to search, what to search for and whether to search again. For evaluation, frameworks such as RAGAS (Es et al., 2023) measure faithfulness to sources, answer relevance and retrieval quality. Long-context models reduced the need for small corpora, but RAG still wins for large, dynamic and permissioned corpora.",
r:"O AI PM cuida de algo que ninguém costuma assumir: a qualidade do conteúdo. Documentos desatualizados geram respostas erradas, então é preciso uma governança de conteúdo junto com o time de suporte, definir a fonte da verdade, desenhar como as citações aparecem e criar um ciclo em que respostas erradas viram correções nos documentos. As métricas incluem resolução correta e taxa de encaminhamento para humanos.",
re:"The AI PM takes care of something nobody usually owns: content quality. Outdated documents produce wrong answers, so content governance with the support team is needed, along with defining the source of truth, designing how citations appear and creating a loop where wrong answers become document fixes. Metrics include correct resolution and handoff rate to humans.",
refs:[["Lewis, P. et al. (2020). Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks. NeurIPS.","Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"],
["Karpukhin, V. et al. (2020). Dense Passage Retrieval for Open-Domain Question Answering. EMNLP.","Dense Passage Retrieval for Open-Domain Question Answering"],
["Es, S. et al. (2023). RAGAS: Automated Evaluation of Retrieval Augmented Generation.","RAGAS Automated Evaluation of Retrieval Augmented Generation"],
["Gao, Y. et al. (2023). Retrieval-Augmented Generation for Large Language Models: A Survey.","Retrieval-Augmented Generation for Large Language Models: A Survey"]]
});

D(18,{
h:"O ajuste fino (fine-tuning) virou prática comum com a transferência de aprendizado: redes treinadas no ImageNet eram adaptadas para outras tarefas a partir de 2014. Em texto, o ULMFiT (Howard e Ruder, 2018) e o BERT (2018) consolidaram o padrão \"pré-treinar e ajustar\". O GPT-3 (2020) mostrou que, muitas vezes, bastava um bom prompt. Depois, técnicas eficientes como LoRA (Hu et al., 2021) e QLoRA (Dettmers et al., 2023) tornaram o ajuste fino muito mais barato.",
he:"Fine-tuning became common practice with transfer learning: networks trained on ImageNet were adapted to other tasks from 2014 onward. In text, ULMFiT (Howard and Ruder, 2018) and BERT (2018) consolidated the \"pre-train then fine-tune\" pattern. GPT-3 (2020) showed that a good prompt was often enough. Later, efficient techniques such as LoRA (Hu et al., 2021) and QLoRA (Dettmers et al., 2023) made fine-tuning much cheaper.",
a:"O consenso atual, refletido nos guias dos fornecedores, é: comece pelo prompt, use RAG para conhecimento e reserve o ajuste fino para formato, estilo, tarefas específicas ou para reduzir custo e latência, por exemplo destilando um modelo grande em um menor. O estudo de Ovadia et al. (2023) mostrou que o RAG supera o ajuste fino na hora de incorporar conhecimento novo. Fornecedores também passaram a oferecer ajuste fino por reforço, com avaliadores automáticos, entre 2024 e 2025.",
ae:"The current consensus, reflected in vendor guides, is: start with the prompt, use RAG for knowledge and reserve fine-tuning for format, style, specific tasks or to reduce cost and latency, for example by distilling a large model into a smaller one. Ovadia et al. (2023) showed that RAG beats fine-tuning when it comes to adding new knowledge. Vendors also began offering reinforcement fine-tuning with automated graders between 2024 and 2025.",
r:"O AI PM transforma essa escolha num documento curto de decisão, com custo esperado, tempo, manutenção e forma de atualizar as informações. Vale lembrar que o ajuste fino exige um fluxo contínuo de dados rotulados e precisa ser refeito quando o modelo base muda. Saber justificar por que você não fez ajuste fino mostra maturidade em entrevistas.",
re:"The AI PM turns this choice into a short decision document, with expected cost, time, maintenance and how information gets updated. Remember that fine-tuning requires a continuous flow of labeled data and must be redone when the base model changes. Being able to justify why you did not fine-tune shows maturity in interviews.",
refs:[["Howard, J. e Ruder, S. (2018). Universal Language Model Fine-tuning for Text Classification. ACL.","Universal Language Model Fine-tuning for Text Classification"],
["Hu, E. et al. (2021). LoRA: Low-Rank Adaptation of Large Language Models.","LoRA Low-Rank Adaptation of Large Language Models"],
["Dettmers, T. et al. (2023). QLoRA: Efficient Finetuning of Quantized LLMs. NeurIPS.","QLoRA Efficient Finetuning of Quantized LLMs"],
["Ovadia, O. et al. (2023). Fine-Tuning or Retrieval? Comparing Knowledge Injection in LLMs.","Fine-Tuning or Retrieval? Comparing Knowledge Injection in LLMs"]]
