/* ============ QUIZ ============ */
async function makeQuiz(l){
  const btn=$("#quizBtn"), box=$("#quiz"), msg=$("#quizMsg"); msg.textContent="";
  const sample=await getSample();
  if(!sample||sampleOff){msg.textContent=u("quiz_off");return;}
  btn.disabled=true; btn.textContent=u("quiz_creating");
  box.innerHTML=`<p class="msg thinking" style="padding:0">${u("quiz_thinking")}</p>`;
  const K=tx(l,"k");
  const lang=EN()?"in English":"em português do Brasil";
  const prompt=`${RULES()}\n\nCreate 3 multiple-choice questions, written ${lang}, about the lesson below. Mix one conceptual question, one about applying it in a product and one about a PM decision. Each question has 4 plausible options and only one correct answer. Do not use dashes as punctuation.\n\n${tx(l,"t")}\n${tx(l,"s")}\nConcepts: ${K.map(([a,b])=>a+": "+b).join(" | ")}\n\nReply with only a JSON array in this format: [{"q":"question","o":["a","b","c","d"],"a":0,"why":"short explanation of the correct answer"}]`;
  try{
    const qs=await sample.json(prompt,{cache:false});
    if(!Array.isArray(qs)||!qs.length) throw {code:"invalid_json"};
    let answered=0,score=0; const n=Math.min(3,qs.length);
    box.innerHTML=qs.slice(0,3).map((q,i)=>`<div class="quiz-q" data-i="${i}"><p>${i+1}. ${esc(cleanDash(q.q))}</p><div class="opts">${(q.o||[]).map((o,j)=>`<button class="opt" data-j="${j}">${esc(cleanDash(o))}</button>`).join("")}</div><div class="why" hidden></div></div>`).join("");
    box.querySelectorAll(".quiz-q").forEach(qe=>{
      const q=qs[+qe.dataset.i];
      qe.querySelectorAll(".opt").forEach(ob=>ob.addEventListener("click",()=>{
        const j=+ob.dataset.j, right=Number(q.a);
        qe.querySelectorAll(".opt").forEach((x,xi)=>{x.disabled=true;if(xi===right)x.classList.add("right");});
        if(j!==right) ob.classList.add("wrong"); else score++;
        const w=qe.querySelector(".why"); w.hidden=false; w.textContent=(j===right?u("quiz_right"):u("quiz_wrong"))+cleanDash(q.why||"");
        if(++answered===n){state.quiz=Object.assign({},state.quiz,{[l.num]:{s:score,t:n}});persist();toast(u("quiz_score",score,n));}
      }));
    });
    btn.textContent=u("quiz_new");
  }catch(e){
    box.innerHTML="";
    msg.textContent=(e&&e.code==="invalid_json")?u("quiz_bad"):errCopy(e&&e.code);
    btn.textContent=u("quiz_gen");
  }
  btn.disabled=false;
}

/* ============ CHAT ============ */
function mountChat(el,opts){
  const turns=(state.chats[opts.key]||[]).slice();
  el.innerHTML=`<section class="chat ${opts.full?"full":""}" aria-label="${esc(opts.title)}">
    <div class="chat-head"><h2>${esc(opts.title)}</h2><p>${esc(opts.sub)}</p><button type="button" class="chat-close" aria-label="${EN()?"Close":"Fechar"}">✕</button></div>
    <div class="msgs" aria-live="polite"></div>
    <div class="chips">${opts.chips.map(c=>`<button class="chip">${esc(c)}</button>`).join("")}</div>
    <form class="composer">
      <label class="sr" for="in-${opts.key}">${u("q_label")}</label>
      <textarea id="in-${opts.key}" rows="1" placeholder="${u("ph")}"></textarea>
      <button class="btn" type="submit">${u("send")}</button>
    </form>
    <div class="chat-off" hidden>${u("chat_off")}</div>
  </section>`;
  const msgs=el.querySelector(".msgs"), ta=el.querySelector("textarea"), form=el.querySelector("form"), sendBtn=form.querySelector("button");
  const off=()=>{form.hidden=true;el.querySelector(".chips").hidden=true;el.querySelector(".chat-off").hidden=false;};
  function draw(){
    if(!turns.length){msgs.innerHTML=`<p class="empty-chat">${u("empty_chat")}</p>`;return;}
    msgs.innerHTML=turns.map(t=>t.role==="user"?`<div class="msg me">${esc(t.content)}</div>`:`<div class="msg ai">${md(t.content)}</div>`).join("");
    msgs.scrollTop=msgs.scrollHeight;
  }
  draw();
  getSample().then(s=>{if(!s) off();});
  let busy=false;
  async function send(text){
    text=(text||"").trim(); if(!text||busy) return;
    const sample=await getSample();
    if(!sample||sampleOff){off();return;}
    busy=true; sendBtn.disabled=true; ta.value="";
    turns.push({role:"user",content:text}); draw();
    const bubble=document.createElement("div"); bubble.className="msg ai thinking"; bubble.innerHTML=`<span class="typing" aria-label="${u("thinking")}"><i></i><i></i><i></i></span>`;
    msgs.appendChild(bubble); msgs.scrollTop=msgs.scrollHeight;
    const lead=RULES()+(opts.context?"\n\nContext:\n"+opts.context:"")+"\n\nThe conversation with Thais follows.";
    const recent=turns.slice(-10); if(recent[0].role!=="user") recent.shift();
    chatAbort=new AbortController();
    try{
      const {text:ans}=await sample([{role:"user",content:lead},...recent],{cache:false,signal:chatAbort.signal,onText:({text})=>{bubble.classList.remove("thinking");bubble.innerHTML=md(text);msgs.scrollTop=msgs.scrollHeight;}});
      turns.push({role:"assistant",content:cleanDash(ans)});
      state.chats=Object.assign({},state.chats); state.chats[opts.key]=turns.slice(-16).map(t=>({role:t.role,content:t.content.slice(0,4000)})); persist();
    }catch(e){
      if(e&&e.code==="cancelled"){busy=false;return;}
      const c=errCopy(e&&e.code);
      if(e&&e.text) turns.push({role:"assistant",content:cleanDash(e.text)}); else turns.pop();
      draw();
      const n=document.createElement("p"); n.className="note-err"; n.style.padding="0 4px"; n.textContent=c; msgs.appendChild(n);
      if(sampleOff) off();
      chatAbort=null; busy=false; sendBtn.disabled=false; return;
    }
    chatAbort=null; busy=false; sendBtn.disabled=false; draw();
  }
  form.addEventListener("submit",e=>{e.preventDefault();send(ta.value);});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(ta.value);}});
  ta.addEventListener("input",()=>{ta.style.height="46px";ta.style.height=Math.min(ta.scrollHeight,140)+"px";});
  el.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>send(c.textContent)));
  return {send};
}

  app.querySelectorAll(".seg").forEach(b=>b.addEventListener("click",()=>{
    S[b.dataset.g]=b.dataset.v; persist();
    app.querySelectorAll(`.seg[data-g="${b.dataset.g}"]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  }));
  $("#ivNew").addEventListener("click",()=>newQuestion());
  const cl=$("#ivClear"); if(cl) cl.addEventListener("click",()=>{S.history=[];persist();render();toast(iv("cleared"));});
  drawCurrent(); drawHistory();
}

function topicContext(){
  const S=state.iv;
  let ls=LESSONS;
  if(S.topic==="done"){const d=LESSONS.filter(l=>state.done[l.num]);if(d.length) ls=d;}
  else if(S.topic.startsWith("m")){const m=MODULES[+S.topic.slice(1)-1]; if(m) ls=m.lessons;}
  return ls.map(l=>{const e=l.en||l;return "- "+e.t+": "+e.k.map(k=>k[0]).join(", ");}).join("\n");
}

async function newQuestion(q){
  const S=state.iv, msg=$("#ivMsg"); msg.textContent="";
  if(q){S.cur={q:q.q,hint:q.hint||"",answer:"",fb:null,start:Date.now()};persist();drawCurrent();window.scrollTo({top:$("#ivCur").offsetTop-90,behavior:"smooth"});return;}
  const sample=await getSample();
  if(!sample||sampleOff){msg.textContent=iv("off");return;}
  const btn=$("#ivNew"); btn.disabled=true; btn.textContent=iv("gen");
  const types={concept:"a conceptual question that checks deep understanding of AI concepts, as a PM would need to explain them",
    product:"a product sense question: designing or improving an AI-powered product or feature for a realistic scenario",
    tradeoff:"a technical trade-off question: choosing between approaches (e.g. RAG vs fine-tuning, model choice, cost vs latency, agent vs workflow) and defending the decision",
    behavioral:"a behavioral question about leading AI product work (tell me about a time...), which she can answer from her experience as a Senior PM with a Product Design background"};
  const recent=S.history.slice(0,8).map(h=>"- "+h.q).join("\n")||"none";
  const prompt=`You are an experienced interviewer hiring a ${S.level==="staff"?"Staff or Lead":"Senior"} AI Product Manager at an international tech company. ${PROFILE}\n\nWrite ONE interview question in English. Type: ${types[S.type]}. Base it on these study topics:\n${topicContext()}\n\nAvoid repeating these recent questions:\n${recent}\n\nAlso write a short hint (in ${iv("fb_lang")}, max 40 words) about what a strong answer should cover, without giving the answer away. Never use em dashes or en dashes.\n\nReply with only JSON: {"q":"question","hint":"hint"}`;
  try{
    const r=await sample.json(prompt,{cache:false});
    if(!r||!r.q) throw {code:"invalid_json"};
    S.cur={q:cleanDash(r.q),hint:cleanDash(r.hint||""),answer:"",fb:null,start:Date.now()};
    persist(); drawCurrent();
  }catch(e){ msg.textContent=(e&&e.code==="invalid_json")?iv("bad"):errCopy(e&&e.code); }
  btn.disabled=false; btn.textContent=state.iv.cur?iv("another"):iv("newq");
}

function drawCurrent(){
  const box=$("#ivCur"); if(!box) return;
  clearInterval(ivTimer);
  const S=state.iv, c=S.cur;
  if(!c){box.innerHTML=`<p class="iv-empty">${iv("empty")}</p>`;return;}
  box.innerHTML=`
  <section class="block iv-q">
    <div class="iv-qlab">${iv("qlabel")}</div>
    <p class="iv-question">${esc(c.q)}</p>
    ${c.hint?`<button class="ask-link" id="ivHintBtn">${iv("hint")}</button><p class="iv-hint" id="ivHint" hidden>${esc(c.hint)}</p>`:""}
    <label class="iv-lab" for="ivAns" style="display:block;margin:16px 0 8px">${iv("ans_label")}</label>
    <textarea id="ivAns" lang="en" spellcheck="true" style="min-height:220px" placeholder="${iv("ans_ph")}" ${c.fb?"readonly":""}>${esc(c.answer||"")}</textarea>
    <div class="iv-meta"><span id="ivWords"></span><span id="ivTime"></span></div>
    ${c.fb?"":`<button class="btn" id="ivSubmit">${iv("submit")}</button>`}
    <div class="note-err" id="ivErr"></div>
  </section>
  <div id="ivFb"></div>`;
  const ta=$("#ivAns");
  const wc=()=>{const n=(ta.value.trim().match(/\S+/g)||[]).length;$("#ivWords").textContent=iv("words")(n);return n;};
  wc();
  const tick=()=>{const end=c.fb?c.fb.at:Date.now();$("#ivTime").textContent=iv("time")(fmtTime(Math.max(0,Math.round((end-(c.start||end))/1000))));};
  tick(); if(!c.fb) ivTimer=setInterval(()=>{if(!document.body.contains(ta)){clearInterval(ivTimer);return;}tick();},1000);
  let t; ta.addEventListener("input",()=>{wc();c.answer=ta.value;clearTimeout(t);t=setTimeout(persist,700);});
  const hb=$("#ivHintBtn"); if(hb) hb.addEventListener("click",()=>{const h=$("#ivHint");h.hidden=!h.hidden;hb.textContent=h.hidden?iv("hint"):iv("hide_hint");});
  const sb=$("#ivSubmit"); if(sb) sb.addEventListener("click",()=>review(wc()));
  if(c.fb) drawFeedback(c);
}

async function review(words){
  const S=state.iv, c=S.cur, err=$("#ivErr"); err.textContent="";
  if(words<40){err.textContent=iv("short");return;}
  const sample=await getSample();
  if(!sample||sampleOff){err.textContent=iv("off");return;}
  const btn=$("#ivSubmit"); btn.disabled=true; btn.textContent=iv("reviewing");
  const at=Date.now();
  const prompt=`You are a senior interviewer hiring a ${S.level==="staff"?"Staff or Lead":"Senior"} AI Product Manager at an international tech company, and also an English communication coach. ${PROFILE} She is a fluent, non-native English speaker from Brazil.\n\nQuestion: ${c.q}\n\nHer answer (written as she would speak it):\n"""${(c.answer||"").slice(0,8000)}"""\n\nEvaluate two things: the CONTENT (structure, depth, AI/PM judgment, trade-offs, metrics, specificity) and the ENGLISH (clarity, grammar, naturalness, professional tone). Be encouraging but honest and specific. Write all explanations in ${iv("fb_lang")}. Keep "original", "better", "term" and "polished" in English. Never use em dashes or en dashes.\n\nReply with only JSON:\n{"content_score":1-5,"english_score":1-5,"strengths":["2 to 3 items"],"improve":["2 to 4 concrete items"],"corrections":[{"original":"exact phrase from her answer","better":"more natural English","why":"short reason"}],"vocabulary":[{"term":"useful English phrase","tip":"when to use it"}],"polished":"an improved version of HER answer in natural spoken English, keeping her ideas and experience, about the same length","follow_up":"one realistic follow-up question in English"}\nInclude up to 5 corrections (empty array if none are needed) and 3 vocabulary items.`;
  try{
    const r=await sample.json(prompt,{cache:false});
    if(!r||typeof r!=="object"||!r.polished) throw {code:"invalid_json"};
    const clampS=v=>Math.max(1,Math.min(5,Math.round(Number(v)||0)));
    c.fb={cs:clampS(r.content_score),es:clampS(r.english_score),
      strengths:(r.strengths||[]).map(cleanDash),improve:(r.improve||[]).map(cleanDash),
      corrections:(r.corrections||[]).slice(0,6).map(x=>({o:cleanDash(x.original||""),b:cleanDash(x.better||""),w:cleanDash(x.why||"")})),
      vocab:(r.vocabulary||[]).slice(0,4).map(x=>({t:cleanDash(x.term||""),p:cleanDash(x.tip||"")})),
      polished:cleanDash(r.polished),follow:cleanDash(r.follow_up||""),at};
    S.history.unshift({q:c.q,cs:c.fb.cs,es:c.fb.es,date:at,type:S.type});
    S.history=S.history.slice(0,30);
    persist(); drawCurrent(); drawHistory();
    $("#ivFb").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    err.textContent=(e&&e.code==="invalid_json")?iv("bad"):errCopy(e&&e.code);
    btn.disabled=false; btn.textContent=iv("submit");
  }
}

function drawFeedback(c){
  const f=c.fb, box=$("#ivFb");
  const dots=n=>`<span class="dots" aria-label="${n}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;
  const list=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
  box.innerHTML=`
  <section class="block iv-fb">
    <div class="scores">
      <div class="score-card" style="--c:var(--m5);--ci:var(--m5i)"><span>${iv("content")}</span><b>${f.cs}/5</b>${dots(f.cs)}</div>
      <div class="score-card" style="--c:var(--m2);--ci:var(--m2i)"><span>${iv("english")}</span><b>${f.es}/5</b>${dots(f.es)}</div>
    </div>
    <div class="fb-cols">
      <div><h3>${iv("strengths")}</h3>${list(f.strengths)}</div>
      <div><h3>${iv("improve")}</h3>${list(f.improve)}</div>
    </div>
    <h3>${iv("corrections")}</h3>
    ${f.corrections.length?`<div class="corrs">${f.corrections.map(x=>`<div class="corr"><div class="c-o" lang="en">${esc(x.o)}</div><div class="c-b" lang="en">${esc(x.b)}</div><p>${esc(x.w)}</p></div>`).join("")}</div>`:`<p>${iv("no_corr")}</p>`}
    ${f.vocab.length?`<h3>${iv("vocab")}</h3><div class="vocab">${f.vocab.map(v=>`<div><b lang="en">${esc(v.t)}</b><p>${esc(v.p)}</p></div>`).join("")}</div>`:""}
    <h3>${iv("polished")}</h3>
    <div class="polished" lang="en">${md(f.polished)}</div>
    <button class="btn ghost" id="ivCopy" style="margin-top:10px">${iv("copy")}</button>
    ${f.follow?`<div class="follow"><h3>${iv("follow")}</h3><p lang="en">${esc(f.follow)}</p><button class="btn" id="ivFollow">${iv("answer_follow")}</button></div>`:""}
  </section>`;
  $("#ivCopy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(f.polished);toast(iv("copied"));}catch(e){}});
  const fu=$("#ivFollow"); if(fu) fu.addEventListener("click",()=>newQuestion({q:f.follow}));
}

function drawHistory(){
  const box=$("#ivHist"); if(!box) return;
  const H=state.iv.history;
  if(!H.length){box.innerHTML=`<p style="color:var(--muted);margin:0">${iv("no_history")}</p>`;return;}
  const loc=EN()?"en-US":"pt-BR";
  box.innerHTML=`<ul class="hist">${H.map((h,i)=>`<li><div class="h-q" lang="en">${esc(h.q)}</div>
    <div class="h-meta"><span>${new Date(h.date).toLocaleDateString(loc,{day:"2-digit",month:"short"})}</span><span>${esc(iv("types")[h.type]||"")}</span>
    <span class="h-s" style="--c:var(--m5);--ci:var(--m5i)">${iv("content")} ${h.cs}/5</span><span class="h-s" style="--c:var(--m2);--ci:var(--m2i)">${iv("english")} ${h.es}/5</span>
    <button class="ask-link" data-retry="${i}">${iv("retry")}</button></div></li>`).join("")}</ul>`;
  box.querySelectorAll("[data-retry]").forEach(b=>b.addEventListener("click",()=>newQuestion({q:H[+b.dataset.retry].q})));
}

/* ============ INÍCIO ============ */
loadLocal(); applyTheme(); render(); initStore();
</script>
</body>
