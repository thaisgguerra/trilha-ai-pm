<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F3FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13122A" media="(prefers-color-scheme: dark)">
<title>Trilha AI PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#1D2133; --muted:#5A6075; --line:#E3E6EF;
  --brand:#3D6BF0; --brandi:#3963DC; --ok:#1E8E5A; --oki:#1B7A4E; --warn:#B4442A;
  --m1:#7B61FF; --m2:#12A38A; --m3:#F2704F; --m4:#F0A030; --m5:#3B82F6; --m6:#E0569A; --m7:#36A15A; --m8:#FF8640; --m9:#5260D9;
  --m1i:#6C56DF; --m2i:#137A6E; --m3i:#AB5443; --m4i:#94662D; --m5i:#326AC9; --m6i:#AF477F; --m7i:#2D7C4D; --m8i:#A65C38; --m9i:#515FD5;
  --c:var(--brand); --ci:var(--brandi); --btn:#3963DC; --on-ci:#FFFFFF;
  --shadow:0 1px 2px rgba(29,33,51,.05), 0 6px 20px rgba(29,33,51,.06);
  --display:"Google Sans Flex","Google Sans","Product Sans","Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Google Sans Flex","Google Sans Text","Google Sans","Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141724; --surface:#1E2232; --surface-2:#262B3D; --ink:#E9ECF5; --muted:#A6ACC2; --line:#333A50;
    --brand:#6086F3; --brandi:#7A9BF6; --ok:#3CB878; --oki:#4CC488;
    --m1i:#9C8AFF; --m2i:#2CC0A5; --m3i:#F58A6E; --m4i:#F3B254; --m5i:#6AA0F8; --m6i:#EA7BB2; --m7i:#55BC77; --m8i:#FF9C62; --m9i:#8D97E8; --btn:#3D6BF0; --on-ci:#141724;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#141724; --surface:#1E2232; --surface-2:#262B3D; --ink:#E9ECF5; --muted:#A6ACC2; --line:#333A50;
  --brand:#6086F3; --brandi:#7A9BF6; --ok:#3CB878; --oki:#4CC488;
  --m1i:#9C8AFF; --m2i:#2CC0A5; --m3i:#F58A6E; --m4i:#F3B254; --m5i:#6AA0F8; --m6i:#EA7BB2; --m7i:#55BC77; --m8i:#FF9C62; --m9i:#8D97E8; --btn:#3D6BF0; --on-ci:#141724;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.28);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
a{color:var(--brand)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px;background:var(--surface);box-shadow:var(--shadow)}
.brand-mark i{border-radius:3px}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center}

main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

/* Hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:stretch}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.02em;margin:0 0 14px}
.hero p.lead{font-size:18px;color:var(--muted);max-width:52ch;margin:0 0 22px}
.hero-left{padding:8px 0}
.continue{background:var(--surface);border-radius:28px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.ring-row{display:flex;align-items:center;gap:18px}
.ring{--p:0;width:108px;height:108px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%), var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px}
.ring-row p{margin:0;color:var(--muted);font-size:15px}
.ring-row strong{display:block;color:var(--ink);font-size:17px}
.minibars{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;align-items:end;height:64px;margin-top:auto}
.minibars a{display:block;height:100%;border-radius:8px;background:color-mix(in srgb,var(--c) 16%,var(--surface-2));position:relative;overflow:hidden}
.minibars a i{position:absolute;left:0;right:0;bottom:0;background:var(--ci);border-radius:8px}
.minibars-l{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.next-box{border-radius:18px;padding:14px 16px;background:var(--surface-2);border-left:6px solid var(--c,var(--brand))}
.next-box small{color:var(--muted);display:block;font-size:13px}
.next-box b{font-size:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--brand);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--surface);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--c,var(--brand)) 45%,transparent)}
.btn.done{background:var(--ok)}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* Ribbon: 32 stops */
.ribbon{margin:30px 0 8px;background:var(--surface);border-radius:24px;padding:20px 22px;box-shadow:var(--shadow)}
.ribbon-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:14px;flex-wrap:wrap}
.ribbon-head h2{font-family:var(--display);font-size:20px;margin:0}
.ribbon-head span{color:var(--muted);font-size:14px}
.stops{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 2px 10px}
.stop-group{display:flex;gap:5px;align-items:center;padding:6px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.stop{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c);background:var(--surface);color:var(--ci);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none;padding:0;transition:transform .15s}
.stop:hover{transform:scale(1.12)}
.stop.is-done{background:var(--ci);color:#fff}
.stop.is-next{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--ci)}

/* About */
details.about{margin:18px 0 34px;background:var(--surface);border-radius:20px;padding:4px 20px;box-shadow:var(--shadow)}
details.about summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.about summary::-webkit-details-marker{display:none}
details.about summary::after{content:"+";font-size:22px;color:var(--muted)}
details.about[open] summary::after{content:"−"}
details.about .about-body{padding:0 0 18px;color:var(--muted);max-width:75ch}
details.about .about-body p{margin:0 0 10px}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.flow span{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600}

/* Modules */
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.module{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.mod-head{padding:20px 22px 16px;background:color-mix(in srgb,var(--c) 13%,var(--surface));position:relative}
.mod-num{font-family:var(--display);font-weight:800;font-size:15px;color:var(--ci);display:flex;justify-content:space-between;align-items:center}
.mod-head h3{font-family:var(--display);font-size:21px;line-height:1.15;margin:6px 0 8px;letter-spacing:-.01em}
.mod-head p{margin:0;color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,var(--surface));margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ci);border-radius:99px;transition:width .4s}
.lessons{list-style:none;margin:0;padding:8px 10px 12px}
.lessons a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;text-decoration:none;color:var(--ink)}
.lessons a:hover{background:var(--surface-2)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ci)}
.chk.on{background:var(--ci);color:#fff}
.lessons .t{flex:1;font-weight:600;font-size:15px;line-height:1.35}
.lessons .n{font-size:12px;color:var(--muted);font-weight:700;display:block}
.lessons .ex .t{font-weight:700}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink)}

/* Lesson */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;text-decoration:none;margin-bottom:14px}
.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.l-head{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-radius:28px;padding:26px 28px;margin-bottom:18px}
.l-kicker{color:var(--ci);font-weight:800;font-family:var(--display);font-size:15px}
.l-head h1{font-family:var(--display);font-size:clamp(28px,3.6vw,42px);line-height:1.08;letter-spacing:-.015em;margin:6px 0 18px}
.l-actions{display:flex;flex-wrap:wrap;gap:10px}
.block{background:var(--surface);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}
.block h2{font-family:var(--display);font-size:21px;margin:0 0 12px;letter-spacing:-.01em}
.block p{margin:0 0 10px;max-width:72ch}
.concepts{display:grid;gap:10px}
.concept{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface-2)}
.concept b{display:block;font-size:16px;margin-bottom:3px}
.concept p{margin:0;color:var(--muted);font-size:15px}
.ask-link{margin-top:8px;background:none;border:0;padding:0;color:var(--ci);font-weight:700;font-size:14px}
.pm-note{border-radius:20px;padding:18px 20px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1.5px dashed color-mix(in srgb,var(--c) 55%,transparent);margin-bottom:16px}
.pm-note b{font-family:var(--display);font-size:17px;display:block;margin-bottom:4px}
.pm-note p{margin:0;max-width:72ch}
textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--surface-2);resize:vertical;line-height:1.5}
textarea:focus{outline:none;border-color:var(--ci)}
.save-state{font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.pager a{flex:1;min-width:200px;background:var(--surface);border-radius:18px;padding:14px 18px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:13px}
.pager a.next{text-align:right}

/* Quiz */
.quiz-q{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:var(--surface-2)}
.quiz-q p{font-weight:700;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--ci)}
.opt.right{border-color:var(--oki);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--m3);background:color-mix(in srgb,var(--m3) 10%,var(--surface))}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:14px;color:var(--muted)}
.score{font-weight:700;margin-top:6px}

/* Chat */
.chat{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 110px);overflow:hidden}
.chat.full{position:static;max-height:none;min-height:70vh}
.chat-head{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.chat-head h2{font-family:var(--display);font-size:19px;margin:0}
.chat-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:180px}
.msg{max-width:92%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.5;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--ci);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin:0}
.msg.ai ul,.msg.ai ol{margin:4px 0 8px;padding-left:20px}
.msg.ai code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:.92em}
.msg.ai pre{background:var(--line);padding:10px;border-radius:10px;overflow-x:auto}
.msg.thinking{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink)}
.chip:hover{border-color:var(--ci)}
.composer{display:flex;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.composer textarea{min-height:46px;height:46px;max-height:140px;border-radius:14px;padding:11px 12px;font-size:15px}
.composer .btn{padding:0 16px}
.empty-chat{color:var(--muted);font-size:14px;text-align:center;margin:auto;max-width:28ch}
.chat-off{padding:18px 20px;color:var(--muted);font-size:14px}
.note-err{color:var(--warn);font-size:14px;margin-top:8px}

/* Glossary */
.page-title{font-family:var(--display);font-size:clamp(30px,4vw,44px);letter-spacing:-.02em;margin:0 0 6px}
.page-sub{color:var(--muted);margin:0 0 20px;max-width:60ch}
.search{width:100%;max-width:520px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 16px;font-size:16px;margin-bottom:20px}
.search:focus{outline:none;border-color:var(--brand)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.g-item{background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);border-top:5px solid var(--c)}
.g-item b{display:block;font-size:16px;margin-bottom:4px}
.g-item p{margin:0 0 8px;color:var(--muted);font-size:14.5px}
.g-item a{font-size:13px;font-weight:700;color:var(--ci);text-decoration:none}
.chat-wrap{max-width:820px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.celebrate{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

@media (max-width:1020px){
  .lesson-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .top-in{flex-wrap:wrap;gap:10px}
  .nav{margin-left:0;order:3;width:100%}
  .top-right{margin-left:auto}
  .modules{grid-template-columns:1fr}
  main{padding:20px 14px 70px}
  .l-head{padding:20px}
  .block{padding:18px}
}
.top-right{display:flex;gap:8px;align-items:center}
.hero-side{display:grid;gap:14px;align-content:start}
.pts-card{background:linear-gradient(135deg,color-mix(in srgb,var(--m4) 18%,var(--surface)),color-mix(in srgb,var(--m6) 10%,var(--surface)))}
.pts-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pts-top small{color:var(--muted);font-weight:700;font-size:13px;display:block}
.pts-big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1}
.pts-big span{font-size:16px;color:var(--muted);font-weight:700}
.rank{text-align:right}.rank b{font-family:var(--display);font-size:17px}
.pts-bar{position:relative;height:12px;border-radius:99px;background:color-mix(in srgb,var(--m4) 22%,var(--surface))}
.pts-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--m4),var(--m8));transition:width .5s}
.pts-bar em{position:absolute;top:-3px;width:3px;height:18px;border-radius:3px;background:var(--ink);opacity:.35}
.pts-sub{margin:0;color:var(--muted);font-size:13.5px}
.pts-pill{background:color-mix(in srgb,var(--m4) 18%,var(--surface))}
.mod-tags{display:flex;gap:6px}
.lp{font-weight:800;color:var(--m8);margin-left:4px}
.fq-meta{display:flex;gap:6px;margin-bottom:8px}
.fq-lv,.fq-pts{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
.fq-lv.lv1{background:color-mix(in srgb,var(--m2) 16%,transparent);color:var(--m2)}
.fq-lv.lv2{background:color-mix(in srgb,var(--m8) 16%,transparent);color:var(--m8)}
.fq-lv.lv3{background:color-mix(in srgb,var(--m6) 16%,transparent);color:var(--m6)}
.fq-pts{background:var(--surface);border:1px solid var(--line)}
.fq-opt.sel{border-color:var(--ci);background:color-mix(in srgb,var(--c) 10%,var(--surface));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent)}
.fq-opt.sel .fq-l{background:var(--ci);color:#fff}
.fq-confirm{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.fq-confirm .btn{background:var(--ci)}
.fq-hint{font-size:13px;color:var(--muted)}
.fq-res{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.fq-earn{font-weight:800;font-size:13px;color:var(--muted)}
.fq-earn.pos{color:var(--oki)}
.fq-actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.fq-actions .ask-link{margin:0}
@media (max-width:760px){.pts-pill{display:none}}

.fq{border-top:6px solid var(--c)}
.fq-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fq-head h2{display:flex;align-items:center;gap:10px;margin:0}
.fq-pill{font-size:13px;font-weight:800;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.fq-intro{color:var(--muted);margin:8px 0 16px!important}
.fq-q{border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:var(--surface-2)}
.fq-q.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.fq-q.no{border-color:color-mix(in srgb,var(--m3) 45%,transparent)}
.fq-text{font-weight:700;margin:0 0 12px!important;display:flex;gap:10px;line-height:1.5}
.fq-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ci);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.fq-opts{display:grid;gap:8px}
.fq-opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.45}
.fq-opt:hover:not(:disabled){border-color:var(--ci);transform:translateY(-1px)}
.fq-opt:disabled{cursor:default}
.fq-l{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12.5px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.fq-opt.right{border-color:var(--oki);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.fq-opt.right .fq-l{background:var(--ok);color:#fff}
.fq-opt.wrong{border-color:var(--m3);background:color-mix(in srgb,var(--m3) 10%,var(--surface))}
.fq-opt.wrong .fq-l{background:var(--m3);color:#fff}
.fq-why{margin-top:12px;font-size:14.5px;line-height:1.6;padding:12px 14px;border-radius:12px;background:var(--surface)}
.fq-why .fq-disc{display:block;margin-top:6px}
.fq-result{border-radius:18px;padding:16px 18px;margin-top:4px}
.fq-result b{font-family:var(--display);font-size:19px}
.fq-result p{margin:4px 0 12px!important}
.fq-result.r3{background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.fq-result.r2{background:color-mix(in srgb,var(--m4) 16%,var(--surface))}
.fq-result.r1{background:color-mix(in srgb,var(--m3) 11%,var(--surface))}

.simple{border-radius:24px;padding:20px 24px;margin-bottom:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--m4) 20%,var(--surface)),color-mix(in srgb,var(--c) 12%,var(--surface)));border:1.5px solid color-mix(in srgb,var(--m4) 45%,transparent)}
.simple-h{font-family:var(--display);font-weight:800;font-size:19px;display:flex;gap:10px;align-items:center;margin-bottom:6px}
.simple p{margin:0;font-size:16.5px;line-height:1.7;max-width:72ch}
.case{border-radius:22px;padding:20px 24px;margin-bottom:16px;background:var(--surface);box-shadow:var(--shadow);border-left:7px solid var(--c)}
.case-tag{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.02em;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.case h3{font-family:var(--display);font-size:21px;margin:10px 0 6px}
.case p{margin:0;line-height:1.7;max-width:72ch}
.deep p+p{margin-top:12px}
.res-details summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:21px;display:flex;align-items:center;gap:10px;list-style:none}
.res-details summary::-webkit-details-marker{display:none}
.res-details summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:24px}
.res-details[open] summary::after{content:"−"}
.res-details[open] summary{margin-bottom:12px}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.res-grid h3{font-family:var(--display);font-size:16px;margin:0 0 8px;color:var(--muted)}
.res-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.res-item{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.res-ico{font-size:18px;line-height:1.4}
.res-item a{color:var(--ink);text-decoration:none}.res-item a:hover b{color:var(--ci);text-decoration:underline}
.res-by{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.pt-ed{font-style:normal;font-weight:700;color:var(--oki);margin-left:4px}
.res-item p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.lib-mod{border-top:6px solid var(--c)}
.lib-kicker{font-family:var(--display);font-weight:800;color:var(--ci);font-size:14px}
.lib-mod h2{margin:2px 0 14px}
@media (max-width:760px){.res-grid{grid-template-columns:1fr}}

.deep h2,.refs h2{display:flex;align-items:center;gap:10px}
.ico{font-size:20px}
.deep p{line-height:1.7}
.refs ol{margin:0;padding-left:22px}
.refs li{margin-bottom:8px;font-size:14.5px}
.refs a{color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--c) 60%,transparent);text-underline-offset:3px}
.refs a:hover{color:var(--ci)}
.refs-note{font-size:13px;color:var(--muted);margin-top:10px}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-radius:22px;padding:20px 24px;margin-bottom:16px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 35%,transparent)}
.done-bar b{font-family:var(--display);font-size:19px}
.done-bar p{margin:2px 0 0;color:var(--muted);font-size:14px}
.done-bar.is-done{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-color:color-mix(in srgb,var(--ok) 45%,transparent)}

/* Interview */
.iv-wrap{max-width:900px}
.iv-row{margin-bottom:16px}
.iv-lab{display:block;font-weight:700;font-size:14px;color:var(--muted);margin-bottom:8px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600}
.seg[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.iv-empty{color:var(--muted);text-align:center;padding:26px;border:2px dashed var(--line);border-radius:22px;margin:0 0 16px}
.iv-q{border-top:6px solid var(--m6)}
.iv-qlab{font-family:var(--display);font-weight:800;color:var(--m6);font-size:15px}
.iv-question{font-family:var(--display);font-size:clamp(20px,2.4vw,26px);line-height:1.25;font-weight:700;margin:6px 0 8px;max-width:none}
.iv-q .ask-link{color:var(--m6)}
.iv-hint{background:color-mix(in srgb,var(--m6) 9%,var(--surface));border-radius:14px;padding:12px 14px;color:var(--ink);margin-top:8px}
.iv-meta{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:6px 0 12px;font-weight:600}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.score-card{border-radius:18px;padding:14px 16px;background:color-mix(in srgb,var(--c) 11%,var(--surface))}
.score-card span{display:block;font-weight:700;color:var(--muted);font-size:14px}
.score-card b{font-family:var(--display);font-size:32px;line-height:1.1;color:var(--ci)}
.score-card .dots{display:flex;gap:5px;margin-top:6px}.dots i{width:22px;height:7px;border-radius:9px;background:color-mix(in srgb,var(--c) 22%,transparent)}.dots i.on{background:var(--ci)}
.iv-fb h3{font-family:var(--display);font-size:17px;margin:18px 0 8px}
.iv-fb ul{margin:0;padding-left:20px}.iv-fb li{margin-bottom:5px}
.fb-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.fb-cols h3{margin-top:0}
.corrs{display:grid;gap:10px}
.corr{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2)}
.c-o{color:var(--m3);text-decoration:line-through;text-decoration-thickness:1.5px}
.c-b{color:var(--oki);font-weight:700;margin-top:3px}
.corr p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vocab div{border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--m4) 12%,var(--surface))}
.vocab p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.polished{border-left:5px solid var(--m2);background:var(--surface-2);border-radius:0 14px 14px 0;padding:14px 16px}
.polished p{margin:0 0 8px}.polished p:last-child{margin:0}
.follow{margin-top:18px;border-radius:18px;padding:16px;background:color-mix(in srgb,var(--m6) 9%,var(--surface))}
.follow h3{margin-top:0}.follow p{font-weight:600}
.iv-hist-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.iv-hist-head h2{margin:0}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2)}
.h-q{font-weight:600}
.h-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted);margin-top:6px}
.h-s{font-weight:700;color:var(--ci)}
.hist .ask-link{margin:0;color:var(--brand)}
@media (max-width:760px){.fb-cols,.scores{grid-template-columns:1fr}}

.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Tablets (Galaxy Tab S e Tab A, vertical e horizontal) ===== */
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
a,button,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.modules{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.pts-top{flex-wrap:wrap}
.pts-big{white-space:nowrap}
.chat-fab,.sheet-bd,.chat-close{display:none}

/* Cabeçalho em duas linhas: marca e controles em cima, menu rolável embaixo */
@media (max-width:1020px){
  .top-in{flex-wrap:wrap;row-gap:6px;padding:10px 18px 8px}
  .nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:6px;padding-bottom:2px}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;flex:none}
  .top-right{margin-left:auto}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}

  /* Página inicial: título em cima, cards de progresso e pontos lado a lado */
  .hero{grid-template-columns:1fr;gap:22px}
  .hero-side{grid-template-columns:1fr 1fr;align-items:stretch}
  .hero-side .continue{height:100%}
  .pts-card{justify-content:center}
  .pts-top{flex-direction:column;align-items:flex-start;gap:8px}
  .rank{text-align:left}

  /* Tutor vira um painel que sobe da parte de baixo da tela */
  .lesson-grid #chatBox{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));
    transform:translateY(110%);transition:transform .28s ease;max-width:820px;margin:0 auto;pointer-events:none}
  .lesson-grid #chatBox.open{transform:none;pointer-events:auto}
  .lesson-grid #chatBox .chat{position:relative;top:auto;max-height:min(78vh,680px);border-radius:26px;box-shadow:0 -8px 40px rgba(20,18,50,.28)}
  .lesson-grid #chatBox .msgs{max-height:none}
  .chat-close{display:grid;place-items:center;position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:16px}
  .chat-head{padding-right:64px}
  .chat-fab{display:flex;align-items:center;gap:8px;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;
    border:0;border-radius:999px;padding:14px 20px;font-weight:800;font-size:15px;color:#fff;background:var(--ci);box-shadow:0 8px 24px rgba(20,18,50,.3)}
  .sheet-bd{position:fixed;inset:0;z-index:44;background:rgba(15,14,35,.35);backdrop-filter:blur(2px)}
  .sheet-bd.show{display:block}
  body.sheet-open{overflow:hidden}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
  .lesson-grid > div:first-child{padding-bottom:70px}
}
@media (max-width:640px){
  .hero-side{grid-template-columns:1fr}
}

/* Toque: áreas de clique maiores em telas sensíveis ao toque */
@media (pointer:coarse){
  .nav a{padding:10px 16px}
  .stop{width:40px;height:40px;font-size:14px}
  .stops{gap:10px}.stop-group{gap:7px;padding:7px 10px}
  .lang button{padding:9px 14px;font-size:14px}
  .theme-btn{width:42px;height:42px}
  .pill{padding:9px 13px}
  .chip{padding:10px 14px;font-size:14px}
  .ask-link{padding:8px 0;display:inline-block}
  .lessons a{padding:13px 12px}
  .fq-opt{padding:13px 14px;min-height:50px;font-size:15.5px}
  .opt{padding:13px 14px}
  .seg{padding:10px 15px;font-size:14px}
  .btn{min-height:46px}
  .composer textarea{font-size:16px}
  .search{font-size:17px}
}
@media (hover:none){
  .stop:hover,.fq-opt:hover:not(:disabled){transform:none}
  .lessons a:hover{background:transparent}
}

@media (pointer:coarse) and (min-width:1021px){.nav a{padding:10px 12px}.nav{gap:2px}.top-in{gap:12px}}
/* Tablets na horizontal com tela mais baixa: cabeçalho rola junto para liberar espaço de leitura */
@media (max-height:700px) and (orientation:landscape){
  .top{position:relative;top:auto}
  html{scroll-padding-top:16px}
  .chat{top:16px}
  .lesson-grid #chatBox .chat{max-height:86vh}
}

/* ===== Sistema visual "Caderno claro": Google Sans Flex, cores calmas e acessíveis ===== */
body{font-size:16.5px;line-height:1.6;letter-spacing:.005em;font-feature-settings:"ss01" 0}
h1,h2,h3,.brand,.page-title,.hero h1,.l-head h1,.mod-head h3,.block h2{font-family:var(--display);letter-spacing:-.012em}
.hero h1{font-weight:700;font-size:clamp(34px,4.6vw,54px);line-height:1.08;letter-spacing:-.02em}
.page-title{font-weight:700}
.l-head h1{font-weight:700;line-height:1.15}
.block h2,.mod-head h3,.fq-head h2,.chat-head h2,.pm-note b,.simple-h,.case h3{font-weight:650}
.lead,.hero p.lead{font-size:18px;line-height:1.6}
.block p,.deep p,.simple p,.case p,.pm-note p{font-size:17px;line-height:1.72;max-width:68ch}
.concept p{font-size:15.5px;line-height:1.6}
.btn{font-weight:600;border-radius:999px;padding:12px 20px;letter-spacing:.01em}
.btn:not(.ghost):not(.soft){background:var(--ci);color:#fff}
.btn.done{background:var(--oki)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn.soft{border-radius:999px;color:var(--ci);border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);background:var(--surface)}
.btn:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 55%,transparent);outline-offset:2px}
.nav a{font-weight:500;border-radius:999px}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brandi);box-shadow:none;font-weight:600}
.pill{font-weight:600}
.lang button[aria-pressed="true"]{background:var(--brandi)}
.theme-btn .i{width:18px;height:18px}
.module,.block,.continue,.ribbon,details.about,.pager a,.g-item,.chat,.case{border:1px solid var(--line);box-shadow:var(--shadow)}
.module{border-radius:24px}
.mod-head{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.mod-num{color:var(--ci)}
.l-head{background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 18%,transparent)}
.l-kicker{color:var(--ci);font-weight:600;font-family:var(--body)}
.tag{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--ci)}
.chk{border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.chk .i{width:13px;height:13px}
/* Ícones */
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.ico{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--c) 13%,var(--surface));color:var(--ci);flex:none}
.ico .i{width:20px;height:20px;vertical-align:0}
.ico.sm{width:28px;height:28px;border-radius:9px;margin-right:8px}
.ico.sm .i{width:16px;height:16px}
.block h2,.deep h2,.refs h2,.fq-head h2{display:flex;align-items:center;gap:12px}
.res-details summary{gap:12px}
.pm-note b{display:flex;align-items:center}
.simple{background:color-mix(in srgb,var(--m4) 11%,var(--surface));border:1.5px solid color-mix(in srgb,var(--m4) 35%,transparent)}
.simple .ico{background:color-mix(in srgb,var(--m4) 22%,var(--surface));color:var(--m4i)}
.simple-h{gap:12px;font-size:19px}
.case-tag{display:inline-flex;align-items:center;gap:6px;color:var(--ci);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.case-tag .i{width:15px;height:15px}
.res-ico{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--c,var(--brand)) 12%,var(--surface));color:var(--ci)}
.res-ico .i{width:17px;height:17px;vertical-align:0}
.pts-big{display:flex;align-items:baseline;gap:8px}
.pts-big .star{color:var(--m4);align-self:center;display:inline-flex}
.pts-big .star .i{width:30px;height:30px;stroke:none}
.star .i,.tag .i,.lp .i,.fq-pill .i,#topPts .i{stroke:none}
#topPts .i,.fq-pill .i{color:var(--m4)}
.lp{color:var(--m8i)}
.fq-pill{display:inline-flex;align-items:center;gap:6px}
.chat-fab .i{width:20px;height:20px}
.chat-fab{background:var(--ci)}
.msg.me{background:var(--ci)}
.fq-n{background:var(--ci)}
.fq-opt.sel{border-color:var(--ci)}
.fq-opt.right{border-color:var(--oki)}
.fq-opt.right .fq-l{background:var(--oki)}
.fq-earn.pos{color:var(--oki)}
.pts-card{background:color-mix(in srgb,var(--m4) 9%,var(--surface))}
.pts-bar{background:color-mix(in srgb,var(--m4) 20%,var(--surface))}
.pts-bar i{background:linear-gradient(90deg,var(--m4),var(--m8))}
.ring{background:conic-gradient(var(--brand) calc(var(--p)*1%), color-mix(in srgb,var(--brand) 12%,var(--surface)) 0)}
.next-box{background:color-mix(in srgb,var(--c) 8%,var(--surface));border-left-color:var(--c)}
.next-box small{color:var(--ci);font-weight:600}
.stop{font-weight:600}
.stop.is-done{background:var(--ci);border-color:var(--ci)}
.done-bar{background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1.5px dashed color-mix(in srgb,var(--c) 40%,transparent)}
.done-bar.is-done{border-style:solid}
.fq-lv.lv1{color:var(--m2i)}.fq-lv.lv2{color:var(--m8i)}.fq-lv.lv3{color:var(--m6i)}
.refs a{text-decoration-color:color-mix(in srgb,var(--c) 45%,transparent)}
.refs a:hover,.res-item a:hover b{color:var(--ci)}
.g-item a,.ask-link{color:var(--ci)}
.brand-mark{border:1px solid var(--line)}
::selection{background:color-mix(in srgb,var(--brand) 22%,transparent)}

main:focus,main:focus-visible{outline:none}
.legend i,.minibars a i{background:var(--c)}
.btn:not(.ghost):not(.soft):not(.done){background:var(--brandi)}
.fq-confirm .btn{background:var(--brandi)!important}
.btn.soft{color:var(--ink)}
.chat-fab,.msg.me{background:var(--brandi)}
.composer .btn{background:var(--brandi)}

.block p.refs-note,.refs-note{font-size:13.5px!important;line-height:1.5;color:var(--muted)}
.refs li{font-size:15px;line-height:1.5}
.block p.fq-intro{font-size:15.5px;line-height:1.6}
.fq-why{font-size:15px}
.block p.page-sub{font-size:17px}

.btn:not(.ghost):not(.soft):not(.done),.fq-confirm .btn,.composer .btn,.chat-fab,.msg.me,.lang button[aria-pressed="true"]{background:var(--btn)!important;color:#fff}
.stop.is-done,.chk.on,.fq-n,.fq-opt.sel .fq-l,.fq-opt.right .fq-l,.fq-opt.wrong .fq-l{color:var(--on-ci)}
.nav a[aria-current="page"]{color:var(--brandi)}

/* ===== Refinamento: menos ornamento, hierarquia clara, movimento com propósito ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.4,0,1,1);--r-lg:20px;--r-md:14px;--r-sm:10px}
@property --p{syntax:"<number>";inherits:false;initial-value:0}

/* Superfícies: borda fina e sem sombra; sombra só no que flutua */
.module,.block,.continue,.ribbon,details.about,.pager a,.g-item,.case,.chat,.quiz-q,.fq-q,.concept,.res-item,.hist li,.corr{box-shadow:none}
.module,.block,.continue,.ribbon,details.about,.pager a,.g-item,.chat{border:1px solid var(--line);border-radius:var(--r-lg)}
.concept,.fq-q,.res-item,.hist li,.corr,.quiz-q,.next-box,.iv-hint,.polished,.fq-why{border-radius:var(--r-md)}
.top{box-shadow:none;background:color-mix(in srgb,var(--bg) 90%,transparent)}
.chat-fab,.toast,.lesson-grid #chatBox.open .chat{box-shadow:0 10px 30px rgba(20,23,42,.18)}

/* Sem barras laterais, tracejados e degradês decorativos */
.next-box{border-left:0;background:var(--surface-2);padding:14px 16px}
.next-box small{color:var(--muted);font-weight:500}
.polished{border-left:0;background:color-mix(in srgb,var(--m2) 8%,var(--surface))}
.pm-note{border:1px solid color-mix(in srgb,var(--c) 22%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:var(--r-lg)}
.done-bar,.done-bar.is-done{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg)}
.done-bar.is-done{border-color:color-mix(in srgb,var(--oki) 40%,transparent);background:color-mix(in srgb,var(--oki) 6%,var(--surface))}
.iv-empty{border:1px solid var(--line);background:var(--surface)}
.pts-card{background:var(--surface)}
.pts-bar i{background:var(--m4)}
.simple{background:color-mix(in srgb,var(--m4) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--m4) 24%,transparent);border-radius:var(--r-lg)}
.l-head{border:0;background:color-mix(in srgb,var(--c) 8%,var(--surface));border-radius:24px}
.mod-head{background:transparent;border-bottom:1px solid var(--line)}
.stop-group{background:transparent;padding:4px 6px 4px 0}
.stop.is-next{box-shadow:none;outline:2px solid var(--ci);outline-offset:2px}
.case-block h2{flex-wrap:wrap}
.pts-sub{line-height:1.6}.pts-next{display:block;color:var(--muted)}
.tag{background:var(--surface-2);color:var(--muted);font-weight:600}
.mod-tags .tag:first-child{color:var(--ink)}

/* Ícones sem "azulejo": só o traço na cor do módulo */
.ico{width:auto;height:auto;background:none;border-radius:0;color:var(--ci)}
.ico .i{width:22px;height:22px}
.ico.sm{width:auto;height:auto;margin-right:8px}
.simple .ico{background:none;color:var(--m4i)}
.res-ico{background:none;width:auto;height:auto;color:var(--ci)}
.res-ico .i{width:20px;height:20px}
.block h2,.deep h2,.refs h2,.fq-head h2,.res-details summary{gap:10px}

/* Navegação: setas desenhadas no lugar de caracteres */
.back,.pager a{position:relative}
.back{gap:8px}
.back::before,.pager a::before,.pager a.next::after{content:"";width:16px;height:16px;flex:none;background:currentColor;
  -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>') center/contain no-repeat;
          mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>') center/contain no-repeat}
.pager a{display:flex;flex-direction:column;justify-content:center;padding:16px 20px 16px 44px}
.pager a::before{position:absolute;left:18px;top:50%;margin-top:-8px;color:var(--muted)}
.pager a.next{padding:16px 44px 16px 20px}
.pager a.next::before{content:none}
.pager a.next::after{position:absolute;right:18px;top:50%;margin-top:-8px;transform:scaleX(-1);color:var(--muted)}
.pager a small{font-weight:500}
.pager a:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.lessons a .t{transition:color .15s var(--ease)}

/* ===== Movimento com propósito ===== */
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes okPop{0%{transform:scale(1)}45%{transform:scale(1.012)}100%{transform:scale(1)}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes flash{from{transform:scale(.97)}to{transform:scale(1)}}
#app.enter{animation:enter .26s var(--ease) both}
.ring{transition:--p .9s var(--ease)}
.bar i,.pts-bar i{transform-origin:left;animation:grow .8s var(--ease) both .1s}
.minibars a i{transform-origin:bottom;animation:growY .7s var(--ease) both .15s}
/* Botões e controles: resposta ao toque */
.btn,.chip,.seg,.fq-opt,.opt,.lang button,.nav a,.stop,.lessons a,.pager a,.theme-btn{transition:background-color .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease),box-shadow .18s var(--ease)}
.btn:active,.chip:active,.seg:active,.fq-opt:active:not(:disabled),.stop:active,.theme-btn:active{transform:scale(.97)}
.btn.flash{animation:flash .28s var(--ease)}
.stop:hover{transform:none;border-width:3px}
/* Questões: só a recém-confirmada reage */
.fq-q.just .fq-opt.right{animation:okPop .4s var(--ease)}
.fq-q.just .fq-opt.wrong{animation:nudge .32s var(--ease)}
.fq-q.just .fq-why{animation:rise .3s var(--ease) both .05s}
.fq-q{transition:border-color .2s var(--ease),background-color .2s var(--ease)}
/* Chat: a última mensagem entra suave e o "digitando" mostra que algo está acontecendo */
.msgs .msg:last-child{animation:rise .22s var(--ease) both}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
/* Seções que abrem e fecham */
details[open] > :not(summary){animation:rise .22s var(--ease) both}
details.about summary::after,.res-details summary::after{transition:transform .2s var(--ease)}
/* Toast entra de baixo e sai mais rápido */
.toast{transform:translate(-50%,10px);transition:opacity .16s var(--ease-in),transform .16s var(--ease-in)}
.toast.show{transform:translate(-50%,0);transition:opacity .22s var(--ease),transform .22s var(--ease)}
/* Painel do tutor */
.lesson-grid #chatBox{transition:transform .32s var(--ease)}
.sheet-bd.show{animation:enter .2s var(--ease)}
@media (prefers-reduced-motion: reduce){#app.enter,.bar i,.pts-bar i,.minibars a i{animation:none}}
.pts-big .count{font-size:inherit;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.pts-big{align-items:center}

/* ===== Simulado ===== */
.sim-wrap{max-width:860px}
.sim-resume{border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);background:color-mix(in srgb,var(--brand) 6%,var(--surface));border-radius:var(--r-lg);padding:16px 20px;margin-bottom:16px}
.sim-resume p{margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sim-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sim-mode{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:2px}
.sim-mode b{font-size:16px}.sim-mode span{font-size:14px;color:var(--muted)}
.sim-mode[aria-pressed="true"]{border-color:var(--btn);background:color-mix(in srgb,var(--brand) 7%,var(--surface))}
.sim-avail{color:var(--muted);font-size:14px!important;margin:4px 0 14px!important}
.sim-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sim-stats div{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.sim-stats small{display:block;color:var(--muted);font-size:13px}.sim-stats b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.sim-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sim-exit{background:none;border:0;padding:0;font:inherit;color:var(--muted);font-weight:600;cursor:pointer}
.sim-time{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:14px}
.sim-prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.sim-prog i{display:block;height:100%;background:var(--btn);border-radius:99px;transition:width .35s var(--ease)}
.sim-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.sim-qn{font-weight:700;font-size:14px;color:var(--ci)}
.sim-text{font-size:19px!important;font-weight:600;line-height:1.5!important;margin:0 0 16px!important;max-width:none!important}
.sim-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.sim-actions.top{margin:0 0 16px}
.sim-keys{font-size:12.5px!important;color:var(--muted);margin:14px 0 0!important}
@media (pointer:coarse){.sim-keys{display:none}}
.sim-card.swap{animation:rise .24s var(--ease) both}
.sim-card.just .fq-opt.right{animation:okPop .4s var(--ease)}
.sim-card.just .fq-opt.wrong{animation:nudge .32s var(--ease)}
.sim-card.just .sim-why{animation:rise .3s var(--ease) both}
.sim-why{margin-top:14px}
.sim-confirm{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;background:var(--surface-2)}
.sim-confirm p{margin:0 0 10px!important}
.sim-map{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sim-map button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sim-map button.on{background:color-mix(in srgb,var(--brand) 10%,var(--surface));color:var(--ink);border-color:color-mix(in srgb,var(--brand) 35%,transparent)}
.sim-map button.cur{outline:2px solid var(--btn);outline-offset:1px}
.sim-score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.sim-big{font-size:22px;font-weight:700;display:block;margin-bottom:4px}
.sim-score p{margin:0!important}
.sim-sub{display:flex;gap:14px;color:var(--muted);font-size:14px!important;margin-top:6px!important}
.sim-groups{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.sim-bar{display:grid;grid-template-columns:64px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.sim-bar .bar{margin:0;background:color-mix(in srgb,var(--c,var(--brand)) 15%,var(--surface))}
.sim-bar .bar i{background:var(--c,var(--brand))}
.sim-bar b{text-align:right;font-variant-numeric:tabular-nums}
.sim-review{display:grid;gap:12px}
.rev{border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.rev.no{border-color:color-mix(in srgb,var(--m3) 30%,var(--line))}
.rev-q{font-weight:600;margin:0 0 8px!important;font-size:16px!important}
.rev-a{margin:4px 0!important;font-size:15px!important}
.rev-a small{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.rev-a.ok{color:var(--oki)}.rev-a.no{color:var(--m3i)}
.rev-w{color:var(--muted);font-size:14.5px!important;margin:8px 0 0!important}
@media (max-width:760px){.sim-modes,.sim-groups{grid-template-columns:1fr}.sim-stats b{font-size:22px}}
.sim-score{flex-wrap:nowrap}.sim-score>div:last-child{flex:1;min-width:0}
@media (max-width:560px){.sim-score{flex-wrap:wrap}}

@media (max-width:1180px){
  .top-in{flex-wrap:wrap;row-gap:6px;padding:10px 18px 8px}
  .nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:6px;padding-bottom:2px}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;flex:none}
  .top-right{margin-left:auto}
}
@media (max-width:480px){#topProgress{display:none}.brand{font-size:18px}}

/* ===== Diagramas ===== */
.dg figcaption{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:650;font-size:20px;margin-bottom:16px;letter-spacing:-.01em}
.dg-note{font-size:14px!important;color:var(--muted);margin:14px 0 0!important}
.dg-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* camadas */
.dg-ring{border:1.5px solid color-mix(in srgb,var(--c) calc(30% + var(--lv)*12%),var(--line));background:color-mix(in srgb,var(--c) calc(3% + var(--lv)*4%),var(--surface));border-radius:18px;padding:12px 14px 14px}
.dg-ring .dg-ring{margin-top:10px}
.dg-ring-h b{display:block;font-size:15.5px;color:var(--ci)}
.dg-ring-h span{display:block;font-size:13.5px;color:var(--muted);line-height:1.45}
/* linha do tempo */
.dg-tl{list-style:none;margin:0;padding:8px 0 4px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(92px,1fr);position:relative;min-width:640px}
.dg-tl::before{content:"";position:absolute;left:0;right:0;top:41px;height:2px;background:color-mix(in srgb,var(--c) 35%,var(--line))}
.dg-tl li{display:grid;justify-items:center;text-align:center;gap:6px;position:relative;padding:0 4px}
.dg-tl .y{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ci)}
.dg-tl i{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--c);margin:4px 0}
.dg-tl .l{font-size:13px;line-height:1.35;color:var(--ink)}
/* fluxo e ciclo */
.dg-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:22px;counter-reset:s}
.dg-flow li{position:relative;border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:12px 12px 14px;display:grid;gap:4px;align-content:start}
.dg-flow li:not(:last-child)::after{content:"";position:absolute;right:-17px;top:50%;width:12px;height:12px;margin-top:-6px;background:var(--ci);
  -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>') center/contain no-repeat;
  mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>') center/contain no-repeat}
.dg-flow .k{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--ci);color:var(--on-ci)}
.dg-flow b{font-size:14.5px;line-height:1.3}
.dg-flow .s{font-size:12.5px;color:var(--muted);line-height:1.4}
.dg-loop{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--ci);font-weight:600}
.dg-loop svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:820px){
  .dg-flow{grid-template-columns:1fr;gap:18px}
  .dg-flow li{grid-template-columns:auto 1fr;column-gap:10px}
  .dg-flow li .s{grid-column:2}
  .dg-flow li:not(:last-child)::after{right:auto;left:22px;top:auto;bottom:-15px;margin:0;transform:rotate(90deg)}
}
/* tabela comparativa */
.dg-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;min-width:520px}
.dg-table th,.dg-table td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);line-height:1.45}
.dg-table thead th{font-size:13.5px;color:var(--ci);border-bottom:2px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.dg-table tbody th{font-weight:600;color:var(--muted);font-size:13.5px;width:22%}
.dg-table tbody tr:last-child th,.dg-table tbody tr:last-child td{border-bottom:0}
/* espectro */
.dg-spec-ends{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.dg-spec-bar{height:8px;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 18%,var(--surface)),var(--c))}
.dg-spec-items{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;margin-top:-8px}
.dg-spec-items li{display:grid;justify-items:center;text-align:center;gap:4px}
.dg-spec-items i{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--ci);margin-bottom:4px}
.dg-spec-items b{font-size:13.5px;line-height:1.3}
.dg-spec-items span{font-size:12px;color:var(--muted);line-height:1.35}
@media (max-width:640px){.dg-spec-bar{display:none}.dg-spec-items{grid-template-columns:1fr;margin-top:6px;justify-items:start}.dg-spec-items li{grid-template-columns:auto 1fr;justify-items:start;text-align:left;column-gap:10px}.dg-spec-items li span{grid-column:2}}
/* barras */
.dg-bars{display:grid;gap:10px}
.dg-bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 48px;gap:12px;align-items:center;font-size:14px}
.dg-bar .t{height:12px;border-radius:99px;background:color-mix(in srgb,var(--c) 12%,var(--surface));overflow:hidden}
.dg-bar .t i{display:block;height:100%;background:var(--c);border-radius:99px;transform-origin:left;animation:grow .8s var(--ease) both}
.dg-bar b{text-align:right;font-variant-numeric:tabular-nums}
/* pilha */
.dg-stack{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dg-stack li{border-radius:12px;padding:11px 14px;background:color-mix(in srgb,var(--c) calc(5% + var(--i)*3%),var(--surface));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));display:grid;grid-template-columns:minmax(150px,30%) 1fr;gap:12px;align-items:baseline}
.dg-stack b{font-size:14.5px}
.dg-stack span{font-size:13.5px;color:var(--muted);line-height:1.45}
@media (max-width:640px){.dg-stack li{grid-template-columns:1fr;gap:2px}}
/* matriz */
.dg-matrix{display:grid;gap:8px}
.dg-matrix .ylab,.dg-matrix .xlab{font-size:12.5px;font-weight:600;color:var(--muted)}
.dg-matrix .xlab{text-align:center}
.dg-matrix .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dg-matrix .cell{border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--surface-2);display:grid;gap:4px;min-height:92px;align-content:start}
.dg-matrix .cell b{font-size:15px}
.dg-matrix .cell span{font-size:13px;color:var(--muted);line-height:1.4}
.dg-matrix .c1{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.dg-matrix .c1 b{color:var(--ci)}
/* tríade */
.dg-triad{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:20px;align-items:center}
.dg-triad svg{width:100%;height:auto}
.dg-triad circle{fill:color-mix(in srgb,var(--c) 14%,transparent);stroke:var(--ci);stroke-width:1.5}
.dg-triad text{font-family:var(--body);font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle}
.dg-triad text.mid{font-size:22px;font-weight:800;fill:var(--m3i)}
.dg-triad ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dg-triad li b{display:block;font-size:14.5px}.dg-triad li span{font-size:13.5px;color:var(--muted)}
@media (max-width:640px){.dg-triad{grid-template-columns:1fr}.dg-triad svg{max-width:260px;margin:0 auto}}
/* aprofundando */
.deep-more h3{font-family:var(--display);font-size:17.5px;font-weight:650;margin:18px 0 6px;letter-spacing:-.005em}
.deep-more h2+h3{margin-top:4px}
.lesson-grid>div,.lesson-grid .block,.dg{min-width:0}

.dg-flow.is-long{grid-template-columns:1fr;gap:16px}
.dg-flow.is-long li{grid-template-columns:auto minmax(130px,30%) 1fr;column-gap:12px;align-items:center;padding:10px 14px}
.dg-flow.is-long li:not(:last-child)::after{right:auto;left:24px;top:auto;bottom:-14px;margin:0;transform:rotate(90deg)}
@media (max-width:820px){.dg-flow.is-long li{grid-template-columns:auto 1fr}.dg-flow.is-long li .s{grid-column:2}}
.dg-tl{min-width:560px;grid-auto-columns:minmax(52px,1fr)}
.dg-tl .l{font-size:12.5px}

.dg-tl{grid-auto-flow:row;grid-template-columns:repeat(var(--n),minmax(0,1fr));min-width:calc(var(--n)*78px)}
.dg-tl li{align-content:start;grid-template-rows:auto auto auto}
.dg-tl .l{overflow-wrap:anywhere;hyphens:auto}

.dg-tl .l{overflow-wrap:normal;hyphens:manual}
.dg{container-type:inline-size}
@container (max-width:760px){
  .dg-tl{grid-template-columns:auto 1fr;grid-auto-flow:row;min-width:0;padding:0;gap:0}
  .dg-tl::before{left:63px;right:auto;top:6px;bottom:6px;width:2px;height:auto}
  .dg-tl li{display:contents}
  .dg-tl .y{grid-column:1;text-align:right;padding:6px 26px 6px 0;width:66px;position:relative}
  .dg-tl .y::after{content:"";position:absolute;right:-6px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--surface);border:2.5px solid var(--c)}
  .dg-tl i{display:none}
  .dg-tl .l{grid-column:2;text-align:left;padding:6px 0 6px 18px;font-size:14px;align-self:center}
}
.dg-matrix .c1:not(.hl){background:var(--surface-2);border-color:var(--line)}.dg-matrix .c1:not(.hl) b{color:var(--ink)}
.dg-matrix .hl{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,var(--line))}.dg-matrix .hl b{color:var(--ci)}
