<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F3FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13122A" media="(prefers-color-scheme: dark)">
<title>Trilha AI PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F3FA; --surface:#FFFFFF; --surface-2:#F7F7FC; --ink:#1C1B36; --muted:#5E5D7C; --line:#E2E2F0;
  --brand:#5B47F5; --ok:#1F9D62; --warn:#C2410C;
  --m1:#7C5CFA; --m2:#12A594; --m3:#EE4E5A; --m4:#E69A12; --m5:#3478F6; --m6:#D0409F; --m7:#1F9D62; --m8:#F26B2A; --m9:#2F3C9E;
  --shadow:0 1px 2px rgba(28,27,54,.06), 0 8px 24px rgba(28,27,54,.06);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13122A; --surface:#1D1C3A; --surface-2:#242346; --ink:#EEEDFC; --muted:#A9A8C8; --line:#33325A;
    --brand:#8F80FF; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --m9:#6F7CF0;
  }
}
:root[data-theme="dark"]{
  --bg:#13122A; --surface:#1D1C3A; --surface-2:#242346; --ink:#EEEDFC; --muted:#A9A8C8; --line:#33325A;
  --brand:#8F80FF; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --m9:#6F7CF0;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
a{color:var(--brand)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px;background:var(--surface);box-shadow:var(--shadow)}
.brand-mark i{border-radius:3px}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center}

main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

/* Hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:stretch}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.02em;margin:0 0 14px}
.hero p.lead{font-size:18px;color:var(--muted);max-width:52ch;margin:0 0 22px}
.hero-left{padding:8px 0}
.continue{background:var(--surface);border-radius:28px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.ring-row{display:flex;align-items:center;gap:18px}
.ring{--p:0;width:108px;height:108px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%), var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px}
.ring-row p{margin:0;color:var(--muted);font-size:15px}
.ring-row strong{display:block;color:var(--ink);font-size:17px}
.minibars{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;align-items:end;height:64px;margin-top:auto}
.minibars a{display:block;height:100%;border-radius:8px;background:color-mix(in srgb,var(--c) 16%,var(--surface-2));position:relative;overflow:hidden}
.minibars a i{position:absolute;left:0;right:0;bottom:0;background:var(--c);border-radius:8px}
.minibars-l{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.next-box{border-radius:18px;padding:14px 16px;background:var(--surface-2);border-left:6px solid var(--c,var(--brand))}
.next-box small{color:var(--muted);display:block;font-size:13px}
.next-box b{font-size:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--brand);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--surface);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--c,var(--brand)) 45%,transparent)}
.btn.done{background:var(--ok)}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* Ribbon: 32 stops */
.ribbon{margin:30px 0 8px;background:var(--surface);border-radius:24px;padding:20px 22px;box-shadow:var(--shadow)}
.ribbon-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:14px;flex-wrap:wrap}
.ribbon-head h2{font-family:var(--display);font-size:20px;margin:0}
.ribbon-head span{color:var(--muted);font-size:14px}
.stops{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 2px 10px}
.stop-group{display:flex;gap:5px;align-items:center;padding:6px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.stop{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c);background:var(--surface);color:var(--c);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none;padding:0;transition:transform .15s}
.stop:hover{transform:scale(1.12)}
.stop.is-done{background:var(--c);color:#fff}
.stop.is-next{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* About */
details.about{margin:18px 0 34px;background:var(--surface);border-radius:20px;padding:4px 20px;box-shadow:var(--shadow)}
details.about summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.about summary::-webkit-details-marker{display:none}
details.about summary::after{content:"+";font-size:22px;color:var(--muted)}
details.about[open] summary::after{content:"−"}
details.about .about-body{padding:0 0 18px;color:var(--muted);max-width:75ch}
details.about .about-body p{margin:0 0 10px}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.flow span{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600}

/* Modules */
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.module{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.mod-head{padding:20px 22px 16px;background:color-mix(in srgb,var(--c) 13%,var(--surface));position:relative}
.mod-num{font-family:var(--display);font-weight:800;font-size:15px;color:var(--c);display:flex;justify-content:space-between;align-items:center}
.mod-head h3{font-family:var(--display);font-size:21px;line-height:1.15;margin:6px 0 8px;letter-spacing:-.01em}
.mod-head p{margin:0;color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,var(--surface));margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.lessons{list-style:none;margin:0;padding:8px 10px 12px}
.lessons a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;text-decoration:none;color:var(--ink)}
.lessons a:hover{background:var(--surface-2)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--c)}
.chk.on{background:var(--c);color:#fff}
.lessons .t{flex:1;font-weight:600;font-size:15px;line-height:1.35}
.lessons .n{font-size:12px;color:var(--muted);font-weight:700;display:block}
.lessons .ex .t{font-weight:700}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink)}

/* Lesson */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;text-decoration:none;margin-bottom:14px}
.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.l-head{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-radius:28px;padding:26px 28px;margin-bottom:18px}
.l-kicker{color:var(--c);font-weight:800;font-family:var(--display);font-size:15px}
.l-head h1{font-family:var(--display);font-size:clamp(28px,3.6vw,42px);line-height:1.08;letter-spacing:-.015em;margin:6px 0 18px}
.l-actions{display:flex;flex-wrap:wrap;gap:10px}
.block{background:var(--surface);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}
.block h2{font-family:var(--display);font-size:21px;margin:0 0 12px;letter-spacing:-.01em}
.block p{margin:0 0 10px;max-width:72ch}
.concepts{display:grid;gap:10px}
.concept{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface-2)}
.concept b{display:block;font-size:16px;margin-bottom:3px}
.concept p{margin:0;color:var(--muted);font-size:15px}
.ask-link{margin-top:8px;background:none;border:0;padding:0;color:var(--c);font-weight:700;font-size:14px}
.pm-note{border-radius:20px;padding:18px 20px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1.5px dashed color-mix(in srgb,var(--c) 55%,transparent);margin-bottom:16px}
.pm-note b{font-family:var(--display);font-size:17px;display:block;margin-bottom:4px}
.pm-note p{margin:0;max-width:72ch}
textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--surface-2);resize:vertical;line-height:1.5}
textarea:focus{outline:none;border-color:var(--c,var(--brand))}
.save-state{font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.pager a{flex:1;min-width:200px;background:var(--surface);border-radius:18px;padding:14px 18px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:13px}
.pager a.next{text-align:right}

/* Quiz */
.quiz-q{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:var(--surface-2)}
.quiz-q p{font-weight:700;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--m3);background:color-mix(in srgb,var(--m3) 10%,var(--surface))}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:14px;color:var(--muted)}
.score{font-weight:700;margin-top:6px}

/* Chat */
.chat{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 110px);overflow:hidden}
.chat.full{position:static;max-height:none;min-height:70vh}
.chat-head{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.chat-head h2{font-family:var(--display);font-size:19px;margin:0}
.chat-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:180px}
.msg{max-width:92%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.5;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--c,var(--brand));color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin:0}
.msg.ai ul,.msg.ai ol{margin:4px 0 8px;padding-left:20px}
.msg.ai code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:.92em}
.msg.ai pre{background:var(--line);padding:10px;border-radius:10px;overflow-x:auto}
.msg.thinking{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink)}
.chip:hover{border-color:var(--c,var(--brand))}
.composer{display:flex;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.composer textarea{min-height:46px;height:46px;max-height:140px;border-radius:14px;padding:11px 12px;font-size:15px}
.composer .btn{padding:0 16px}
.empty-chat{color:var(--muted);font-size:14px;text-align:center;margin:auto;max-width:28ch}
.chat-off{padding:18px 20px;color:var(--muted);font-size:14px}
.note-err{color:var(--warn);font-size:14px;margin-top:8px}

/* Glossary */
.page-title{font-family:var(--display);font-size:clamp(30px,4vw,44px);letter-spacing:-.02em;margin:0 0 6px}
.page-sub{color:var(--muted);margin:0 0 20px;max-width:60ch}
.search{width:100%;max-width:520px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 16px;font-size:16px;margin-bottom:20px}
.search:focus{outline:none;border-color:var(--brand)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.g-item{background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);border-top:5px solid var(--c)}
.g-item b{display:block;font-size:16px;margin-bottom:4px}
.g-item p{margin:0 0 8px;color:var(--muted);font-size:14.5px}
.g-item a{font-size:13px;font-weight:700;color:var(--c);text-decoration:none}
.chat-wrap{max-width:820px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.celebrate{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

@media (max-width:1020px){
  .lesson-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .top-in{flex-wrap:wrap;gap:10px}
  .nav{margin-left:0;order:3;width:100%}
  .top-right{margin-left:auto}
  .modules{grid-template-columns:1fr}
  main{padding:20px 14px 70px}
  .l-head{padding:20px}
  .block{padding:18px}
}
.top-right{display:flex;gap:8px;align-items:center}
.hero-side{display:grid;gap:14px;align-content:start}
.pts-card{background:linear-gradient(135deg,color-mix(in srgb,var(--m4) 18%,var(--surface)),color-mix(in srgb,var(--m6) 10%,var(--surface)))}
.pts-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pts-top small{color:var(--muted);font-weight:700;font-size:13px;display:block}
.pts-big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1}
.pts-big span{font-size:16px;color:var(--muted);font-weight:700}
.rank{text-align:right}.rank b{font-family:var(--display);font-size:17px}
.pts-bar{position:relative;height:12px;border-radius:99px;background:color-mix(in srgb,var(--m4) 22%,var(--surface))}
.pts-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--m4),var(--m8));transition:width .5s}
.pts-bar em{position:absolute;top:-3px;width:3px;height:18px;border-radius:3px;background:var(--ink);opacity:.35}
.pts-sub{margin:0;color:var(--muted);font-size:13.5px}
.pts-pill{background:color-mix(in srgb,var(--m4) 18%,var(--surface))}
.mod-tags{display:flex;gap:6px}
.lp{font-weight:800;color:var(--m8);margin-left:4px}
.fq-meta{display:flex;gap:6px;margin-bottom:8px}
.fq-lv,.fq-pts{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
.fq-lv.lv1{background:color-mix(in srgb,var(--m2) 16%,transparent);color:var(--m2)}
.fq-lv.lv2{background:color-mix(in srgb,var(--m8) 16%,transparent);color:var(--m8)}
.fq-lv.lv3{background:color-mix(in srgb,var(--m6) 16%,transparent);color:var(--m6)}
.fq-pts{background:var(--surface);border:1px solid var(--line)}
.fq-opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent)}
.fq-opt.sel .fq-l{background:var(--c);color:#fff}
.fq-confirm{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.fq-confirm .btn{background:var(--c)}
.fq-hint{font-size:13px;color:var(--muted)}
.fq-res{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.fq-earn{font-weight:800;font-size:13px;color:var(--muted)}
.fq-earn.pos{color:var(--ok)}
.fq-actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.fq-actions .ask-link{margin:0}
@media (max-width:760px){.pts-pill{display:none}}

.fq{border-top:6px solid var(--c)}
.fq-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fq-head h2{display:flex;align-items:center;gap:10px;margin:0}
.fq-pill{font-size:13px;font-weight:800;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.fq-intro{color:var(--muted);margin:8px 0 16px!important}
.fq-q{border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:var(--surface-2)}
.fq-q.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.fq-q.no{border-color:color-mix(in srgb,var(--m3) 45%,transparent)}
.fq-text{font-weight:700;margin:0 0 12px!important;display:flex;gap:10px;line-height:1.5}
.fq-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.fq-opts{display:grid;gap:8px}
.fq-opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.45}
.fq-opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-1px)}
.fq-opt:disabled{cursor:default}
.fq-l{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12.5px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.fq-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.fq-opt.right .fq-l{background:var(--ok);color:#fff}
.fq-opt.wrong{border-color:var(--m3);background:color-mix(in srgb,var(--m3) 10%,var(--surface))}
.fq-opt.wrong .fq-l{background:var(--m3);color:#fff}
.fq-why{margin-top:12px;font-size:14.5px;line-height:1.6;padding:12px 14px;border-radius:12px;background:var(--surface)}
.fq-why .fq-disc{display:block;margin-top:6px}
.fq-result{border-radius:18px;padding:16px 18px;margin-top:4px}
.fq-result b{font-family:var(--display);font-size:19px}
.fq-result p{margin:4px 0 12px!important}
.fq-result.r3{background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.fq-result.r2{background:color-mix(in srgb,var(--m4) 16%,var(--surface))}
.fq-result.r1{background:color-mix(in srgb,var(--m3) 11%,var(--surface))}

.simple{border-radius:24px;padding:20px 24px;margin-bottom:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--m4) 20%,var(--surface)),color-mix(in srgb,var(--c) 12%,var(--surface)));border:1.5px solid color-mix(in srgb,var(--m4) 45%,transparent)}
.simple-h{font-family:var(--display);font-weight:800;font-size:19px;display:flex;gap:10px;align-items:center;margin-bottom:6px}
.simple p{margin:0;font-size:16.5px;line-height:1.7;max-width:72ch}
.case{border-radius:22px;padding:20px 24px;margin-bottom:16px;background:var(--surface);box-shadow:var(--shadow);border-left:7px solid var(--c)}
.case-tag{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.02em;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.case h3{font-family:var(--display);font-size:21px;margin:10px 0 6px}
.case p{margin:0;line-height:1.7;max-width:72ch}
.deep p+p{margin-top:12px}
.res-details summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:21px;display:flex;align-items:center;gap:10px;list-style:none}
.res-details summary::-webkit-details-marker{display:none}
.res-details summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:24px}
.res-details[open] summary::after{content:"−"}
.res-details[open] summary{margin-bottom:12px}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.res-grid h3{font-family:var(--display);font-size:16px;margin:0 0 8px;color:var(--muted)}
.res-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.res-item{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.res-ico{font-size:18px;line-height:1.4}
.res-item a{color:var(--ink);text-decoration:none}.res-item a:hover b{color:var(--c,var(--brand));text-decoration:underline}
.res-by{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.pt-ed{font-style:normal;font-weight:700;color:var(--ok);margin-left:4px}
.res-item p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.lib-mod{border-top:6px solid var(--c)}
.lib-kicker{font-family:var(--display);font-weight:800;color:var(--c);font-size:14px}
.lib-mod h2{margin:2px 0 14px}
@media (max-width:760px){.res-grid{grid-template-columns:1fr}}

.deep h2,.refs h2{display:flex;align-items:center;gap:10px}
.ico{font-size:20px}
.deep p{line-height:1.7}
.refs ol{margin:0;padding-left:22px}
.refs li{margin-bottom:8px;font-size:14.5px}
.refs a{color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--c) 60%,transparent);text-underline-offset:3px}
.refs a:hover{color:var(--c)}
.refs-note{font-size:13px;color:var(--muted);margin-top:10px}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-radius:22px;padding:20px 24px;margin-bottom:16px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 35%,transparent)}
.done-bar b{font-family:var(--display);font-size:19px}
.done-bar p{margin:2px 0 0;color:var(--muted);font-size:14px}
.done-bar.is-done{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-color:color-mix(in srgb,var(--ok) 45%,transparent)}

/* Interview */
.iv-wrap{max-width:900px}
.iv-row{margin-bottom:16px}
.iv-lab{display:block;font-weight:700;font-size:14px;color:var(--muted);margin-bottom:8px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600}
.seg[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.iv-empty{color:var(--muted);text-align:center;padding:26px;border:2px dashed var(--line);border-radius:22px;margin:0 0 16px}
.iv-q{border-top:6px solid var(--m6)}
.iv-qlab{font-family:var(--display);font-weight:800;color:var(--m6);font-size:15px}
.iv-question{font-family:var(--display);font-size:clamp(20px,2.4vw,26px);line-height:1.25;font-weight:700;margin:6px 0 8px;max-width:none}
.iv-q .ask-link{color:var(--m6)}
.iv-hint{background:color-mix(in srgb,var(--m6) 9%,var(--surface));border-radius:14px;padding:12px 14px;color:var(--ink);margin-top:8px}
.iv-meta{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:6px 0 12px;font-weight:600}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.score-card{border-radius:18px;padding:14px 16px;background:color-mix(in srgb,var(--c) 11%,var(--surface))}
.score-card span{display:block;font-weight:700;color:var(--muted);font-size:14px}
.score-card b{font-family:var(--display);font-size:32px;line-height:1.1;color:var(--c)}
.score-card .dots{display:flex;gap:5px;margin-top:6px}.dots i{width:22px;height:7px;border-radius:9px;background:color-mix(in srgb,var(--c) 22%,transparent)}.dots i.on{background:var(--c)}
.iv-fb h3{font-family:var(--display);font-size:17px;margin:18px 0 8px}
.iv-fb ul{margin:0;padding-left:20px}.iv-fb li{margin-bottom:5px}
.fb-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.fb-cols h3{margin-top:0}
.corrs{display:grid;gap:10px}
.corr{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2)}
.c-o{color:var(--m3);text-decoration:line-through;text-decoration-thickness:1.5px}
.c-b{color:var(--ok);font-weight:700;margin-top:3px}
.corr p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vocab div{border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--m4) 12%,var(--surface))}
.vocab p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.polished{border-left:5px solid var(--m2);background:var(--surface-2);border-radius:0 14px 14px 0;padding:14px 16px}
.polished p{margin:0 0 8px}.polished p:last-child{margin:0}
.follow{margin-top:18px;border-radius:18px;padding:16px;background:color-mix(in srgb,var(--m6) 9%,var(--surface))}
.follow h3{margin-top:0}.follow p{font-weight:600}
.iv-hist-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.iv-hist-head h2{margin:0}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2)}
.h-q{font-weight:600}
.h-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted);margin-top:6px}
.h-s{font-weight:700;color:var(--c)}
.hist .ask-link{margin:0;color:var(--brand)}
@media (max-width:760px){.fb-cols,.scores{grid-template-columns:1fr}}

.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Tablets (Galaxy Tab S e Tab A, vertical e horizontal) ===== */
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
a,button,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.modules{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.pts-top{flex-wrap:wrap}
.pts-big{white-space:nowrap}
.chat-fab,.sheet-bd,.chat-close{display:none}

/* Cabeçalho em duas linhas: marca e controles em cima, menu rolável embaixo */
@media (max-width:1020px){
  .top-in{flex-wrap:wrap;row-gap:6px;padding:10px 18px 8px}
  .nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:6px;padding-bottom:2px}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;flex:none}
  .top-right{margin-left:auto}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}

  /* Página inicial: título em cima, cards de progresso e pontos lado a lado */
  .hero{grid-template-columns:1fr;gap:22px}
  .hero-side{grid-template-columns:1fr 1fr;align-items:stretch}
  .hero-side .continue{height:100%}
  .pts-card{justify-content:center}
  .pts-top{flex-direction:column;align-items:flex-start;gap:8px}
  .rank{text-align:left}

  /* Tutor vira um painel que sobe da parte de baixo da tela */
  .lesson-grid #chatBox{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));
    transform:translateY(110%);transition:transform .28s ease;max-width:820px;margin:0 auto;pointer-events:none}
  .lesson-grid #chatBox.open{transform:none;pointer-events:auto}
  .lesson-grid #chatBox .chat{position:relative;top:auto;max-height:min(78vh,680px);border-radius:26px;box-shadow:0 -8px 40px rgba(20,18,50,.28)}
  .lesson-grid #chatBox .msgs{max-height:none}
  .chat-close{display:grid;place-items:center;position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:16px}
  .chat-head{padding-right:64px}
  .chat-fab{display:flex;align-items:center;gap:8px;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;
    border:0;border-radius:999px;padding:14px 20px;font-weight:800;font-size:15px;color:#fff;background:var(--c,var(--brand));box-shadow:0 8px 24px rgba(20,18,50,.3)}
  .sheet-bd{position:fixed;inset:0;z-index:44;background:rgba(15,14,35,.35);backdrop-filter:blur(2px)}
  .sheet-bd.show{display:block}
  body.sheet-open{overflow:hidden}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
  .lesson-grid > div:first-child{padding-bottom:70px}
}
@media (max-width:640px){
  .hero-side{grid-template-columns:1fr}
}

/* Toque: áreas de clique maiores em telas sensíveis ao toque */
@media (pointer:coarse){
  .nav a{padding:10px 16px}
  .stop{width:40px;height:40px;font-size:14px}
  .stops{gap:10px}.stop-group{gap:7px;padding:7px 10px}
  .lang button{padding:9px 14px;font-size:14px}
  .theme-btn{width:42px;height:42px}
  .pill{padding:9px 13px}
  .chip{padding:10px 14px;font-size:14px}
  .ask-link{padding:8px 0;display:inline-block}
  .lessons a{padding:13px 12px}
  .fq-opt{padding:13px 14px;min-height:50px;font-size:15.5px}
  .opt{padding:13px 14px}
  .seg{padding:10px 15px;font-size:14px}
  .btn{min-height:46px}
  .composer textarea{font-size:16px}
  .search{font-size:17px}
}
@media (hover:none){
  .stop:hover,.fq-opt:hover:not(:disabled){transform:none}
  .lessons a:hover{background:transparent}
}

@media (pointer:coarse) and (min-width:1021px){.nav a{padding:10px 12px}.nav{gap:2px}.top-in{gap:12px}}
/* Tablets na horizontal com tela mais baixa: cabeçalho rola junto para liberar espaço de leitura */
@media (max-height:700px) and (orientation:landscape){
  .top{position:relative;top:auto}
  html{scroll-padding-top:16px}
  .chat{top:16px}
  .lesson-grid #chatBox .chat{max-height:86vh}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"><i style="background:var(--m1)"></i><i style="background:var(--m3)"></i><i style="background:var(--m5)"></i><i style="background:var(--m4)"></i></span>
      <span id="brandName">Trilha AI PM</span>
    </a>
    <nav class="nav" aria-label="Seções">
      <a href="#/" data-nav="home">Trilha</a>
      <a href="#/glossario" data-nav="glossario">Glossário</a>
      <a href="#/tutor" data-nav="tutor">Tutor</a>
      <a href="#/entrevista" data-nav="entrevista">Entrevista</a>
      <a href="#/biblioteca" data-nav="biblioteca">Biblioteca</a>
    </nav>
    <div class="top-right">
      <div class="lang" role="group" aria-label="Idioma da página"><button data-lang="pt" aria-pressed="true">PT</button><button data-lang="en" aria-pressed="false">EN</button></div>
      <span class="pill pts-pill" id="topPts">⭐ 0 pts</span>
      <span class="pill" id="topProgress">0 de 32 aulas</span>
      <button class="theme-btn" id="themeBtn" aria-label="Alternar tema claro ou escuro">◐</button>
    </div>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ CONTEÚDO DA TRILHA ============ */
const MODULES = [
 {n:1,c:"var(--m1)",title:"O que é IA e como chegamos até aqui",
  desc:"Conceitos, origens, IA simbólica e a diferença entre parecer inteligente e ser confiável.",
  ex:"Compare uma interação baseada em regras com uma resposta generativa e discuta o que cada sistema realmente demonstrou ser capaz de fazer.",
  lessons:[
  {t:"O conceito de inteligência artificial",
   s:"O que estamos chamando de IA? Aqui você conhece as capacidades clássicas (percepção, representação de conhecimento, raciocínio, aprendizagem e tomada de decisão) e aprende a separar IA, automação, algoritmo, modelo e produto.",
   k:[["Algoritmo","Sequência finita de passos para resolver um problema. Nem todo algoritmo é IA: ordenar uma lista é algoritmo, não inteligência."],
      ["Automação","Executar uma tarefa sem intervenção humana. Pode ser feita só com regras fixas, sem nenhuma IA envolvida."],
      ["Modelo","Artefato matemático que transforma entradas em saídas, normalmente aprendido a partir de dados. Exemplo: um classificador de spam."],
      ["Produto de IA","A experiência completa entregue ao usuário: modelo, dados, interface, regras, integrações e operação. O modelo é apenas uma das peças."],
      ["Capacidades clássicas da IA","Perceber o ambiente, representar conhecimento, raciocinar, aprender com experiência e decidir. Um sistema pode ter umas e não outras."]],
   pm:"Em entrevistas, separar \"temos um modelo\" de \"temos um produto\" mostra maturidade. O valor vem do problema resolvido, não da tecnologia escolhida."},
  {t:"As origens e os fundamentos da IA",
   s:"As perguntas que deram origem ao campo, suas conexões com lógica, matemática e computação, e o encontro de Dartmouth em 1956 como marco. A ideia é conhecer as linhas de pensamento sem contar a história como se uma abordagem tivesse eliminado a outra.",
   k:[["Teste de Turing (1950)","Alan Turing propôs trocar a pergunta \"máquinas pensam?\" por um jogo de imitação: se não dá para distinguir a máquina de uma pessoa na conversa, o que isso diz?"],
      ["Conferência de Dartmouth (1956)","Encontro organizado por John McCarthy, Marvin Minsky, Claude Shannon e Nathaniel Rochester que consolidou a IA como campo de pesquisa."],
      ["Simbolismo e conexionismo","Uma linha representa conhecimento com símbolos e regras lógicas; outra aprende padrões com redes de unidades conectadas. As duas coexistiram e hoje se combinam."],
      ["Invernos da IA","Períodos de corte de investimento depois de expectativas infladas, nos anos 1970 e no fim dos anos 1980."]],
   pm:"Ciclos de hype e decepção se repetem. Um PM sênior calibra as expectativas de stakeholders com evidências, e não com promessas."},
  {t:"IA simbólica e sistemas especialistas",
   s:"Bases de conhecimento, regras e motores de inferência. Como representar o conhecimento de um especialista e usá-lo para chegar a conclusões, quais são as vantagens e limitações, e quando regras explícitas continuam sendo a melhor escolha.",
   k:[["Base de conhecimento","Conjunto de fatos e regras de um domínio, normalmente escritos com a ajuda de especialistas humanos."],
      ["Motor de inferência","Componente que aplica as regras aos fatos para chegar a conclusões, encadeando regras para frente (dos fatos à conclusão) ou para trás (da hipótese aos fatos)."],
      ["MYCIN","Sistema especialista dos anos 1970, em Stanford, que sugeria tratamentos para infecções bacterianas usando centenas de regras."],
      ["Gargalo de aquisição de conhecimento","Extrair e manter regras de especialistas é caro, e o sistema quebra diante de situações que ninguém previu."],
      ["Quando regras ainda vencem","Requisitos regulatórios, lógica que precisa ser auditável, poucos casos bem definidos e custo de erro muito alto."]],
   pm:"Antes de propor um LLM, pergunte se uma regra explícita resolve. Muitas vezes ela é mais barata, previsível e fácil de explicar."},
  {t:"ELIZA e a diferença entre parecer inteligente e ser confiável",
   s:"ELIZA e o efeito ELIZA: a tendência de atribuir compreensão e capacidades humanas a sistemas computacionais. O tema se conecta à confiança do usuário, à antropomorfização e ao risco de confundir conversa convincente com competência real.",
   k:[["ELIZA (1966)","Programa criado por Joseph Weizenbaum no MIT que simulava um terapeuta reformulando as frases do usuário com padrões simples."],
      ["Efeito ELIZA","Tendência de atribuir compreensão e intenção humanas a um sistema só porque a conversa soa natural."],
      ["Antropomorfização","Dar características humanas ao sistema (nome, emoções, \"eu entendo você\"). Aumenta a confiança, às vezes além do que o sistema merece."],
      ["Fluência não é competência","Um texto convincente pode estar errado. Confiabilidade se mede com testes, não com a impressão que a conversa causa."]],
   pm:"Em produtos de IA, desenhe uma confiança calibrada: mostre fontes, deixe claros os limites e sinalize quando a resposta pode falhar."}
 ]},
 {n:2,c:"var(--m2)",title:"Os tipos de IA e como os modelos aprendem",
  desc:"Organizar os tipos de IA sem misturar conceitos, entender machine learning e o ciclo de vida de um modelo.",
  ex:"Para diferentes problemas de negócio, escolha entre regras, classificação, previsão ou outra abordagem, e justifique a escolha.",
  lessons:[
  {t:"Como organizar os \"tipos de IA\" sem misturar conceitos",
   s:"Separar as classificações por capacidade, abordagem e aplicação. IA estreita, AGI e superinteligência são conceitos de capacidade; IA simbólica e aprendizado de máquina são abordagens; visão computacional, linguagem e recomendação são campos de aplicação.",
   k:[["Por capacidade","IA estreita (tarefas específicas, que é tudo o que existe hoje), AGI (capacidade geral comparável à humana, conceito ainda em debate) e superinteligência (hipotética)."],
      ["Por abordagem","Simbólica (regras e lógica), aprendizado de máquina (padrões aprendidos com dados) e abordagens híbridas."],
      ["Por aplicação","Visão computacional, linguagem natural, fala, recomendação, previsão, robótica e outros."],
      ["Eixos, não caixas","Um recomendador pode ser IA estreita, baseado em aprendizado de máquina e aplicado a e-commerce, tudo ao mesmo tempo."]],
   pm:"Ao descrever um produto, deixe claro de qual eixo você está falando. Isso evita discussões confusas entre engenharia, design e negócio."},
  {t:"Machine learning, redes neurais e deep learning",
   s:"Como aprender padrões a partir de dados. Os tipos de aprendizado (supervisionado, não supervisionado, autossupervisionado e por reforço) e a relação entre aprendizado de máquina, redes neurais e deep learning, com exemplos de classificação, previsão e reconhecimento de padrões.",
   k:[["Aprendizado supervisionado","Aprende com exemplos rotulados (este e-mail é spam, aquele não). Serve para classificação e regressão."],
      ["Não supervisionado","Encontra estrutura em dados sem rótulos, como agrupar clientes por comportamento de compra."],
      ["Autossupervisionado","O próprio dado gera o rótulo, como esconder a próxima palavra e pedir para o modelo prevê-la. É a base do pré-treino dos LLMs."],
      ["Aprendizado por reforço","Aprende por tentativa, erro e recompensa. Aparece em jogos, robótica e no ajuste de LLMs com feedback humano (RLHF)."],
      ["Redes neurais e deep learning","Deep learning é um tipo de rede neural com muitas camadas, e redes neurais são uma família dentro do aprendizado de máquina."]],
   pm:"O tipo de aprendizado depende muito dos dados disponíveis. Quem costuma saber se existem rótulos, ou quanto custaria criá-los, é o PM."},
  {t:"Dados, treinamento, inferência e avaliação básica",
   s:"O ciclo de vida de um modelo: preparação dos dados, treinamento, validação, teste e uso em produção. Qualidade dos dados, generalização, sobreajuste, vazamento entre treino e teste, e a diferença entre uma pontuação do modelo e uma probabilidade calibrada.",
   k:[["Treino, validação e teste","O treino ajusta o modelo, a validação ajuda a escolher configurações e o teste mede o desempenho final em dados nunca vistos."],
      ["Sobreajuste (overfitting)","O modelo decora os exemplos de treino e vai mal em dados novos. É como estudar só as respostas da prova do ano passado."],
      ["Vazamento de dados (data leakage)","Informação do teste, ou do futuro, contamina o treino e infla as métricas. Tudo parece ótimo até ir para produção."],
      ["Inferência","Usar o modelo treinado para gerar previsões no dia a dia. Tem custo e latência próprios, que o PM precisa acompanhar."],
      ["Score vs. probabilidade calibrada","Um score de 0,9 só significa \"90% de chance\" se o modelo estiver calibrado, ou seja, se entre os casos com 0,9 cerca de 90% forem realmente positivos."]],
   pm:"Métricas excelentes em teste podem esconder vazamento. Pergunte sempre como o conjunto de teste foi montado e se ele representa o uso real."}
 ]},
 {n:3,c:"var(--m3)",title:"IA generativa por dentro",
  desc:"Modelos de fundação, como um LLM gera tokens e como embeddings e bancos vetoriais entram na história.",
  ex:"Observe a tokenização de diferentes textos e compare resultados de busca por palavras-chave com resultados de busca semântica.",
  lessons:[
  {t:"O que é IA generativa",
   s:"Geração de texto, imagem, áudio, vídeo e código. Modelos de fundação, modelos de linguagem e modelos multimodais, distinguindo o modelo da aplicação construída sobre ele, sem reduzir toda IA generativa a um chatbot.",
   k:[["IA generativa","Modelos que produzem conteúdo novo (texto, imagem, áudio, vídeo, código) em vez de apenas classificar ou prever um número."],
      ["Modelo de fundação","Modelo grande, pré-treinado em dados amplos, que pode ser adaptado para muitas tarefas diferentes."],
      ["Multimodal","Modelo que entende ou gera mais de um tipo de dado, como texto e imagem juntos."],
      ["Mecanismos de geração","Modelos autorregressivos geram texto token a token; modelos de difusão criam imagens partindo de ruído e refinando aos poucos."],
      ["Modelo vs. aplicação","O Claude é um modelo; um assistente de atendimento construído sobre ele é uma aplicação, com regras, dados e interface próprios."]],
   pm:"Chat é só uma das interfaces possíveis. Muitas vezes o melhor uso de IA generativa é invisível, embutido em um fluxo que o usuário já conhece."},
  {t:"Como um modelo de linguagem gera tokens",
   s:"O caminho da entrada até a resposta: tokenização, processamento do contexto, cálculo de probabilidades e escolha sucessiva dos tokens. Temperatura, limites de saída e janela de contexto, lembrando que a probabilidade de um token não é a probabilidade de a resposta estar correta.",
   k:[["Token","Pedaço de texto (palavra, parte de palavra ou pontuação) que o modelo processa. Textos em português costumam gastar mais tokens que em inglês."],
      ["Geração autorregressiva","O modelo calcula a probabilidade do próximo token, escolhe um, acrescenta ao contexto e repete até terminar."],
      ["Temperatura","Controla a aleatoriedade na escolha dos tokens. Mais baixa deixa a resposta mais previsível; mais alta, mais variada."],
      ["Janela de contexto","Quantidade máxima de tokens que o modelo consegue considerar de uma vez, somando entrada e saída."],
      ["Probabilidade não é verdade","O modelo pode escolher com alta confiança uma sequência factualmente errada. É daí que vêm as alucinações."]],
   pm:"Custo e latência são cobrados por token. Entender tokens é entender a conta do seu produto de IA e o tempo de espera do usuário."},
  {t:"Embeddings, busca semântica e bancos vetoriais",
   s:"Como representar conteúdo em números para encontrar itens semelhantes. Embeddings para recuperação de documentos, indexação, metadados e busca lexical, vetorial e híbrida. O banco vetorial recupera conteúdo; ele não gera os tokens da resposta.",
   k:[["Embedding","Vetor de números que representa o significado de um texto. Textos com sentido parecido ficam próximos nesse espaço."],
      ["Similaridade","Medida de proximidade entre vetores (como a similaridade de cosseno), usada para achar conteúdos parecidos."],
      ["Busca lexical","Procura palavras exatas, como no algoritmo BM25. Excelente para códigos, nomes próprios e termos raros."],
      ["Busca vetorial e híbrida","A vetorial encontra sinônimos e paráfrases; a híbrida combina as duas para ter o melhor de cada uma."],
      ["Banco vetorial","Armazena e indexa embeddings para recuperar trechos rapidamente. Quem escreve a resposta continua sendo o modelo de linguagem."]],
   pm:"Se o cliente busca \"pedido 4821\", a busca lexical ganha. Se pergunta \"como devolvo um produto?\", a busca semântica ajuda muito."}
 ]},
 {n:4,c:"var(--m4)",title:"Modelos abertos, fechados e decisões econômicas",
  desc:"O que é realmente aberto, onde o modelo roda, quanto custa e como escolher.",
  ex:"Defenda a escolha de arquitetura para um protótipo de baixo volume e para uma operação de maior escala.",
  lessons:[
  {t:"Modelos fechados, open-weight e open source",
   s:"O que efetivamente está disponível em cada caso: pesos, código, informações sobre os dados e permissões de uso. Como ler uma model card e uma licença, lembrando que disponibilizar os pesos não torna um sistema automaticamente open source.",
   k:[["Modelo fechado","Acessível só por API ou produto do fornecedor. Os pesos não são divulgados."],
      ["Open-weight","Os pesos podem ser baixados, mas dados de treino, código de treino ou a própria licença podem ter restrições."],
      ["Open source em IA","Pela definição da Open Source Initiative, exige liberdade de usar, estudar, modificar e compartilhar, com acesso a pesos, código e informação suficiente sobre os dados."],
      ["Model card","Documento que descreve uso pretendido, dados, avaliações, limitações e riscos de um modelo."],
      ["Licença","Define o que é permitido: uso comercial, limites de escala, restrições de aplicação e obrigações de atribuição."]],
   pm:"Antes de adotar um modelo aberto, leia a licença junto com o jurídico. \"Pesos abertos\" não quer dizer \"uso livre\"."},
  {t:"Onde o modelo roda: API, nuvem ou infraestrutura própria",
   s:"Comparar um modelo proprietário acessado por API, um modelo de pesos abertos hospedado por terceiros e um modelo executado em infraestrutura própria. Abertura do modelo e forma de hospedagem são decisões diferentes.",
   k:[["API proprietária","Você chama o modelo do fornecedor e paga por uso. Pouca operação, menos controle sobre o ambiente."],
      ["Open-weight gerenciado","Modelo aberto hospedado por um provedor de nuvem e consumido também como API."],
      ["Self-hosted","Roda em infraestrutura própria ou dedicada. Mais controle sobre dados e customização, e muito mais trabalho de operação."],
      ["Abertura e hospedagem são eixos diferentes","Um modelo aberto pode ser usado como serviço gerenciado, e um fechado pode estar disponível dentro da sua nuvem."]],
   pm:"Privacidade, residência de dados e exigências de clientes enterprise costumam decidir a hospedagem mais do que a qualidade do modelo."},
  {t:"Quanto custa usar cada alternativa",
   s:"Comparar cobrança por consumo com custos de capacidade computacional. Montar cenários com tokens, CPU e GPU, capacidade ociosa, disponibilidade, manutenção e equipe, calculando o custo total sem assumir de antemão que aberto é mais barato ou que API é mais cara.",
   k:[["Cobrança por consumo","Preço por milhão de tokens de entrada e de saída. O custo cresce junto com o volume de uso."],
      ["Custo de capacidade","GPUs reservadas são cobradas por hora, sendo usadas ou não."],
      ["Capacidade ociosa","GPU parada continua custando. Baixa utilização encarece cada requisição atendida."],
      ["Custo total (TCO)","Inclui infraestrutura, alta disponibilidade, manutenção, monitoramento e as pessoas que operam tudo isso."],
      ["Ponto de equilíbrio","Volume a partir do qual hospedar passa a compensar mais do que pagar por uso, quando esse ponto existe."]],
   pm:"Monte uma planilha com cenários de volume antes de opinar. É o tipo de raciocínio que entrevistadores de AI PM adoram ver."},
  {t:"Como escolher um modelo e quando adotar uma solução híbrida",
   s:"Uma matriz de decisão com qualidade na tarefa, custo, latência, privacidade, licença e capacidade operacional. Testar uma arquitetura que envia tarefas simples a um modelo menor e casos complexos a um mais capaz, comparando com um único modelo.",
   k:[["Matriz de decisão","Critérios com pesos (qualidade, custo, latência, privacidade, licença, operação) para comparar opções de forma explícita."],
      ["Avaliar na sua tarefa","Benchmarks públicos dão pistas, mas quem decide é o desempenho no seu próprio conjunto de testes."],
      ["Roteamento de modelos","Tarefas simples vão para um modelo menor e barato; casos complexos, para um modelo mais capaz."],
      ["Cascata","Tenta primeiro o modelo barato e escala para o maior quando a confiança é baixa ou a validação falha."],
      ["O custo do roteador","O roteamento também erra e adiciona complexidade. Compare sempre com a opção de usar um único modelo."]],
   pm:"A resposta madura raramente é \"o melhor modelo\". É o modelo suficiente para a qualidade exigida, com o menor custo total."}
 ]},
 {n:5,c:"var(--m5)",title:"Prompt engineering, context engineering e RAG",
  desc:"Instruções testáveis, a informação certa no contexto e respostas apoiadas em fontes.",
  ex:"Resolva a mesma tarefa com diferentes estratégias (prompt, contexto longo, RAG, fine-tuning) e compare qualidade, custo, manutenção e atualização das informações.",
  lessons:[
  {t:"Prompt engineering: instruções que podem ser testadas",
   s:"Objetivo, instruções, exemplos, restrições e formato esperado. Clareza, versionamento e comparação entre versões: em vez de colecionar prompts mágicos, medir como cada alteração afeta os resultados.",
   k:[["Anatomia de um bom prompt","Objetivo, contexto, instruções, exemplos, restrições e formato de saída, nessa ordem de importância para a clareza."],
      ["Few-shot","Incluir exemplos de entrada e saída esperada para mostrar ao modelo o padrão desejado."],
      ["Saída estruturada","Pedir JSON ou outro formato fixo facilita validar a resposta e integrar com outros sistemas."],
      ["Versionamento de prompts","Tratar prompt como código: versão, histórico de mudanças e possibilidade de voltar atrás."],
      ["Comparar versões","Rodar cada versão no mesmo conjunto de casos e comparar resultados, em vez de confiar na impressão de um teste isolado."]],
   pm:"Prompt é parte da especificação do produto. Pense nele como uma user story que o modelo executa, com critérios de aceite testáveis."},
  {t:"Context engineering: qual informação chega ao modelo",
   s:"Selecionar, organizar e atualizar instruções, histórico, documentos e resultados de ferramentas. Orçamento de contexto, resumo, memória persistente e descarte de informação irrelevante. A pergunta muda de \"como escrever o pedido?\" para \"o que o modelo precisa receber?\".",
   k:[["Contexto","Tudo o que o modelo recebe numa chamada: instruções de sistema, histórico, documentos e resultados de ferramentas."],
      ["Orçamento de contexto","A janela é finita e cada token custa. Informação irrelevante pode até piorar a qualidade da resposta."],
      ["Resumo e compactação","Condensar conversas ou documentos longos para manter só o que importa para a tarefa."],
      ["Memória persistente","Guardar fatos entre sessões (preferências, decisões) e trazê-los de volta quando forem relevantes."],
      ["A pergunta central","O que o modelo precisa saber, neste momento, para executar bem esta tarefa específica?"]],
   pm:"Muitos problemas atribuídos ao modelo são, na verdade, problemas de contexto: faltou informação ou sobrou ruído."},
  {t:"RAG: responder usando fontes externas",
   s:"O fluxo de recuperação e geração: ingestão, divisão em trechos, busca, reordenação e resposta apoiada em fontes. Atualização dos documentos, permissões e avaliação separada da recuperação e da resposta, comparando busca lexical, vetorial e híbrida.",
   k:[["RAG","Retrieval-Augmented Generation: recuperar trechos relevantes de fontes externas e entregá-los ao modelo para que ele responda com base neles."],
      ["Ingestão e chunking","Carregar documentos e dividi-los em trechos de tamanho adequado, acompanhados de metadados como data, autor e permissão."],
      ["Reranking","Reordenar os trechos recuperados com um modelo mais preciso antes de enviá-los ao LLM."],
      ["Citações","A resposta indica quais fontes usou, o que permite ao usuário conferir."],
      ["Permissões e atualização","O usuário só deve receber trechos que tem direito de ver, e o índice precisa acompanhar as mudanças nos documentos."],
      ["Avaliação em duas partes","Medir a recuperação (achou o trecho certo?) separada da geração (a resposta é fiel ao trecho?)."]],
   pm:"Quando o RAG erra, a primeira pergunta é: o trecho certo chegou ao modelo? Isso separa problema de busca de problema de geração."},
  {t:"Quando usar prompt, contexto longo, RAG ou fine-tuning",
   s:"Comparar as alternativas para melhorar uma solução: aprimorar instruções, fornecer documentos diretamente, recuperar informações sob demanda ou adaptar o modelo com treinamento adicional. Combinações e critérios de escolha, sem tratar as técnicas como substitutas universais.",
   k:[["Melhorar o prompt","Primeiro passo: barato, rápido e reversível."],
      ["Contexto longo","Colocar os documentos inteiros no contexto. Simples quando o material é pequeno, estável e cabe na janela."],
      ["RAG","Indicado quando a base é grande, muda com frequência ou exige controle de permissões."],
      ["Fine-tuning","Ajustar os pesos com exemplos para ensinar formato, estilo ou uma tarefa específica. Não é a melhor forma de ensinar conhecimento que muda com frequência."],
      ["Combinações","Um sistema real pode unir prompt bem feito, RAG e um modelo ajustado, cada um resolvendo uma parte."]],
   pm:"Saber explicar por que você não fez fine-tuning é tão valioso quanto saber quando fazer."}
 ]},
 {n:6,c:"var(--m6)",title:"De assistentes a agentes",
  desc:"Diferenças entre chatbots, workflows e agentes, anatomia de um agente e o mercado na prática.",
  ex:"Compare agentes e plataformas de mercado considerando autonomia, integrações, supervisão, custo e critérios de sucesso, e não apenas a qualidade de uma demonstração.",
  lessons:[
  {t:"Chatbots, assistentes, workflows e agentes: qual é a diferença?",
   s:"Separar a experiência oferecida ao usuário da arquitetura que a sustenta. Um assistente pode usar agentes, e \"assistente\" não significa \"apenas responde\". Na arquitetura, comparar fluxos predefinidos com sistemas em que o modelo decide os próximos passos.",
   k:[["Chatbot","Interface conversacional. Por trás pode haver regras simples ou um modelo de linguagem."],
      ["Assistente","Experiência feita para ajudar o usuário em tarefas. Pode ou não usar agentes internamente."],
      ["Workflow","Sequência de passos definida em código, em que o LLM executa etapas previstas de antemão."],
      ["Agente","O modelo decide dinamicamente os próximos passos e quais ferramentas usar até cumprir um objetivo."],
      ["Experiência não é arquitetura","O nome que aparece na interface não revela como o sistema funciona por dentro."]],
   pm:"Quando alguém disser \"vamos fazer um agente\", pergunte qual decisão o modelo precisa tomar sozinho que um fluxo fixo não resolveria."},
  {t:"Anatomia de um agente de IA",
   s:"Objetivo, modelo, ferramentas, estado, ciclo de ação e observação e condições de parada. APIs, chamadas de ferramentas, MCP e permissões, projetando um agente com escopo limitado, orçamento de execução e pontos de aprovação humana.",
   k:[["Objetivo e condição de parada","O que o agente precisa alcançar e quando deve parar, seja por sucesso, falha ou limite atingido."],
      ["Ferramentas (tool use)","Funções ou APIs que o modelo pode chamar, descritas com nome, finalidade e parâmetros."],
      ["Ciclo ação e observação","O agente age, observa o resultado e decide o próximo passo, repetindo até concluir."],
      ["Estado","O que o agente sabe e já fez até o momento, incluindo resultados intermediários."],
      ["MCP (Model Context Protocol)","Padrão aberto, lançado pela Anthropic, para conectar modelos a ferramentas e fontes de dados de forma padronizada."],
      ["Guardrails","Permissões mínimas, orçamento de passos e custo, e aprovação humana para ações sensíveis ou irreversíveis."]],
   pm:"Desenhar os pontos de aprovação humana é trabalho de produto. É ali que confiança, risco e experiência se encontram."},
  {t:"Arquiteturas de agentes e quando não usá-las",
   s:"Comparar fluxo fixo, agente único, execução paralela e delegação entre agentes. O que a autonomia acrescenta e quanto custa em complexidade, e principalmente quando uma solução determinística ou uma única chamada ao modelo já resolve.",
   k:[["Fluxo fixo","Previsível, barato e fácil de testar. Ótimo quando os passos são conhecidos."],
      ["Agente único com ferramentas","Um modelo com acesso a algumas ferramentas decide a ordem de uso. Bom para tarefas abertas de escopo limitado."],
      ["Execução paralela","Várias chamadas simultâneas cujos resultados são combinados depois. Reduz tempo em tarefas independentes."],
      ["Orquestrador e subagentes","Um agente divide o trabalho e delega partes a outros. Poderoso, mas caro e difícil de depurar."],
      ["O preço da autonomia","Mais tokens, mais latência, mais variabilidade e mais pontos de falha."]],
   pm:"Regra prática: comece com a solução mais simples que funciona e acrescente autonomia só quando ela provar valor em teste."},
  {t:"Agentes e plataformas do mercado, na prática",
   s:"Estudar referências de categorias diferentes sem confundir um agente pronto com uma plataforma para construir agentes: agentes de programação, de pesquisa e síntese, e plataformas empresariais.",
   k:[["Agentes de programação","Codex e Claude Code executam tarefas de desenvolvimento: leem o código, rodam comandos, propõem mudanças e pedem revisão."],
      ["Pesquisa e síntese","Gemini Deep Research planeja a pesquisa, consulta várias fontes e monta um relatório."],
      ["Plataformas empresariais","Microsoft Copilot Studio e Salesforce Agentforce servem para construir e operar agentes conectados a processos e sistemas de negócio."],
      ["Agente pronto vs. plataforma","Um é produto para usar direto; a outra é ferramenta para montar agentes próprios."],
      ["Como comparar","Autonomia, integrações, supervisão, custo e critérios de sucesso pesam mais do que uma demonstração bonita."]],
   pm:"Você já usa Claude Code e Cursor no dia a dia. Observe onde eles pedem aprovação, como mostram o que fizeram e quando param: isso é design de agente."}
 ]},
 {n:7,c:"var(--m7)",title:"Qualidade, confiabilidade e operação",
  desc:"Evals, projeto para falhas, observabilidade e métricas do técnico ao negócio.",
  ex:"Investigue as falhas de uma solução e proponha melhorias apoiadas em evidências, e não apenas em impressões.",
  lessons:[
  {t:"Evals: como demonstrar que a solução funciona",
   s:"Definir critérios de sucesso, montar conjuntos de avaliação e combinar testes automáticos com avaliação humana. Modelos como julgadores, suas limitações e a necessidade de calibrá-los, separando os exemplos usados para melhorar a solução daqueles reservados para testá-la.",
   k:[["Eval","Conjunto de casos com critérios de sucesso para medir se o sistema faz o que deveria."],
      ["Golden set","Casos representativos com resposta esperada, incluindo casos difíceis e de borda."],
      ["Automático e humano","Testes automáticos dão escala; a avaliação humana captura nuances e calibra os critérios."],
      ["LLM como juiz","Um modelo avalia respostas seguindo uma rubrica. Precisa ser comparado com avaliadores humanos para merecer confiança."],
      ["Desenvolvimento vs. teste","Os exemplos usados para ajustar o prompt não podem ser os mesmos que medem o resultado final."]],
   pm:"Seu case do Design QA Agent já tem 24 casos com recall e precisão medidos. É exatamente esse raciocínio que você vai defender em entrevista."},
  {t:"Reliability: como projetar para falhas",
   s:"Metas de confiabilidade, limites de tempo, novas tentativas, alternativas de recuperação e encaminhamento para humanos. Prevenção de ações duplicadas, controle de versões e reversão de mudanças, usando objetivos de nível de serviço para tornar \"ser confiável\" algo verificável.",
   k:[["SLO e SLI","O objetivo de nível de serviço (ex.: 99,5% das respostas em até 5 segundos) e o indicador que o mede."],
      ["Timeout e retry","Limite de espera e novas tentativas com intervalo crescente (backoff), para não sobrecarregar o sistema."],
      ["Fallback","Plano B quando algo falha: modelo alternativo, resposta padrão ou encaminhamento para uma pessoa."],
      ["Idempotência","Repetir a mesma ação não pode duplicar o efeito, como abrir dois chamados para o mesmo problema."],
      ["Versionamento e rollback","Prompts, modelos e configurações com versão, para voltar rapidamente quando algo piora."]],
   pm:"Transforme \"precisa ser confiável\" em números combinados com engenharia. Isso dá clareza para priorizar e para negociar escopo."},
  {t:"Observability: como descobrir onde o sistema falhou",
   s:"Registrar e inspecionar etapas de execução, chamadas a ferramentas, fontes consultadas, versões, consumo e erros. Distinguir a resposta apresentada ao usuário do resultado efetivamente obtido.",
   k:[["Trace","Registro de cada etapa de uma execução: chamadas ao modelo, ferramentas usadas, fontes, tempo e tokens."],
      ["Versões registradas","Saber qual versão de prompt, modelo e índice gerou cada resposta."],
      ["Consumo e erros","Tokens, custo, latência e falhas por etapa, para achar gargalos."],
      ["Verificar o efeito, não a fala","O agente dizer \"o chamado foi aberto\" não prova que o chamado existe no sistema."],
      ["Revisão de amostras","Ler conversas reais periodicamente revela problemas que nenhuma métrica agregada mostra."]],
   pm:"Sem observabilidade, cada bug vira opinião. Com traces, vira evidência para priorizar."},
  {t:"Metrics: do desempenho técnico ao resultado de negócio",
   s:"Um painel em três camadas: qualidade da tarefa, saúde operacional e impacto no negócio, com indicadores como resolução correta, intervenção humana, disponibilidade, latência, custo por tarefa, adoção e tempo economizado.",
   k:[["Qualidade da tarefa","Resolução correta, fidelidade às fontes e taxa de erro."],
      ["Saúde operacional","Disponibilidade, latência, custo por tarefa e taxa de intervenção humana."],
      ["Impacto no negócio","Adoção, retenção, tempo economizado, receita gerada ou custo evitado."],
      ["Métrica de contrapeso","Indicador que protege contra otimizações ruins, como satisfação do cliente ao lado da taxa de automação."],
      ["Indicadores antecedentes e consequentes","Os antecedentes mudam rápido e sinalizam tendência; os consequentes mostram o resultado final, mas demoram."]],
   pm:"Conectar métrica técnica a resultado de negócio é o que diferencia um AI PM sênior de alguém que só acompanha acurácia."}
 ]},
 {n:8,c:"var(--m8)",title:"Eficiência, segurança e governança",
  desc:"Otimizar custo e latência do sistema completo e controlar riscos antes do lançamento.",
  ex:"Monte um plano de redução de custo e um registro de riscos, explicando quais controles são necessários antes do lançamento.",
  lessons:[
  {t:"Cost/Latency: otimizar o sistema completo",

 {title:"What AI is and how we got here",

      ["AI product","The complete experience delivered to the user: model, data, interface, rules, integrations and operations. The model is only one piece."],

   pm:"In interviews, separating \"we have a model\" from \"we have a product\" shows maturity. Value comes from the problem solved, not from the technology chosen."},
  {t:"The origins and foundations of AI",
   s:"The questions that gave rise to the field, its links to logic, mathematics and computing, and the 1956 Dartmouth workshop as a milestone. The goal is to know the schools of thought without telling the story as if one approach simply wiped out the other.",
   k:[["Turing Test (1950)","Alan Turing proposed replacing the question \"can machines think?\" with an imitation game: if you cannot tell the machine from a person in conversation, what does that say?"],
      ["Dartmouth workshop (1956)","A meeting organized by John McCarthy, Marvin Minsky, Claude Shannon and Nathaniel Rochester that established AI as a research field."],
      ["Symbolism and connectionism","One school represents knowledge with symbols and logical rules; the other learns patterns with networks of connected units. Both coexisted and are combined today."],
      ["AI winters","Periods of funding cuts after inflated expectations, in the 1970s and the late 1980s."]],
   pm:"Hype and disappointment cycles repeat. A senior PM calibrates stakeholder expectations with evidence, not promises."},
  {t:"Symbolic AI and expert systems",
   s:"Knowledge bases, rules and inference engines. How to represent an expert's knowledge and use it to reach conclusions, what the advantages and limitations are, and when explicit rules are still the best choice.",
   k:[["Knowledge base","A set of facts and rules about a domain, usually written with the help of human experts."],
      ["Inference engine","The component that applies rules to facts to reach conclusions, chaining forward (from facts to conclusion) or backward (from hypothesis to facts)."],
      ["MYCIN","A 1970s expert system from Stanford that suggested treatments for bacterial infections using hundreds of rules."],
      ["Knowledge acquisition bottleneck","Extracting and maintaining rules from experts is expensive, and the system breaks in situations nobody anticipated."],

   k:[["ELIZA (1966)","A program created by Joseph Weizenbaum at MIT that simulated a therapist by rephrasing the user's sentences with simple patterns."],

 ]},

 {title:"Open models, closed models and economic decisions",

 {title:"Prompt engineering, context engineering and RAG",
  desc:"Testable instructions, the right information in context and answers grounded in sources.",
  ex:"Solve the same task with different strategies (prompt, long context, RAG, fine-tuning) and compare quality, cost, maintenance and information freshness.",
  lessons:[
  {t:"Prompt engineering: instructions you can test",
   s:"Goal, instructions, examples, constraints and expected format. Clarity, versioning and comparing versions: instead of collecting magic prompts, measure how each change affects the results.",
   k:[["Anatomy of a good prompt","Goal, context, instructions, examples, constraints and output format, in order of importance for clarity."],
      ["Few-shot","Including examples of input and expected output to show the model the desired pattern."],
      ["Structured output","Asking for JSON or another fixed format makes it easier to validate the answer and integrate with other systems."],
      ["Prompt versioning","Treat prompts like code: versions, change history and the ability to roll back."],
      ["Comparing versions","Run each version on the same set of cases and compare results, instead of trusting the impression of a single test."]],
   pm:"A prompt is part of the product spec. Think of it as a user story the model executes, with testable acceptance criteria."},
  {t:"Context engineering: what information reaches the model",
   s:"Selecting, organizing and updating instructions, history, documents and tool results. Context budget, summarization, persistent memory and discarding irrelevant information. The question shifts from \"how do I write the request?\" to \"what does the model need to receive?\".",
   k:[["Context","Everything the model receives in a call: system instructions, history, documents and tool results."],
      ["Context budget","The window is finite and every token costs money. Irrelevant information can even hurt answer quality."],
      ["Summarization and compaction","Condensing long conversations or documents to keep only what matters for the task."],
      ["Persistent memory","Storing facts across sessions (preferences, decisions) and bringing them back when relevant."],
      ["The central question","What does the model need to know, right now, to do this specific task well?"]],
   pm:"Many problems blamed on the model are actually context problems: missing information or too much noise."},
  {t:"RAG: answering with external sources",
   s:"The retrieval and generation flow: ingestion, chunking, search, reranking and source-grounded answers. Document updates, permissions and evaluating retrieval separately from the answer, comparing lexical, vector and hybrid retrieval.",
   k:[["RAG","Retrieval-Augmented Generation: retrieving relevant passages from external sources and handing them to the model so it answers based on them."],
      ["Ingestion and chunking","Loading documents and splitting them into well-sized passages, with metadata such as date, author and permissions."],
      ["Reranking","Reordering retrieved passages with a more precise model before sending them to the LLM."],
      ["Citations","The answer shows which sources it used, so the user can check them."],
      ["Permissions and freshness","Users should only receive passages they are allowed to see, and the index must keep up with document changes."],
      ["Two-part evaluation","Measure retrieval (did it find the right passage?) separately from generation (is the answer faithful to the passage?)."]],
   pm:"When RAG fails, the first question is: did the right passage reach the model? That separates a search problem from a generation problem."},
  {t:"When to use prompting, long context, RAG or fine-tuning",
   s:"Compare the options for improving a solution: better instructions, providing documents directly, retrieving information on demand or adapting the model with extra training. Combinations and selection criteria, without treating the techniques as universal substitutes.",
   k:[["Improve the prompt","The first step: cheap, fast and reversible."],
      ["Long context","Put whole documents in the context. Simple when the material is small, stable and fits in the window."],
      ["RAG","Best when the knowledge base is large, changes often or requires permission control."],
      ["Fine-tuning","Adjusting weights with examples to teach format, style or a specific task. Not the best way to teach knowledge that changes often."],
      ["Combinations","A real system can combine a good prompt, RAG and a fine-tuned model, each solving one part."]],
   pm:"Being able to explain why you did not fine-tune is as valuable as knowing when to do it."}
 ]},
 {title:"From assistants to agents",
  desc:"Differences between chatbots, workflows and agents, the anatomy of an agent and the market in practice.",

  lessons:[
  {t:"Chatbots, assistants, workflows and agents: what is the difference?",

   k:[["Chatbot","A conversational interface. Behind it there may be simple rules or a language model."],
      ["Assistant","An experience designed to help the user with tasks. It may or may not use agents internally."],
      ["Workflow","A sequence of steps defined in code, in which the LLM performs steps planned in advance."],
      ["Agent","The model dynamically decides the next steps and which tools to use until it reaches a goal."],
      ["Experience is not architecture","The name shown in the interface does not reveal how the system works inside."]],
   pm:"When someone says \"let's build an agent\", ask which decision the model needs to make on its own that a fixed flow would not handle."},
  {t:"Anatomy of an AI agent",
   s:"Goal, model, tools, state, the action and observation loop and stopping conditions. APIs, tool calls, MCP and permissions, designing an agent with limited scope, an execution budget and human approval points.",

  {t:"Agent architectures and when not to use them",
   s:"Compare fixed flows, a single agent, parallel execution and delegation between agents. What autonomy adds and how much it costs in complexity, and above all when a deterministic solution or a single model call already solves the problem.",
