D(19,{
h:"Depois do ELIZA (1966) vieram o PARRY (1972), que simulava um paciente paranoico, e o A.L.I.C.E. (1995). Nos anos 2010, bots de atendimento com árvores de decisão se espalharam, e assistentes de voz como Siri (2011) e Alexa (2014) chegaram ao grande público. O conceito de agente inteligente está nos livros de IA desde os anos 1990, e Pattie Maes, do MIT, já escrevia em 1994 sobre agentes de software que reduzem trabalho.",
he:"After ELIZA (1966) came PARRY (1972), which simulated a paranoid patient, and A.L.I.C.E. (1995). In the 2010s, decision-tree support bots spread, and voice assistants such as Siri (2011) and Alexa (2014) reached the general public. The concept of an intelligent agent has been in AI textbooks since the 1990s, and MIT's Pattie Maes was already writing in 1994 about software agents that reduce work.",
a:"O texto \"Building effective agents\" (Anthropic, dezembro de 2024) virou referência ao separar workflows (caminhos definidos em código) de agentes (o modelo conduz o próprio processo) e recomendar sempre a solução mais simples. 2025 ficou conhecido como o ano dos agentes, com agentes de programação e de uso de computador. Para atendimento, o benchmark τ-bench (Yao et al., 2024) avalia agentes conversando com usuários simulados e seguindo políticas. A METR (2025) mediu que a duração das tarefas que a IA consegue concluir vem dobrando a cada cerca de sete meses.",
ae:"The piece \"Building effective agents\" (Anthropic, December 2024) became a reference by separating workflows (paths defined in code) from agents (the model directs its own process) and always recommending the simplest solution. 2025 became known as the year of agents, with coding and computer-use agents. For customer support, the τ-bench benchmark (Yao et al., 2024) evaluates agents talking to simulated users while following policies. METR (2025) measured that the length of tasks AI can complete has been doubling roughly every seven months.",
r:"O AI PM escolhe o padrão certo para cada intenção do usuário. No atendimento: dúvida frequente pede um assistente com RAG; reembolso pede um workflow com aprovação; investigação de um problema complexo pode justificar um agente. Também cabe ao PM comunicar claramente ao usuário o que o sistema consegue fazer, evitando expectativas que a arquitetura não sustenta.",
re:"The AI PM picks the right pattern for each user intent. In support: a frequent question calls for an assistant with RAG; a refund calls for a workflow with approval; investigating a complex issue may justify an agent. The PM is also responsible for clearly telling users what the system can do, avoiding expectations the architecture cannot support.",
refs:[["Anthropic (2024). Building effective agents.","Anthropic Building effective agents","w"],
["Yao, S. et al. (2024). τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains.","tau-bench A Benchmark for Tool-Agent-User Interaction in Real-World Domains"],
["Kwa, T. et al. / METR (2025). Measuring AI Ability to Complete Long Tasks.","Measuring AI Ability to Complete Long Tasks METR"],
["Maes, P. (1994). Agents that Reduce Work and Information Overload. CACM.","Agents that Reduce Work and Information Overload"]]
});

D(20,{
h:"O ciclo perceber, planejar e agir vem da robótica: o robô Shakey, do SRI (1966 a 1972), foi o primeiro a raciocinar sobre as próprias ações. Nos anos 1990, surgiram os agentes BDI (crenças, desejos e intenções). Com os LLMs, o ReAct (Yao et al., 2022) combinou raciocínio e ação em um ciclo, o Toolformer (Schick et al., 2023) ensinou modelos a usar ferramentas, a OpenAI lançou o function calling em junho de 2023, e o AutoGPT (2023) gerou o primeiro grande hype de agentes autônomos.",
he:"The perceive, plan and act loop comes from robotics: SRI's Shakey robot (1966 to 1972) was the first to reason about its own actions. In the 1990s, BDI agents (beliefs, desires and intentions) appeared. With LLMs, ReAct (Yao et al., 2022) combined reasoning and acting in a loop, Toolformer (Schick et al., 2023) taught models to use tools, OpenAI launched function calling in June 2023, and AutoGPT (2023) created the first big hype around autonomous agents.",
a:"Hoje, todos os modelos de fronteira usam ferramentas nativamente. O MCP, lançado pela Anthropic em novembro de 2024, foi adotado ao longo de 2025 por OpenAI, Google e Microsoft e virou o padrão de fato para conectar agentes a ferramentas. O Google propôs o protocolo A2A (2025) para comunicação entre agentes, e surgiram SDKs de agentes, como o Claude Agent SDK e o OpenAI Agents SDK. Com isso vieram novos riscos, como ferramentas maliciosas e permissões amplas demais.",
ae:"Today, every frontier model uses tools natively. MCP, launched by Anthropic in November 2024, was adopted throughout 2025 by OpenAI, Google and Microsoft and became the de facto standard for connecting agents to tools. Google proposed the A2A protocol (2025) for agent-to-agent communication, and agent SDKs appeared, such as the Claude Agent SDK and the OpenAI Agents SDK. New risks came along, such as malicious tools and overly broad permissions.",
r:"O AI PM escreve a especificação das ferramentas: quais ações existem, com quais parâmetros e permissões. No atendimento, \"consultar pedido\" é só leitura; \"abrir chamado\" escreve e precisa evitar duplicidade; \"reembolso\" exige aprovação humana. Também define orçamento de passos, condições de parada e as mensagens que o usuário vê quando algo dá errado.",
re:"The AI PM writes the tool specification: which actions exist, with which parameters and permissions. In support, \"check order\" is read-only; \"open ticket\" writes and must avoid duplicates; \"refund\" requires human approval. They also define the step budget, stopping conditions and the messages users see when something goes wrong.",
refs:[["Yao, S. et al. (2022). ReAct: Synergizing Reasoning and Acting in Language Models. ICLR 2023.","ReAct Synergizing Reasoning and Acting in Language Models"],
["Schick, T. et al. (2023). Toolformer: Language Models Can Teach Themselves to Use Tools. NeurIPS.","Toolformer Language Models Can Teach Themselves to Use Tools"],
["Anthropic (2024). Introducing the Model Context Protocol.","Anthropic Introducing the Model Context Protocol","w"],
["Nilsson, N. (1984). Shakey the Robot. SRI Technical Note 323.","Shakey the Robot Nilsson 1984"]]
});

D(21,{
h:"Sistemas multiagentes são estudados desde os anos 1980, na chamada IA distribuída, e ganharam um livro-texto clássico com Michael Wooldridge (2002). Arquiteturas de \"quadro-negro\", como o Hearsay-II (anos 1970), já coordenavam módulos especialistas compartilhando uma área de trabalho. Com os LLMs, frameworks como AutoGen (Wu et al., 2023), CAMEL e MetaGPT popularizaram agentes que conversam entre si.",
he:"Multi-agent systems have been studied since the 1980s, in so-called distributed AI, and got a classic textbook from Michael Wooldridge (2002). \"Blackboard\" architectures such as Hearsay-II (1970s) already coordinated specialist modules sharing a workspace. With LLMs, frameworks such as AutoGen (Wu et al., 2023), CAMEL and MetaGPT popularized agents that talk to each other.",
a:"Em 2025, a Anthropic descreveu seu sistema de pesquisa com orquestrador e subagentes: o desempenho melhorou em pesquisas amplas, mas o consumo de tokens foi cerca de 15 vezes maior que o de uma conversa comum. No mesmo período, a Cognition publicou \"Don't Build Multi-Agents\", argumentando que dividir o trabalho fragmenta o contexto e gera decisões conflitantes. O estudo de Cemri et al. (2025) catalogou por que sistemas multiagentes falham. O consenso: vários agentes valem a pena em tarefas amplas e paralelizáveis, não como padrão.",
ae:"In 2025, Anthropic described its research system with an orchestrator and subagents: performance improved on broad research, but token usage was about 15 times higher than a normal chat. Around the same time, Cognition published \"Don't Build Multi-Agents\", arguing that splitting work fragments context and leads to conflicting decisions. Cemri et al. (2025) catalogued why multi-agent systems fail. The consensus: multiple agents pay off for broad, parallelizable tasks, not as a default.",
r:"O AI PM pesa valor contra custo: se a arquitetura multiagente consome 15 vezes mais tokens, a melhoria de qualidade precisa justificar isso. Na rotina, a recomendação é começar com um workflow, medir, e só então acrescentar autonomia, apresentando para a engenharia os trade-offs de custo, latência e dificuldade de depuração.",
re:"The AI PM weighs value against cost: if a multi-agent architecture consumes 15 times more tokens, the quality gain must justify it. Day to day, the recommendation is to start with a workflow, measure, and only then add autonomy, presenting engineering with the trade-offs in cost, latency and debugging difficulty.",
refs:[["Anthropic (2025). How we built our multi-agent research system.","Anthropic How we built our multi-agent research system","w"],
["Cognition (2025). Don't Build Multi-Agents.","Cognition Don't Build Multi-Agents","w"],
["Cemri, M. et al. (2025). Why Do Multi-Agent LLM Systems Fail?","Why Do Multi-Agent LLM Systems Fail"],
["Wu, Q. et al. (2023). AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation.","AutoGen Enabling Next-Gen LLM Applications via Multi-Agent Conversation"]]
});

D(22,{
h:"O GitHub Copilot (prévia em 2021, lançamento em 2022) foi o primeiro assistente de programação com IA usado em massa, baseado no modelo Codex da OpenAI (Chen et al., 2021). No mundo corporativo, a Salesforce lançou o Einstein em 2016, e a Microsoft transformou o Power Virtual Agents no Copilot Studio em 2023.",
he:"GitHub Copilot (preview in 2021, launch in 2022) was the first mass-adopted AI coding assistant, based on OpenAI's Codex model (Chen et al., 2021). In the enterprise world, Salesforce launched Einstein in 2016, and Microsoft turned Power Virtual Agents into Copilot Studio in 2023.",
a:"Entre o fim de 2024 e 2025, os agentes chegaram ao mercado em peso: o Gemini Deep Research (dezembro de 2024), o deep research da OpenAI (2025), o Claude Code (prévia em fevereiro e lançamento geral em maio de 2025) e o novo Codex da OpenAI como agente (2025). No corporativo, o Agentforce da Salesforce foi lançado em 2024, e o Copilot Studio passou a focar em agentes. No benchmark SWE-bench Verified, que mede a resolução de problemas reais de código, os melhores resultados saltaram de cerca de um terço em meados de 2024 para mais de 70% ao longo de 2025.",
ae:"Between late 2024 and 2025, agents hit the market in force: Gemini Deep Research (December 2024), OpenAI's deep research (2025), Claude Code (preview in February and general availability in May 2025) and OpenAI's new Codex as an agent (2025). In the enterprise, Salesforce's Agentforce launched in 2024, and Copilot Studio shifted its focus to agents. On the SWE-bench Verified benchmark, which measures resolving real code issues, top results jumped from about a third in mid-2024 to over 70% during 2025.",
r:"O AI PM avalia comprar ou construir testando fornecedores com tarefas reais da empresa, não com demonstrações. Define critérios de sucesso (tarefas concluídas, quanto as pessoas precisam editar o resultado), exige governança (permissões, registros de auditoria) e planeja a gestão da mudança para garantir adoção. Como você já usa Claude Code e Cursor, tem exemplos concretos para trazer às entrevistas.",
re:"The AI PM evaluates buy versus build by testing vendors on real company tasks, not demos. They define success criteria (tasks completed, how much people need to edit the output), require governance (permissions, audit logs) and plan change management to drive adoption. Since you already use Claude Code and Cursor, you have concrete examples to bring to interviews.",
refs:[["Chen, M. et al. (2021). Evaluating Large Language Models Trained on Code. OpenAI.","Evaluating Large Language Models Trained on Code"],
["Jimenez, C. et al. (2023). SWE-bench: Can Language Models Resolve Real-World GitHub Issues? ICLR 2024.","SWE-bench Can Language Models Resolve Real-World GitHub Issues"],
["Anthropic. Claude Code overview (documentação).","Anthropic Claude Code overview docs","w"],
["Salesforce (2024). Agentforce.","Salesforce Agentforce launch","w"]]
});
D(23,{
h:"Benchmarks impulsionaram o progresso do ML: MNIST (1998), ImageNet (2009), GLUE (2018), SuperGLUE (2019) e MMLU (Hendrycks et al., 2020). Na tradução automática, o BLEU (Papineni et al., 2002) mostrou que uma métrica automática podia acompanhar o julgamento humano. Em 2022, o HELM, de Stanford, propôs uma avaliação holística dos modelos de linguagem, olhando várias dimensões ao mesmo tempo.",
he:"Benchmarks drove ML progress: MNIST (1998), ImageNet (2009), GLUE (2018), SuperGLUE (2019) and MMLU (Hendrycks et al., 2020). In machine translation, BLEU (Papineni et al., 2002) showed that an automatic metric could track human judgment. In 2022, Stanford's HELM proposed a holistic evaluation of language models, looking at many dimensions at once.",
a:"Os benchmarks públicos agora saturam em poucos meses, então as avaliações migraram para o nível do produto. O uso de LLM como juiz (Zheng et al., 2023) mostrou concordância com humanos acima de 80% em comparações, mas com vieses conhecidos: preferência pela primeira posição, por respostas longas e pelo próprio estilo. Surgiram ferramentas como Promptfoo, Braintrust, LangSmith e o Inspect (do AI Security Institute britânico). Praticantes como Hamel Husain (\"Your AI Product Needs Evals\", 2024) defendem começar pela análise de erros em dados reais, e Shankar et al. (2024) estudaram como validar os próprios avaliadores.",
ae:"Public benchmarks now saturate within months, so evaluation moved to the product level. LLM-as-a-judge (Zheng et al., 2023) showed over 80% agreement with humans in comparisons, but with known biases: preference for the first position, for long answers and for its own style. Tools such as Promptfoo, Braintrust, LangSmith and Inspect (from the UK AI Security Institute) appeared. Practitioners such as Hamel Husain (\"Your AI Product Needs Evals\", 2024) advocate starting with error analysis on real data, and Shankar et al. (2024) studied how to validate the evaluators themselves.",
r:"O AI PM é coautor das avaliações: define o que é sucesso, monta o golden set com especialistas do domínio, conduz análise de erros toda semana e usa limites de qualidade como critério para liberar versões. Seu Design QA Agent já tem 24 casos com recall e precisão medidos contra uma linha de base de diff de pixels: esse é exatamente o raciocínio que entrevistadores querem ouvir.",
re:"The AI PM co-owns evaluations: defines what success means, builds the golden set with domain experts, runs error analysis weekly and uses quality thresholds as release gates. Your Design QA Agent already has 24 cases with recall and precision measured against a pixel-diff baseline: that is exactly the reasoning interviewers want to hear.",
refs:[["Zheng, L. et al. (2023). Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena. NeurIPS.","Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena"],
["Liang, P. et al. (2022). Holistic Evaluation of Language Models (HELM).","Holistic Evaluation of Language Models"],
["Husain, H. (2024). Your AI Product Needs Evals.","Hamel Husain Your AI Product Needs Evals","w"],
["Shankar, S. et al. (2024). Who Validates the Validators? Aligning LLM-Assisted Evaluation of LLM Outputs with Human Preferences.","Who Validates the Validators Aligning LLM-Assisted Evaluation"]]
});

D(24,{
h:"A engenharia de confiabilidade nasceu na indústria aeroespacial. Em software, o Google criou a disciplina de SRE em 2003, e o livro Site Reliability Engineering (2016) popularizou os SLOs e os orçamentos de erro. O padrão circuit breaker, que interrompe chamadas a um serviço em falha, foi difundido por Michael Nygard em Release It! (2007). Chaves de idempotência se tornaram prática comum em pagamentos, como na API da Stripe.",
he:"Reliability engineering was born in aerospace. In software, Google created SRE in 2003, and the book Site Reliability Engineering (2016) popularized SLOs and error budgets. The circuit breaker pattern, which stops calls to a failing service, was spread by Michael Nygard in Release It! (2007). Idempotency keys became common practice in payments, as in the Stripe API.",
a:"Sistemas com LLM têm desafios próprios: mesmo com temperatura zero, as respostas podem variar; fornecedores têm instabilidades e limites de requisição, o que levou ao uso de gateways com fallback entre provedores. A validação e o reparo de saídas estruturadas viraram rotina. Para agentes, o τ-bench propôs a métrica pass^k, que mede se o agente acerta de forma consistente em várias tentativas, e não só uma vez. Execuções longas passaram a usar plataformas de execução durável, que retomam de onde pararam após uma falha.",
ae:"LLM systems have their own challenges: even at temperature zero, answers can vary; vendors have outages and rate limits, which led to gateways with fallback across providers. Validating and repairing structured outputs became routine. For agents, τ-bench proposed the pass^k metric, which measures whether the agent succeeds consistently across several attempts, not just once. Long runs started using durable execution platforms that resume where they left off after a failure.",
r:"O AI PM negocia SLOs de latência, disponibilidade e correção junto com a engenharia, desenha a experiência de falha (\"não consegui resolver, vou te passar para um atendente com todo o contexto\"), define o que acontece quando o orçamento de erro acaba e usa esses números como critério para avançar no rollout.",
re:"The AI PM negotiates latency, availability and correctness SLOs with engineering, designs the failure experience (\"I couldn't solve this, I'm handing you to an agent with full context\"), defines what happens when the error budget runs out and uses these numbers as criteria for advancing the rollout.",
refs:[["Beyer, B. et al. (2016). Site Reliability Engineering: How Google Runs Production Systems. O'Reilly.","Site Reliability Engineering How Google Runs Production Systems"],
["Nygard, M. (2007). Release It! Design and Deploy Production-Ready Software.","Release It Design and Deploy Production-Ready Software Nygard"],
["Yao, S. et al. (2024). τ-bench (métrica pass^k).","tau-bench A Benchmark for Tool-Agent-User Interaction in Real-World Domains"],
["Stripe. Idempotent requests (documentação).","Stripe API idempotent requests","w"]]
});

D(25,{
h:"\"Observabilidade\" é um conceito da teoria de controle, formulado por Rudolf Kálmán em 1960: o quanto se consegue inferir do estado interno de um sistema a partir de suas saídas. Em software, o termo se popularizou por volta de 2016. O Dapper, do Google (Sigelman et al., 2010), introduziu o rastreamento distribuído em larga escala, e o OpenTelemetry (2019) virou o padrão aberto para traces, métricas e logs.",
he:"\"Observability\" is a control theory concept formulated by Rudolf Kálmán in 1960: how much you can infer about a system's internal state from its outputs. In software, the term became popular around 2016. Google's Dapper (Sigelman et al., 2010) introduced large-scale distributed tracing, and OpenTelemetry (2019) became the open standard for traces, metrics and logs.",
a:"Surgiram ferramentas específicas para LLMs, como Langfuse, LangSmith, Arize Phoenix e recursos de observabilidade de LLM em plataformas como o Datadog. O OpenTelemetry criou convenções semânticas para IA generativa, padronizando como registrar chamadas a modelos. Uma prática que ganhou força são as avaliações online, que pontuam automaticamente amostras de produção, somadas a sinais dos usuários como curtidas, edições e reformulações de perguntas.",
ae:"LLM-specific tools appeared, such as Langfuse, LangSmith, Arize Phoenix and LLM observability features on platforms like Datadog. OpenTelemetry created semantic conventions for generative AI, standardizing how model calls are recorded. A practice that gained ground is online evaluation, which automatically scores production samples, combined with user signals such as thumbs up, edits and rephrased questions.",
r:"O AI PM define o que registrar (respeitando a privacidade), quais painéis acompanhar e cria um ritual semanal de leitura de conversas reais, por exemplo cinquenta traces por semana. A partir disso, monta uma taxonomia de falhas que alimenta a priorização do backlog. Isso transforma discussões baseadas em opinião em decisões baseadas em evidência.",
re:"The AI PM defines what to log (respecting privacy), which dashboards to track and creates a weekly ritual of reading real conversations, for example fifty traces a week. From that, they build a failure taxonomy that feeds backlog prioritization. This turns opinion-based discussions into evidence-based decisions.",
refs:[["Sigelman, B. et al. (2010). Dapper, a Large-Scale Distributed Systems Tracing Infrastructure. Google.","Dapper a Large-Scale Distributed Systems Tracing Infrastructure"],
["Majors, C., Fong-Jones, L. e Miranda, G. (2022). Observability Engineering. O'Reilly.","Observability Engineering Majors Fong-Jones Miranda"],
["OpenTelemetry. Semantic conventions for generative AI.","OpenTelemetry semantic conventions generative AI","w"]]
});

D(26,{
h:"Frameworks de métricas têm longa história: o Balanced Scorecard (Kaplan e Norton, 1992), o AARRR de Dave McClure (2007), o HEART do Google (Rodden et al., 2010) e as OKRs, criadas na Intel e popularizadas por John Doerr. Um alerta clássico é a lei de Goodhart (1975): quando uma medida vira meta, ela deixa de ser uma boa medida.",
he:"Metrics frameworks have a long history: the Balanced Scorecard (Kaplan and Norton, 1992), Dave McClure's AARRR (2007), Google's HEART (Rodden et al., 2010) and OKRs, created at Intel and popularized by John Doerr. A classic warning is Goodhart's law (1975): when a measure becomes a target, it ceases to be a good measure.",
a:"Provar retorno de IA virou um desafio para muitas empresas. Um relatório do MIT NANDA (2025), muito citado e também contestado, afirmou que a maioria dos pilotos de IA generativa não gerava impacto mensurável no resultado financeiro. A Klarna é um caso ilustrativo: em 2024 anunciou que seu assistente fazia o trabalho de cerca de 700 atendentes e, em 2025, afirmou que voltaria a investir em atendimento humano para garantir qualidade. É um exemplo claro da importância de métricas de contrapeso.",
ae:"Proving AI ROI became a challenge for many companies. An MIT NANDA report (2025), widely cited and also disputed, claimed that most generative AI pilots produced no measurable impact on financial results. Klarna is an illustrative case: in 2024 it announced its assistant was doing the work of about 700 agents and, in 2025, said it would invest in human support again to ensure quality. It is a clear example of why counter metrics matter.",
r:"O AI PM monta o painel em três camadas, escolhe uma métrica norte (por exemplo, problemas resolvidos corretamente sem intervenção humana), define métricas de contrapeso (satisfação, taxa de recontato) e conecta tudo a dinheiro: custo evitado, receita protegida, tempo economizado. É essa ligação que convence liderança e sustenta o investimento.",
re:"The AI PM builds the three-layer dashboard, picks a north star metric (for example, issues resolved correctly without human intervention), defines counter metrics (satisfaction, re-contact rate) and connects everything to money: cost avoided, revenue protected, time saved. That link is what convinces leadership and sustains investment.",
refs:[["Rodden, K., Hutchinson, H. e Fu, X. (2010). Measuring the User Experience on a Large Scale: User-Centered Metrics for Web Applications. CHI.","Measuring the User Experience on a Large Scale User-Centered Metrics for Web Applications"],
["Goodhart, C. (1975). Problems of Monetary Management: The U.K. Experience.","Goodhart 1975 Problems of Monetary Management"],
["Klarna (2024). Klarna AI assistant handles two-thirds of customer service chats.","Klarna AI assistant handles two-thirds of customer service chats in its first month","w"],
["MIT NANDA (2025). The GenAI Divide: State of AI in Business 2025.","MIT NANDA The GenAI Divide State of AI in Business 2025","w"]]
});

D(27,{
h:"Os limites clássicos de tempo de resposta vêm de estudos de interação humano-computador (Miller, 1968; Card et al., 1991), resumidos por Jakob Nielsen (1993): 0,1 segundo parece instantâneo, 1 segundo mantém o fluxo de pensamento e 10 segundos é o limite da atenção. Cache é uma ideia antiga, presente em processadores e redes de distribuição de conteúdo (CDNs).",
he:"The classic response time limits come from human-computer interaction studies (Miller, 1968; Card et al., 1991), summarized by Jakob Nielsen (1993): 0.1 second feels instant, 1 second keeps the flow of thought and 10 seconds is the limit of attention. Caching is an old idea, present in processors and content delivery networks (CDNs).",
a:"Para LLMs, o repertório de otimização inclui: prompt caching (a Anthropic lançou em 2024, anunciando reduções de até 90% no custo e até 85% na latência para trechos repetidos), APIs de lote com desconto, decodificação especulativa (Leviathan et al., 2023), quantização (Dettmers et al., 2022), modelos menores destilados, streaming e controles de esforço de raciocínio, que trocam qualidade por custo. O cache semântico, que reaproveita respostas para perguntas parecidas, também ganhou espaço.",
ae:"For LLMs, the optimization toolkit includes: prompt caching (Anthropic launched it in 2024, announcing up to 90% lower cost and up to 85% lower latency for repeated prefixes), discounted batch APIs, speculative decoding (Leviathan et al., 2023), quantization (Dettmers et al., 2022), smaller distilled models, streaming and reasoning effort controls that trade quality for cost. Semantic caching, which reuses answers for similar questions, also gained ground.",
r:"O AI PM define orçamentos de latência por etapa, decide onde o streaming ajuda e onde processamento assíncrono ou em lote é aceitável (por exemplo, resumos gerados durante a noite) e acompanha o custo por ticket resolvido. A pergunta que guia a rotina é: qual é a métrica que o usuário sente, e quanto estamos pagando por ela?",
re:"The AI PM sets latency budgets per step, decides where streaming helps and where async or batch processing is acceptable (for example, summaries generated overnight) and tracks cost per resolved ticket. The question guiding the routine is: which metric does the user feel, and how much are we paying for it?",
refs:[["Nielsen, J. (1993). Response Times: The 3 Important Limits. Nielsen Norman Group.","Nielsen Response Times The 3 Important Limits","w"],
["Leviathan, Y., Kalman, M. e Matias, Y. (2023). Fast Inference from Transformers via Speculative Decoding. ICML.","Fast Inference from Transformers via Speculative Decoding"],
["Dettmers, T. et al. (2022). LLM.int8(): 8-bit Matrix Multiplication for Transformers at Scale. NeurIPS.","LLM.int8() 8-bit Matrix Multiplication for Transformers at Scale"],
["Anthropic (2024). Prompt caching with Claude.","Anthropic prompt caching with Claude","w"]]
});

D(28,{
h:"Exemplos adversariais, pequenas alterações que enganam redes neurais, foram descritos por Szegedy et al. (2013) e Goodfellow et al. (2014). Em 2016, o chatbot Tay, da Microsoft, foi manipulado por usuários e retirado do ar em menos de um dia. Casos de viés ganharam destaque com o estudo Gender Shades (Buolamwini e Gebru, 2018) e com a ferramenta de recrutamento da Amazon, abandonada em 2018. O termo \"prompt injection\" foi cunhado por Simon Willison em 2022, após demonstrações de Riley Goodside.",
he:"Adversarial examples, small changes that fool neural networks, were described by Szegedy et al. (2013) and Goodfellow et al. (2014). In 2016, Microsoft's Tay chatbot was manipulated by users and taken offline in less than a day. Bias cases gained attention with the Gender Shades study (Buolamwini and Gebru, 2018) and Amazon's recruiting tool, abandoned in 2018. The term \"prompt injection\" was coined by Simon Willison in 2022, after demonstrations by Riley Goodside.",
a:"A lista OWASP Top 10 para aplicações com LLM (edição 2025) coloca prompt injection em primeiro lugar. Greshake et al. (2023) mostraram a injeção indireta, escondida em páginas e documentos que o modelo lê. Simon Willison descreveu em 2025 a \"tríade letal\": dados privados, conteúdo não confiável e capacidade de comunicação externa no mesmo agente. Na regulação, o AI Act europeu entrou em vigor em 2024, com obrigações para modelos de propósito geral desde agosto de 2025; o NIST publicou o AI RMF (2023) e um perfil para IA generativa (2024); a ISO/IEC 42001 (2023) define sistemas de gestão de IA; e no Brasil o PL 2338/2023 foi aprovado no Senado em dezembro de 2024 e seguiu para a Câmara.",
ae:"The OWASP Top 10 for LLM Applications (2025 edition) ranks prompt injection first. Greshake et al. (2023) showed indirect injection, hidden in pages and documents the model reads. In 2025, Simon Willison described the \"lethal trifecta\": private data, untrusted content and external communication in the same agent. On regulation, the EU AI Act entered into force in 2024, with obligations for general-purpose models since August 2025; NIST published the AI RMF (2023) and a generative AI profile (2024); ISO/IEC 42001 (2023) defines AI management systems; and in Brazil, bill PL 2338/2023 passed the Senate in December 2024 and moved to the Chamber of Deputies.",
r:"O AI PM mantém o registro de riscos, define políticas do que o agente não pode fazer, organiza sessões de red teaming antes do lançamento, desenha o processo de resposta a incidentes e envolve privacidade e jurídico cedo, com atenção à LGPD. Também decide como informar ao usuário que ele está interagindo com IA.",
re:"The AI PM maintains the risk register, defines policies for what the agent must not do, organizes red teaming sessions before launch, designs the incident response process and involves privacy and legal early, with attention to LGPD. They also decide how to tell users they are interacting with AI.",
refs:[["OWASP (2025). Top 10 for LLM Applications 2025.","OWASP Top 10 for LLM Applications 2025","w"],
["Greshake, K. et al. (2023). Not what you've signed up for: Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection.","Not what you've signed up for Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection"],
["NIST (2024). AI 600-1: Artificial Intelligence Risk Management Framework: Generative AI Profile.","NIST AI 600-1 Generative AI Profile","w"],
["Buolamwini, J. e Gebru, T. (2018). Gender Shades. FAT*.","Gender Shades Intersectional Accuracy Disparities in Commercial Gender Classification"],

D(29,{
h:"A prática de discovery de produto se consolidou com Marty Cagan (Inspired, 2008, 2ª ed. 2017), que propôs os quatro grandes riscos: valor, usabilidade, viabilidade técnica e viabilidade de negócio. Vieram também o Lean Startup (Eric Ries, 2011), os Jobs to be Done (Clayton Christensen, Competing Against Luck, 2016) e o Continuous Discovery Habits (Teresa Torres, 2021).",
he:"Product discovery practice was consolidated by Marty Cagan (Inspired, 2008, 2nd ed. 2017), who proposed the four big risks: value, usability, feasibility and business viability. Then came Lean Startup (Eric Ries, 2011), Jobs to be Done (Clayton Christensen, Competing Against Luck, 2016) and Continuous Discovery Habits (Teresa Torres, 2021).",
a:"No discovery de IA, entram perguntas novas: a tarefa tolera erro? O resultado é fácil de verificar? O guia People + AI, do Google PAIR, dedica capítulos a necessidades do usuário e definição de sucesso. O Anthropic Economic Index (2025) mostrou que o uso real do Claude se concentra em desenvolvimento de software e escrita, com mistura de aumento (a IA ajuda a pessoa) e automação (a IA faz a tarefa). E a própria IA acelerou o discovery: PMs constroem protótipos funcionais em dias para testar valor com usuários.",
ae:"AI discovery brings new questions: does the task tolerate errors? Is the result easy to verify? Google PAIR's People + AI Guidebook devotes chapters to user needs and defining success. The Anthropic Economic Index (2025) showed that real Claude usage concentrates in software development and writing, with a mix of augmentation (AI helps the person) and automation (AI does the task). And AI itself sped up discovery: PMs build working prototypes in days to test value with users.",
r:"O AI PM faz entrevistas, acompanha atendentes trabalhando, quantifica o volume por tipo de pedido, constrói um protótipo rápido (como você fez com o Design QA Agent) e mapeia a tolerância a erro de cada caso. Seu histórico de pesquisa com usuários em campo é uma vantagem clara aqui; o desafio é somar a leitura de viabilidade técnica de IA.",
re:"The AI PM runs interviews, shadows support agents at work, quantifies volume by request type, builds a quick prototype (as you did with the Design QA Agent) and maps the error tolerance of each case. Your track record of field research with users is a clear advantage here; the challenge is adding AI technical feasibility judgment.",
refs:[["Torres, T. (2021). Continuous Discovery Habits.","Continuous Discovery Habits Teresa Torres"],
["Cagan, M. (2017). Inspired: How to Create Tech Products Customers Love, 2ª ed.","Inspired How to Create Tech Products Customers Love"],
["Google PAIR (2019, atualizado 2021). People + AI Guidebook.","Google PAIR People + AI Guidebook","w"],
["Anthropic (2025). The Anthropic Economic Index.","Anthropic Economic Index","w"]]
});

D(30,{
h:"A relação entre pessoas e automação é estudada há décadas. Sheridan e Verplank (1978) propuseram níveis de automação. Parasuraman e Riley (1997) descreveram uso, mau uso, desuso e abuso da automação. Eric Horvitz (1999) formulou os princípios das interfaces de iniciativa mista, em que pessoa e sistema dividem o controle. O Clippy, do Microsoft Office (1997), virou o exemplo clássico de assistente que interrompe na hora errada.",
he:"The relationship between people and automation has been studied for decades. Sheridan and Verplank (1978) proposed levels of automation. Parasuraman and Riley (1997) described use, misuse, disuse and abuse of automation. Eric Horvitz (1999) formulated the principles of mixed-initiative interfaces, where person and system share control. Microsoft Office's Clippy (1997) became the classic example of an assistant that interrupts at the wrong time.",
a:"As 18 diretrizes de interação humano-IA da Microsoft (Amershi et al., 2019) e o guia People + AI do Google viraram referência. Surgiram novos padrões de interface: painéis laterais com artefatos editáveis, sugestões inline (o \"texto fantasma\" dos assistentes de código), registros de atividade de agentes, pedidos de aprovação e citações clicáveis. Pesquisas como a de Bansal et al. (2021) mostraram que explicações nem sempre melhoram a decisão conjunta e podem aumentar a confiança excessiva.",
ae:"Microsoft's 18 Guidelines for Human-AI Interaction (Amershi et al., 2019) and Google's People + AI Guidebook became references. New interface patterns emerged: side panels with editable artifacts, inline suggestions (the \"ghost text\" of coding assistants), agent activity logs, approval prompts and clickable citations. Research such as Bansal et al. (2021) showed that explanations do not always improve joint decisions and can increase overreliance.",
r:"Aqui seu background em Product Design pesa muito. O AI PM desenha os padrões de confiança, os estados de falha, a transferência para humanos com contexto e um onboarding que ajusta expectativas. Na rotina, vale testar com usuários como eles verificam as respostas da IA, e não apenas se gostam da experiência.",
re:"Your Product Design background carries a lot of weight here. The AI PM designs trust patterns, failure states, handoff to humans with context and onboarding that sets expectations. Day to day, it is worth testing with users how they verify AI answers, not just whether they like the experience.",
refs:[["Amershi, S. et al. (2019). Guidelines for Human-AI Interaction. CHI.","Guidelines for Human-AI Interaction Amershi"],
["Horvitz, E. (1999). Principles of Mixed-Initiative User Interfaces. CHI.","Principles of Mixed-Initiative User Interfaces"],
["Parasuraman, R. e Riley, V. (1997). Humans and Automation: Use, Misuse, Disuse, Abuse. Human Factors.","Humans and Automation Use Misuse Disuse Abuse"],
["Bansal, G. et al. (2021). Does the Whole Exceed its Parts? The Effect of AI Explanations on Complementary Team Performance. CHI.","Does the Whole Exceed its Parts The Effect of AI Explanations on Complementary Team Performance"]]
});

D(31,{
h:"Experimentos controlados online viraram cultura em empresas como Microsoft (Bing), Google e Amazon, e foram sistematizados por Ron Kohavi, Diane Tang e Ya Xu em Trustworthy Online Controlled Experiments (2020). O Lean Startup (2011) popularizou o MVP e o ciclo construir, medir e aprender. Lançamentos graduais com feature flags e dark launches, em que a funcionalidade roda escondida, se tornaram prática comum na década de 2010.",
he:"Online controlled experiments became culture at companies such as Microsoft (Bing), Google and Amazon, and were systematized by Ron Kohavi, Diane Tang and Ya Xu in Trustworthy Online Controlled Experiments (2020). Lean Startup (2011) popularized the MVP and the build, measure, learn loop. Gradual launches with feature flags and dark launches, where the feature runs hidden, became common practice in the 2010s.",
a:"Em IA, a combinação padrão é avaliação offline (evals) seguida de testes online. O modo sombra permite comparar a IA com o processo atual sem afetar clientes. Efeitos de novidade exigem medir por mais tempo. Uma previsão do Gartner (2024) estimou que cerca de 30% dos projetos de IA generativa seriam abandonados depois da prova de conceito até o fim de 2025, por dados ruins, custos crescentes ou valor pouco claro. Com a comoditização dos modelos, a decisão entre construir e comprar passou a ser revista com frequência.",
ae:"In AI, the standard combination is offline evaluation (evals) followed by online tests. Shadow mode lets you compare AI with the current process without affecting customers. Novelty effects require measuring over a longer period. A Gartner prediction (2024) estimated that about 30% of generative AI projects would be abandoned after proof of concept by the end of 2025, due to poor data, rising costs or unclear value. With models becoming commodities, the build versus buy decision is revisited often.",
r:"O AI PM define os critérios de avançar, ajustar ou encerrar antes do piloto começar, compara com a linha de base, usa feature flags para lançar aos poucos e comunica o resultado num memorando de decisão. O roadmap passa a ser guiado por evidência, e não pela empolgação com a tecnologia.",
re:"The AI PM defines go, iterate or kill criteria before the pilot starts, compares against the baseline, uses feature flags to launch gradually and communicates results in a decision memo. The roadmap becomes evidence-driven rather than driven by excitement about the technology.",
refs:[["Kohavi, R., Tang, D. e Xu, Y. (2020). Trustworthy Online Controlled Experiments. Cambridge University Press.","Trustworthy Online Controlled Experiments"],
["Ries, E. (2011). The Lean Startup. Crown Business.","The Lean Startup Eric Ries"],
["Gartner (2024). Gartner Predicts 30% of Generative AI Projects Will Be Abandoned After Proof of Concept By End of 2025.","Gartner 30% generative AI projects abandoned after proof of concept 2025","w"]]
});

D(32,{
h:"Documentos de decisão têm tradição forte em empresas de tecnologia: o memorando de seis páginas e o PR/FAQ da Amazon (método working backwards, descrito por Bryar e Carr em 2021), os design docs do Google, os RFCs e os Architecture Decision Records, propostos por Michael Nygard em 2011.",
he:"Decision documents have a strong tradition at tech companies: Amazon's six-page memo and PR/FAQ (the working backwards method, described by Bryar and Carr in 2021), Google's design docs, RFCs and Architecture Decision Records, proposed by Michael Nygard in 2011.",
a:"Entrevistas de AI PM passaram a incluir casos de produto com IA: desenhar uma funcionalidade, justificar trade-offs, definir evals e métricas. Portfólios com protótipos funcionando se destacam. As system cards e model cards publicadas pelos fornecedores de modelos são bons exemplos de como documentar capacidades, limites, avaliações e riscos de forma transparente.",
ae:"AI PM interviews now include AI product cases: designing a feature, justifying trade-offs, defining evals and metrics. Portfolios with working prototypes stand out. The system cards and model cards published by model vendors are good examples of how to document capabilities, limits, evaluations and risks transparently.",
r:"Uma boa estrutura para o projeto final combina PR/FAQ, registro de decisões, relatório de avaliação, registro de riscos e plano de lançamento. Seu Design QA Agent se encaixa perfeitamente: o problema (divergências entre o Figma e a implementação), a linha de base de diff de pixels com recall de 100% e precisão de 66%, e as próximas avaliações com o Claude formam uma narrativa completa para defender em entrevista.",
re:"A good structure for the final project combines a PR/FAQ, a decision record, an evaluation report, a risk register and a launch plan. Your Design QA Agent fits perfectly: the problem (mismatches between Figma and the implementation), the pixel-diff baseline with 100% recall and 66% precision, and the upcoming evaluations with Claude form a complete narrative to defend in interviews.",
refs:[["Bryar, C. e Carr, B. (2021). Working Backwards: Insights, Stories, and Secrets from Inside Amazon.","Working Backwards Insights Stories and Secrets from Inside Amazon"],
["Nygard, M. (2011). Documenting Architecture Decisions.","Michael Nygard Documenting Architecture Decisions 2011","w"],
["Huyen, C. (2025). AI Engineering. O'Reilly.","AI Engineering Building Applications with Foundation Models Chip Huyen","w"],
["Anthropic. System cards dos modelos Claude.","Anthropic Claude system card","w"]]

X(1,{
s:"Pense numa cozinha. O algoritmo é a receita. A automação é a máquina de pão, que segue sempre a mesma receita sem pensar. O modelo é um cozinheiro que aprendeu provando milhares de pratos e consegue lidar com ingredientes que nunca viu. E o produto é o restaurante inteiro: cardápio, atendimento, cozinha e entrega. O cliente paga pela experiência do restaurante, não pelo cozinheiro isolado.",
se:"Think of a kitchen. The algorithm is the recipe. Automation is the bread machine, which always follows the same recipe without thinking. The model is a cook who learned by tasting thousands of dishes and can handle ingredients they have never seen. And the product is the whole restaurant: menu, service, kitchen and delivery. Customers pay for the restaurant experience, not for the cook alone.",
ct:"Netflix",
c:"O sistema de recomendação da Netflix é um exemplo clássico da diferença entre modelo e produto. Os algoritmos existem, mas o valor aparece na experiência: capas personalizadas, fileiras organizadas por gosto e a ordem dos títulos na tela. Em um artigo de 2015, executivos da empresa estimaram que a personalização gerava cerca de 1 bilhão de dólares por ano, principalmente por reduzir cancelamentos.",
ce:"Netflix's recommendation system is a classic example of the difference between model and product. The algorithms exist, but the value shows up in the experience: personalized artwork, rows organized by taste and the order of titles on screen. In a 2015 paper, company executives estimated that personalization generated about 1 billion dollars a year, mainly by reducing cancellations."
});

X(2,{
s:"Imagine duas formas de ensinar alguém a dirigir. Na primeira, você entrega o código de trânsito completo e todas as regras escritas: essa é a escola simbólica. Na segunda, a pessoa pratica milhares de horas com um instrutor até pegar o jeito, sem decorar regras: essa é a escola conexionista, das redes neurais. Motoristas de verdade usam as duas coisas, e os sistemas de IA modernos também.",
se:"Imagine two ways of teaching someone to drive. In the first, you hand over the complete traffic code and every written rule: that is the symbolic school. In the second, the person practices for thousands of hours with an instructor until they get the hang of it, without memorizing rules: that is the connectionist school, of neural networks. Real drivers use both, and so do modern AI systems.",
ct:"Deep Blue e AlphaGo",
cte:"Deep Blue and AlphaGo",
c:"Em 1997, o Deep Blue, da IBM, venceu o campeão mundial de xadrez Garry Kasparov usando busca e regras escritas por especialistas, bem na tradição simbólica. Em 2016, o AlphaGo, da DeepMind, venceu Lee Sedol no Go, um jogo com possibilidades demais para busca bruta, usando redes neurais e aprendizado por reforço. As duas vitórias mostram as duas escolas em ação, e o AlphaGo ainda combinava rede neural com busca.",
ce:"In 1997, IBM's Deep Blue beat world chess champion Garry Kasparov using search and rules written by experts, squarely in the symbolic tradition. In 2016, DeepMind's AlphaGo beat Lee Sedol at Go, a game with too many possibilities for brute-force search, using neural networks and reinforcement learning. The two victories show both schools in action, and AlphaGo still combined a neural network with search."
});

X(3,{
s:"Um sistema especialista é como um manual de procedimentos gigante, escrito depois de entrevistar o funcionário mais experiente da empresa: \"se acontecer X, faça Y\". Funciona muito bem enquanto o mundo cabe no manual. O problema aparece no primeiro caso que ninguém previu, e também quando o especialista se aposenta e ninguém sabe atualizar as regras.",
se:"An expert system is like a giant procedures manual, written after interviewing the company's most experienced employee: \"if X happens, do Y\". It works very well as long as the world fits in the manual. The problem shows up with the first case nobody anticipated, and when the expert retires and no one knows how to update the rules.",
ct:"Stripe Radar",
c:"O Stripe Radar, sistema antifraude da Stripe, mostra que regras e modelos convivem bem. Um modelo de machine learning avalia o risco de cada pagamento com base em sinais de milhões de empresas, e cada negócio ainda pode escrever as próprias regras, como bloquear pagamentos acima de certo valor vindos de determinados países. O modelo cobre o que é difícil de prever, e as regras garantem controle e explicabilidade.",
ce:"Stripe Radar, Stripe's anti-fraud system, shows that rules and models get along well. A machine learning model scores each payment's risk using signals from millions of businesses, and each business can still write its own rules, such as blocking payments above a certain amount from specific countries. The model covers what is hard to predict, and the rules guarantee control and explainability."
});

X(4,{
s:"O ELIZA funcionava como um espelho: devolvia suas próprias frases de um jeito que parecia empatia. Um LLM moderno é mais parecido com um ator excelente: fala com convicção, entonação e argumentos, sobre quase qualquer assunto. O cuidado é o mesmo nos dois casos: convicção não é garantia de verdade, e o usuário tende a confiar mais do que deveria em quem fala bem.",
se:"ELIZA worked like a mirror: it reflected your own sentences back in a way that felt like empathy. A modern LLM is more like an excellent actor: it speaks with conviction, tone and arguments on almost any subject. The caution is the same in both cases: conviction is no guarantee of truth, and users tend to trust smooth talkers more than they should.",
ct:"Air Canada",
c:"Em 2024, um tribunal canadense condenou a Air Canada porque o chatbot do site informou errado a política de tarifas para luto, e um cliente comprou passagens confiando nisso. A empresa argumentou que o chatbot era responsável pelas próprias respostas, mas o tribunal decidiu que a companhia responde por tudo o que aparece no seu site. Lição de produto: o que o assistente diz é promessa da empresa.",
ce:"In 2024, a Canadian tribunal ruled against Air Canada because the website chatbot gave wrong information about its bereavement fare policy, and a customer bought tickets relying on it. The airline argued the chatbot was responsible for its own answers, but the tribunal decided the company is liable for everything on its website. Product lesson: what the assistant says is a company promise."
});

X(5,{
s:"Pense em três perguntas diferentes sobre um carro. \"Quão rápido ele vai?\" fala de capacidade. \"Que motor ele usa, a gasolina ou elétrico?\" fala de abordagem. \"Para que ele serve, táxi ou ambulância?\" fala de aplicação. Misturar essas perguntas gera confusão, e o mesmo acontece quando alguém pergunta \"que tipo de IA é essa?\" sem dizer de qual eixo está falando.",
se:"Think of three different questions about a car. \"How fast does it go?\" is about capability. \"What engine does it use, gas or electric?\" is about approach. \"What is it for, taxi or ambulance?\" is about application. Mixing these questions creates confusion, and the same happens when someone asks \"what type of AI is this?\" without saying which axis they mean.",
ct:"Spotify",
c:"O Spotify ilustra bem os eixos. O Discover Weekly (2015) é IA estreita, baseada em machine learning e aplicada a recomendação. O AI DJ (2023) combina esse mesmo motor de recomendação com IA generativa, que cria os comentários falados, e com uma voz sintética. Um único produto, várias abordagens e aplicações trabalhando juntas.",
ce:"Spotify illustrates the axes well. Discover Weekly (2015) is narrow AI, based on machine learning and applied to recommendation. AI DJ (2023) combines that same recommendation engine with generative AI, which writes the spoken commentary, and a synthetic voice. One product, several approaches and applications working together."
});

X(6,{
s:"Os quatro tipos de aprendizado lembram jeitos de estudar. Supervisionado é estudar com gabarito: você vê a questão e a resposta certa. Não supervisionado é organizar uma gaveta bagunçada sem etiquetas, agrupando o que parece igual. Autossupervisionado é tampar palavras de um livro e tentar adivinhá-las, milhões de vezes. Por reforço é como adestrar um cachorro: acertou, ganha petisco.",
se:"The four types of learning resemble ways of studying. Supervised is studying with an answer key: you see the question and the right answer. Unsupervised is organizing a messy drawer with no labels, grouping what looks alike. Self-supervised is covering words in a book and trying to guess them, millions of times. Reinforcement is like training a dog: get it right, get a treat.",
ct:"Nubank",
c:"O Nubank usa machine learning desde o início para decisões de crédito e prevenção de fraude, em grande parte com modelos clássicos sobre dados estruturados. Em 2024, o banco comprou a startup americana Hyperplane para desenvolver modelos de fundação treinados com dados bancários, apostando que a tecnologia dos LLMs também pode melhorar a leitura do comportamento financeiro dos clientes.",
ce:"Nubank has used machine learning from the start for credit decisions and fraud prevention, largely with classic models on structured data. In 2024, the bank acquired US startup Hyperplane to develop foundation models trained on banking data, betting that LLM technology can also improve how it reads customers' financial behavior."
});

X(7,{
s:"Treino, validação e teste funcionam como a preparação para um vestibular. Você estuda com a lista de exercícios (treino), faz simulados para ajustar a estratégia (validação) e, no fim, faz a prova oficial, que nunca viu antes (teste). Sobreajuste é decorar as respostas da lista. Vazamento de dados é ver a prova oficial antes: a nota fica ótima, mas não mede nada.",
se:"Training, validation and test work like preparing for a college entrance exam. You study with the exercise list (training), take practice exams to adjust your strategy (validation) and, in the end, take the official exam you have never seen (test). Overfitting is memorizing the exercise answers. Data leakage is seeing the official exam beforehand: the score looks great but measures nothing.",
ct:"Zillow Offers",
c:"Em 2021, a Zillow encerrou o Zillow Offers, operação que comprava e revendia casas usando um algoritmo para prever preços. O modelo não acompanhou a mudança rápida do mercado durante a pandemia, e a empresa comprou imóveis caros demais. O prejuízo passou de 500 milhões de dólares e cerca de um quarto dos funcionários foi demitido. É um caso clássico de mudança no perfil dos dados sem monitoramento suficiente.",
ce:"In 2021, Zillow shut down Zillow Offers, a business that bought and resold homes using an algorithm to predict prices. The model did not keep up with the fast-changing market during the pandemic, and the company overpaid for homes. Losses exceeded 500 million dollars and about a quarter of employees were laid off. It is a classic case of data drift without enough monitoring."
});

X(8,{
s:"A IA tradicional se parece com um crítico de arte: olha um quadro e diz se é impressionista ou barroco. A IA generativa é o pintor: cria um quadro novo. E um LLM é como o autocompletar do seu celular, só que treinado com uma parte enorme do texto público da internet e de livros, a ponto de completar não só palavras, mas redações, códigos e planos inteiros.",
se:"Traditional AI resembles an art critic: it looks at a painting and says whether it is impressionist or baroque. Generative AI is the painter: it creates a new painting. And an LLM is like your phone's autocomplete, except trained on a huge share of public text from the internet and books, to the point of completing not just words but whole essays, code and plans.",
ct:"Duolingo Max",
c:"Em 2023, o Duolingo lançou o Duolingo Max com dois recursos baseados no GPT-4: \"Explique minha resposta\", que explica por que um exercício estava certo ou errado, e \"Roleplay\", uma conversa simulada em situações do dia a dia. Nenhum dos dois é um chatbot genérico: a IA generativa aparece dentro da jornada de aprendizado que o usuário já conhecia.",
ce:"In 2023, Duolingo launched Duolingo Max with two GPT-4-powered features: \"Explain My Answer\", which explains why an exercise was right or wrong, and \"Roleplay\", a simulated conversation in everyday situations. Neither is a generic chatbot: generative AI shows up inside the learning journey users already knew."
});

X(9,{
s:"Imagine o texto dividido em pecinhas de Lego, os tokens. O modelo monta a resposta uma peça por vez, sempre escolhendo entre as peças mais prováveis para encaixar em seguida. A temperatura é o quanto ele se arrisca a escolher peças menos óbvias. E a janela de contexto é a mesa de trabalho: o modelo só enxerga o que está em cima da mesa naquele momento.",
se:"Imagine text split into little Lego pieces, the tokens. The model builds the answer one piece at a time, always choosing among the most likely pieces to fit next. Temperature is how much it risks picking less obvious pieces. And the context window is the workbench: the model only sees what is on the bench at that moment.",
ct:"O caso do \"strawberry\"",
cte:"The \"strawberry\" case",
c:"Por muito tempo, vários modelos erravam a pergunta \"quantas letras r existem na palavra strawberry?\". O motivo não é falta de inteligência, e sim a tokenização: o modelo não vê letras soltas, vê pedaços de palavra. Esse exemplo virou um jeito popular de explicar tokens, e mostra por que tarefas de contar caracteres ou soletrar podem falhar mesmo em modelos poderosos.",
ce:"For a long time, several models got the question \"how many letter r's are in the word strawberry?\" wrong. The reason is not a lack of intelligence but tokenization: the model does not see individual letters, it sees chunks of words. The example became a popular way to explain tokens, and shows why tasks like counting characters or spelling can fail even in powerful models."
});

X(10,{
s:"Um embedding funciona como um endereço num mapa de significados. \"Cachorro\" e \"cão\" moram na mesma rua; \"filhote\" mora na rua ao lado; \"boleto\" mora em outro bairro. A busca lexical é o Ctrl+F: procura exatamente as letras que você digitou. A busca semântica é um bibliotecário que entende o que você quis dizer, mesmo que você use outras palavras.",

X(31,{
s:"Lançar uma funcionalidade de IA é como lançar um prato novo num restaurante. Primeiro, uma degustação com poucos clientes (piloto). Depois, comparar com o prato antigo (linha de base). Se for bem, entra no cardápio aos poucos (lançamento gradual). E, se não vender, é preciso coragem para tirar do cardápio (critério de encerramento).",
se:"Launching an AI feature is like launching a new dish at a restaurant. First, a tasting with a few customers (pilot). Then, comparing with the old dish (baseline). If it goes well, it joins the menu gradually (gradual rollout). And if it does not sell, you need the courage to take it off the menu (kill criteria).",
ct:"Google AI Overviews",
c:"Em maio de 2024, o Google ampliou os AI Overviews, resumos gerados por IA no topo da busca, para todos os usuários nos Estados Unidos. Em poucos dias circularam respostas absurdas, como sugerir cola para o queijo grudar na pizza, baseadas em piadas de fóruns. O Google reduziu a exibição em alguns tipos de consulta e reforçou filtros. O caso mostra o risco de escalar rápido antes de testar casos de borda.",
ce:"In May 2024, Google expanded AI Overviews, AI-generated summaries at the top of search, to all users in the US. Within days, absurd answers circulated, such as suggesting glue to make cheese stick to pizza, based on forum jokes. Google reduced their display for some query types and strengthened filters. The case shows the risk of scaling fast before testing edge cases."

Q(1,[
["Um diretor pede \"um produto com IA\" para reduzir cancelamentos. Qual é o primeiro passo mais adequado do PM?",
 ["Escolher o modelo mais avançado disponível no mercado","Definir qual decisão ou comportamento do usuário precisa mudar e como essa mudança será medida","Contratar um time de ciência de dados antes de qualquer discovery","Lançar um chatbot de retenção como MVP para aprender rápido"],1,
 "Problema antes da solução. Sem saber o que precisa mudar e como medir, qualquer tecnologia vira aposta. O chatbot como MVP já é uma solução escolhida antes de entender o problema.",
 "A director asks for \"an AI product\" to reduce cancellations. What is the PM's most appropriate first step?",
 ["Pick the most advanced model on the market","Define which user decision or behavior needs to change and how that change will be measured","Hire a data science team before any discovery","Launch a retention chatbot as an MVP to learn fast"],
 "Problem before solution. Without knowing what must change and how to measure it, any technology is a gamble. The chatbot MVP is already a solution chosen before understanding the problem."],
["Um sistema envia lembretes de pagamento sempre 3 dias antes do vencimento, seguindo regras fixas. Como classificá-lo?",
 ["IA, porque toma decisões sem intervenção humana","Modelo de machine learning, porque usa dados do cliente","Automação baseada em regras, sem IA","Agente, porque executa ações sozinho"],2,
 "Executar sem intervenção humana é automação, não IA. Não há aprendizado nem inferência: é uma regra fixa. Saber fazer essa distinção evita inflar o discurso de IA em apresentações.",
 "A system always sends payment reminders 3 days before the due date, following fixed rules. How should it be classified?",
 ["AI, because it makes decisions without human intervention","A machine learning model, because it uses customer data","Rule-based automation, with no AI","An agent, because it takes actions on its own"],
 "Running without human intervention is automation, not AI. There is no learning or inference: it is a fixed rule. Making this distinction avoids inflating AI claims in presentations."],
["Seu time tem um modelo com 95% de acerto nos testes, mas a adoção da funcionalidade é baixa. O que isso mais provavelmente indica?",
 ["O modelo precisa de mais dados de treino","A meta de acerto deveria ser 99%","É preciso trocar por um modelo maior","O valor depende do produto completo (fluxo, experiência, confiança), e não só do modelo"],3,
 "Acerto alto com adoção baixa sugere problema de produto: a funcionalidade pode estar no lugar errado do fluxo, não gerar confiança ou não resolver uma dor relevante. Melhorar o modelo não resolve isso.",
 "Your team has a model with 95% accuracy in tests, but feature adoption is low. What does this most likely indicate?",
 ["The model needs more training data","The accuracy target should be 99%","You need to switch to a larger model","Value depends on the whole product (flow, experience, trust), not just the model"],
 "High accuracy with low adoption points to a product problem: the feature may sit in the wrong place in the flow, fail to build trust or not solve a relevant pain. Improving the model does not fix that."]

Q(2,[
["Um stakeholder afirma que \"em seis meses a IA vai automatizar todo o atendimento\". À luz da história da IA, qual é a melhor resposta do PM?",
 ["Concordar, porque os modelos atuais já superaram os limites do passado","Propor um piloto com metas verificáveis e marcos intermediários, calibrando expectativas com evidências","Recusar o projeto, porque promessas desse tipo sempre causam invernos da IA","Pedir que a engenharia defina o prazo sozinha"],1,
 "Os invernos da IA vieram de promessas maiores que a entrega. A resposta madura não é nem o entusiasmo cego nem o veto: é transformar a ambição em marcos testáveis.",
 "A stakeholder claims that \"in six months AI will automate all customer support\". In light of AI history, what is the PM's best response?",
 ["Agree, because today's models have already overcome past limits","Propose a pilot with verifiable goals and intermediate milestones, calibrating expectations with evidence","Reject the project, since promises like this always cause AI winters","Ask engineering to set the timeline alone"],
 "AI winters came from promises bigger than delivery. The mature answer is neither blind enthusiasm nor a veto: it turns ambition into testable milestones."],
["O que a vitória do AlphaGo (2016), comparada à do Deep Blue (1997), mostra?",
 ["Que a IA simbólica foi totalmente abandonada","Que redes neurais só funcionam em jogos","Que aprender com dados, combinado com busca, resolveu um problema grande demais para regras e busca bruta","Que o Go é um jogo mais simples que o xadrez"],2,
 "O Go tem possibilidades demais para busca exaustiva. O AlphaGo combinou redes neurais treinadas com dados e aprendizado por reforço com busca. Não foi abandono da tradição simbólica, e sim combinação.",
 "What does AlphaGo's victory (2016), compared with Deep Blue's (1997), show?",
 ["That symbolic AI was completely abandoned","That neural networks only work in games","That learning from data, combined with search, solved a problem too large for rules and brute-force search","That Go is a simpler game than chess"],
 "Go has too many possibilities for exhaustive search. AlphaGo combined neural networks trained on data and reinforcement learning with search. It was not abandoning the symbolic tradition, but combining approaches."],
["Qual descrição representa melhor muitos produtos de IA atuais?",
 ["Modelos estatísticos combinados com regras, ferramentas e verificações explícitas","Apenas regras simbólicas escritas por especialistas","Apenas redes neurais, sem nenhuma regra","Sistemas especialistas dos anos 1980 com uma nova interface"],0,
 "Produtos reais misturam o modelo (que lida com linguagem e ambiguidade) com regras, validações e ferramentas (que garantem controle). É a reconciliação das duas tradições.",
 "Which description best represents many current AI products?",
 ["Statistical models combined with rules, tools and explicit checks","Only symbolic rules written by experts","Only neural networks, with no rules at all","1980s expert systems with a new interface"],
 "Real products mix the model (which handles language and ambiguity) with rules, validations and tools (which ensure control). It is the reconciliation of the two traditions."]
]);

Q(3,[
["No assistente de atendimento, qual decisão deve ficar com regras explícitas, e não com o LLM?",
 ["Resumir a reclamação do cliente","Classificar o tom da mensagem","Decidir se o cliente é elegível a reembolso segundo a política da empresa","Sugerir uma resposta empática"],2,
 "Elegibilidade é política: precisa ser previsível, igual para todos e auditável. As outras tarefas lidam com linguagem ambígua, onde o modelo agrega valor e um erro tem custo menor.",
 "In the support assistant, which decision should stay with explicit rules rather than the LLM?",
 ["Summarizing the customer's complaint","Classifying the message's tone","Deciding whether the customer is eligible for a refund under company policy","Suggesting an empathetic reply"],
 "Eligibility is policy: it must be predictable, equal for everyone and auditable. The other tasks deal with ambiguous language, where the model adds value and an error costs less."],
["Por que muitos sistemas especialistas perderam espaço?",
 ["Eram lentos demais para os computadores da época","Manter e ampliar regras escritas por especialistas era caro, e o sistema quebrava em casos não previstos","Não podiam ser explicados a ninguém","Dependiam de GPUs que ainda não existiam"],1,
 "Esse é o gargalo de aquisição de conhecimento. Sistemas especialistas eram, inclusive, bastante explicáveis. O problema era escalar e manter as regras diante de um mundo que muda.",
 "Why did many expert systems lose ground?",
 ["They were too slow for the computers of the time","Maintaining and expanding rules written by experts was expensive, and the system broke on unforeseen cases","They could not be explained to anyone","They depended on GPUs that did not exist yet"],
 "That is the knowledge acquisition bottleneck. Expert systems were actually quite explainable. The problem was scaling and maintaining rules in a changing world."],
["Um cliente regulado exige que toda decisão de crédito seja explicável ao auditor. Qual arquitetura o PM deveria propor?",
 ["Um LLM decide e gera uma justificativa em texto","Um agente autônomo com acesso direto ao sistema de crédito","Fine-tuning de um LLM com as decisões passadas","O modelo extrai e organiza os dados do pedido, e regras determinísticas e auditáveis tomam a decisão final"],3,
 "Uma justificativa gerada pelo LLM pode soar convincente sem refletir o raciocínio real. Separar extração (modelo) de decisão (regras) mantém o ganho da IA com rastreabilidade.",
 "A regulated client requires every credit decision to be explainable to the auditor. Which architecture should the PM propose?",
 ["An LLM decides and writes a text justification","An autonomous agent with direct access to the credit system","Fine-tuning an LLM on past decisions","The model extracts and organizes application data, and deterministic, auditable rules make the final decision"],
 "An LLM-generated justification can sound convincing without reflecting the real reasoning. Separating extraction (model) from decision (rules) keeps AI's benefit with traceability."]
]);

Q(4,[
["Usuários elogiam o \"jeito humano\" do seu assistente, mas aceitam respostas erradas sem verificar. Qual métrica revela melhor esse risco?",
 ["Satisfação média (CSAT)","Taxa de aceitação de respostas incorretas em testes com usuários","Tempo médio de conversa","Número de mensagens por sessão"],1,
 "CSAT pode subir justamente porque o assistente é simpático. Medir quantas respostas erradas são aceitas revela a confiança excessiva, que é o efeito ELIZA na prática.",
 "Users praise your assistant's \"human touch\" but accept wrong answers without checking. Which metric best reveals this risk?",
 ["Average satisfaction (CSAT)","Rate of incorrect answers accepted in user tests","Average conversation time","Number of messages per session"],
 "CSAT may rise precisely because the assistant is friendly. Measuring how many wrong answers get accepted reveals overreliance, the ELIZA effect in practice."],
["Qual mudança de design reduz melhor o efeito ELIZA num assistente de suporte?",
 ["Mostrar as fontes e deixar claro quando a resposta pode estar incompleta","Dar ao assistente um nome e uma personalidade mais marcantes","Fazer o assistente responder mais rápido","Usar mais emojis e expressões afetivas"],0,
 "Fontes e sinais de incerteza ajudam o usuário a calibrar a confiança. As outras opções aumentam a sensação de humanidade sem aumentar a confiabilidade.",
 "Which design change best reduces the ELIZA effect in a support assistant?",
 ["Show sources and make clear when the answer may be incomplete","Give the assistant a stronger name and personality","Make the assistant answer faster","Use more emojis and affectionate expressions"],
 "Sources and uncertainty signals help users calibrate trust. The other options increase the feeling of humanity without increasing reliability."],
["O que o caso da Air Canada (2024) ensina ao PM?",
 ["Empresas não respondem pelo que o chatbot diz","O cliente deve sempre confirmar a informação com um humano","O que o assistente afirma é tratado como informação oficial da empresa","Chatbots devem ser proibidos de falar sobre preços"],2,
 "O tribunal decidiu que a empresa responde por tudo o que aparece no seu site, inclusive o chatbot. Por isso respostas sobre políticas precisam de fontes confiáveis e limites claros.",
 "What does the Air Canada case (2024) teach the PM?",
 ["Companies are not liable for what the chatbot says","Customers should always confirm information with a human","What the assistant states is treated as official company information","Chatbots should be banned from discussing prices"],

]);

Q(5,[
["Um fornecedor afirma que sua solução é \"nível AGI\". Qual é a melhor reação do PM?",
 ["Aceitar, porque AGI tem uma definição técnica clara","Pedir o desempenho medido na sua tarefa, com seus próprios dados de teste","Descartar o fornecedor imediatamente","Pedir o número de parâmetros do modelo"],1,
 "Não existe definição consensual de AGI. O que importa é o desempenho na sua tarefa. Número de parâmetros também não diz como o modelo vai se sair no seu caso.",
 "A vendor claims its solution is \"AGI level\". What is the PM's best reaction?",
 ["Accept it, since AGI has a clear technical definition","Ask for measured performance on your task, with your own test data","Drop the vendor immediately","Ask for the model's parameter count"],
 "There is no consensus definition of AGI. What matters is performance on your task. Parameter count also does not tell you how the model will perform in your case."],
["No AI Act europeu, o que mais pesa para classificar uma funcionalidade como de alto risco?",
 ["O tamanho do modelo utilizado","Se usa rede neural ou regras","A aplicação, como recrutamento ou concessão de crédito","O idioma da interface"],2,
 "O AI Act classifica sistemas pelo uso. Tamanho do modelo importa para obrigações de modelos de propósito geral, mas o alto risco de uma funcionalidade vem da aplicação.",
 "Under the EU AI Act, what weighs most in classifying a feature as high risk?",
 ["The size of the model used","Whether it uses neural networks or rules","The application, such as hiring or credit decisions","The interface language"],
 "The AI Act classifies systems by use. Model size matters for general-purpose model obligations, but a feature's high-risk status comes from its application."],
["Um recurso usa um LLM para gerar descrições de produtos num e-commerce. Como classificá-lo nos três eixos?",
 ["Capacidade: AGI; abordagem: simbólica; aplicação: varejo","Capacidade: superinteligência; abordagem: híbrida; aplicação: marketing","Capacidade: IA estreita; abordagem: simbólica; aplicação: busca","Capacidade: IA estreita; abordagem: aprendizado de máquina (generativo); aplicação: geração de conteúdo para e-commerce"],3,
 "Todo sistema atual é IA estreita. Um LLM é aprendizado de máquina, no caso generativo. E a aplicação é a geração de conteúdo. Separar os eixos deixa a conversa com engenharia e jurídico mais precisa.",
 "A feature uses an LLM to generate product descriptions in an e-commerce store. How is it classified on the three axes?",
 ["Capability: AGI; approach: symbolic; application: retail","Capability: superintelligence; approach: hybrid; application: marketing","Capability: narrow AI; approach: symbolic; application: search","Capability: narrow AI; approach: machine learning (generative); application: content generation for e-commerce"],
 "Every current system is narrow AI. An LLM is machine learning, generative in this case. And the application is content generation. Separating the axes makes conversations with engineering and legal more precise."]
]);

Q(6,[
["Você quer prever cancelamentos usando histórico de uso em tabelas. Qual abordagem tende a ser mais eficiente para começar?",
 ["Um LLM de fronteira lendo as tabelas","Modelos clássicos de machine learning, como gradient boosting","Aprendizado por reforço","Um agente autônomo com acesso ao banco de dados"],1,
 "Em dados tabulares, métodos clássicos costumam vencer o deep learning, são mais baratos e mais explicáveis. LLMs brilham em texto livre, não em previsão numérica sobre tabelas.",
 "You want to predict cancellations from usage history in tables. Which approach tends to be most efficient to start?",
 ["A frontier LLM reading the tables","Classic machine learning models, such as gradient boosting","Reinforcement learning","An autonomous agent with database access"],
 "On tabular data, classic methods usually beat deep learning and are cheaper and more explainable. LLMs shine on free text, not numeric prediction over tables."],
["O time quer classificar tickets em 12 categorias, mas não há rótulos. Qual é a pergunta de produto mais importante?",
 ["Quanto custa e quanto tempo leva rotular exemplos suficientes, ou se um LLM consegue classificar sem exemplos com qualidade aceitável","Qual GPU a engenharia deve usar","Se o modelo terá mais de 1 bilhão de parâmetros","Se é possível usar aprendizado por reforço"],0,
 "Dados rotulados são o insumo do aprendizado supervisionado. O PM avalia o custo de criar rótulos contra a alternativa de usar um LLM, medindo a qualidade num pequeno conjunto validado.",
 "The team wants to classify tickets into 12 categories, but there are no labels. What is the most important product question?",
 ["How much it costs and how long it takes to label enough examples, or whether an LLM can classify with no examples at acceptable quality","Which GPU engineering should use","Whether the model will have more than 1 billion parameters","Whether reinforcement learning can be used"],
 "Labeled data is the input for supervised learning. The PM weighs the cost of creating labels against using an LLM, measuring quality on a small validated set."],
["O que diferencia os modelos de raciocínio (como o1 e DeepSeek-R1) na visão do PM?",
 ["São sempre mais baratos que modelos comuns","Não precisam de pré-treino","Gastam mais tokens \"pensando\", trocando custo e latência por qualidade em tarefas complexas","Só funcionam com dados tabulares"],2,
 "Modelos de raciocínio geram tokens de pensamento antes da resposta. Isso melhora tarefas complexas, mas aumenta custo e tempo, então nem toda tarefa justifica usá-los.",
 "What sets reasoning models (such as o1 and DeepSeek-R1) apart from the PM's perspective?",
 ["They are always cheaper than regular models","They do not need pre-training","They spend more tokens \"thinking\", trading cost and latency for quality on complex tasks","They only work with tabular data"],
 "Reasoning models generate thinking tokens before answering. This improves complex tasks but increases cost and time, so not every task justifies them."]
]);

Q(7,[
["Um modelo teve 97% de acerto no teste, mas cai para 70% em produção. Qual hipótese investigar primeiro?",
 ["O modelo é pequeno demais","Vazamento de dados ou um conjunto de teste que não representa o uso real","Falta de GPUs em produção","A temperatura está alta demais"],1,
 "Uma queda brusca entre teste e produção é o sinal clássico de vazamento ou de teste pouco representativo. Antes de mexer no modelo, é preciso entender como o teste foi montado.",
 "A model scored 97% in testing but drops to 70% in production. Which hypothesis should you investigate first?",
 ["The model is too small","Data leakage or a test set that does not represent real usage","Lack of GPUs in production","The temperature is too high"],
 "A sharp drop between test and production is the classic sign of leakage or an unrepresentative test. Before touching the model, understand how the test was built."],
["O time quer aprovar reembolsos automaticamente quando o score do modelo for maior que 0,9. O que o PM deve exigir?",
 ["Que o score seja arredondado para uma casa decimal","Um modelo com mais parâmetros","Que o limite seja reduzido para 0,5","Uma checagem de calibração e a definição do custo de cada tipo de erro"],3,
 "Um score de 0,9 só significa 90% de chance se o modelo estiver calibrado. E o limite certo depende do custo de aprovar indevidamente versus negar indevidamente.",
 "The team wants to auto-approve refunds when the model score is above 0.9. What should the PM require?",
 ["That the score be rounded to one decimal place","A model with more parameters","That the threshold be lowered to 0.5","A calibration check and a definition of the cost of each type of error"],
 "A 0.9 score only means a 90% chance if the model is calibrated. And the right threshold depends on the cost of wrongly approving versus wrongly denying."],
["O que o caso do Zillow Offers ilustra?",
 ["O alto custo das GPUs","Um ataque de prompt injection","Mudança no perfil dos dados sem monitoramento suficiente","Um problema de latência na interface"],2,
 "O mercado mudou rapidamente e o modelo de preços não acompanhou. Monitorar a mudança nos dados depois do lançamento é responsabilidade compartilhada entre PM e engenharia.",
 "What does the Zillow Offers case illustrate?",
 ["The high cost of GPUs","A prompt injection attack","Data drift without enough monitoring","An interface latency problem"],
 "The market changed quickly and the pricing model did not keep up. Monitoring data drift after launch is a responsibility shared by PM and engineering."]
]);

Q(8,[

 ["Large Logic Machine; a large number of rules","Large Language Model; billions of parameters and a huge volume of training data","Linked Language Module; connection to databases","Large Learning Memory; long-term memory"],
 "LLM means Large Language Model. The size comes from parameters and training data, not rules or memory."],
["Qual uso de IA generativa tende a gerar mais valor com menos risco num produto já existente?",
 ["Funcionalidades embutidas no fluxo, com saída que o usuário verifica, como um rascunho que ele aprova","Um chatbot genérico na página inicial","Conteúdo gerado e publicado automaticamente, sem revisão","Substituir toda a interface por uma conversa"],0,
