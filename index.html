 "Verifiable outputs inside a flow users already know reduce risk and increase adoption. Duolingo Max is an example: AI appears inside the learning journey."],
["Qual afirmação sobre modelo e aplicação está correta?",
 ["Trocar o modelo sempre muda toda a experiência do usuário","Modelos de fundação dispensam a camada de aplicação","A aplicação inclui regras, dados, interface e operação; o modelo é um dos componentes","Aplicação e modelo são sinônimos"],2,

]);

Q(9,[

["Para extrair campos de notas fiscais em JSON, qual configuração faz mais sentido?",

 ["High temperature, for more creativity","Unlimited output tokens","Low temperature and structured output","Streaming off to reduce cost"],
 "Extraction calls for predictability and a guaranteed format. Low temperature reduces variation, and structured output makes validation and integration easier. Streaming does not change cost."],
["Um cliente reclama que a resposta \"demora\". O que melhora a percepção de velocidade sem trocar de modelo?",

Q(10,[

 "Embeddings capturam significado, mas códigos e nomes raros exigem correspondência exata. A busca híbrida une o melhor dos dois mundos.",
 "Users search the help center for error codes like \"E-4021\". Which search works best?",
 ["Vector search only","Lexical or hybrid search, because codes require exact matching","No search, the LLM answers from memory","Image search"],
 "Embeddings capture meaning, but codes and rare names require exact matching. Hybrid search combines the best of both worlds."],

 "Which metric is most useful for evaluating retrieval in a semantic search prototype?",
 ["How often the correct passage appears in the top results (recall@k), using real questions","The embedding model's parameter count","The vector database size in GB","The model's training time"],

["O time quer trocar o modelo de embedding por um melhor. Que custo o PM precisa prever?",

Q(11,[
["Um modelo \"aberto\" tem pesos disponíveis, mas a licença limita o uso comercial acima de certo porte de empresa. Como classificá-lo?",

 ["Open source under the OSI definition","Open-weight, with license restrictions","A closed model","Public domain"],
 "Available weights are not enough to be open source. Usage restrictions make it open-weight. Researchers call it open-washing when it is marketed as open."],
["Um cliente enterprise exige que o modelo rode na infraestrutura dele e seja ajustado com dados internos. Qual opção fica viável?",

 "Modelos de pesos abertos permitem rodar em infraestrutura própria e fazer ajuste fino, desde que a licença permita. Em troca, o cliente assume operação e segurança.",
 "An enterprise client requires the model to run on its infrastructure and be fine-tuned with internal data. Which option becomes viable?",
 ["Only a proprietary API","None, that is impossible with generative AI","A rule-based chatbot","An open-weight model with a compatible license"],
 "Open-weight models can run on your own infrastructure and be fine-tuned, as long as the license allows it. In return, the client takes on operations and security."],
["Onde o PM encontra as limitações conhecidas e os usos não recomendados de um modelo?",
 ["No preço por token","Na model card","No número de downloads","No nome do modelo"],1,
 "A model card documenta uso pretendido, avaliações, limitações e riscos. Esses pontos costumam virar requisitos e riscos do seu produto.",
 "Where does the PM find a model's known limitations and non-recommended uses?",
 ["In the price per token","In the model card","In the number of downloads","In the model's name"],
 "The model card documents intended use, evaluations, limitations and risks. These often become requirements and risks for your product."]
]);
Q(12,[
["Um cliente da área de saúde no Brasil exige que os dados fiquem no país. Qual requisito o PM deve levantar primeiro?",

Q(13,[
["Uma tarefa usa 3 mil tokens de entrada e 500 de saída e acontece 100 mil vezes por mês. O que falta para estimar o custo com precisão?",
 ["Nada, isso já basta","Os preços de entrada e de saída, a taxa de novas tentativas e as chamadas extras de ferramentas","O número de funcionários do time","O tamanho da janela de contexto do modelo"],1,
 "Entrada e saída têm preços diferentes, e o custo real inclui retries, chamadas de ferramentas e etapas extras. Ignorar isso costuma subestimar bastante a conta.",
 "A task uses 3 thousand input tokens and 500 output tokens and runs 100 thousand times a month. What is missing to estimate cost accurately?",
 ["Nothing, that is enough","Input and output prices, the retry rate and extra tool calls","The team's headcount","The model's context window size"],
 "Input and output are priced differently, and real cost includes retries, tool calls and extra steps. Ignoring them usually underestimates the bill considerably."],
["Com uma GPU reservada usada em média 5% do tempo, o que acontece com o custo por requisição?",
 ["Fica mais barato que usar uma API","Não muda","Cai para zero","Fica alto, porque a capacidade ociosa continua sendo paga"],3,
 "A GPU reservada é paga por hora, sendo usada ou não. Com baixa utilização, cada requisição carrega o custo de todo o tempo parado.",
 "With a reserved GPU used only 5% of the time on average, what happens to cost per request?",
 ["It becomes cheaper than an API","It does not change","It drops to zero","It becomes high, because idle capacity is still paid for"],
 "A reserved GPU is paid by the hour, used or not. With low utilization, each request carries the cost of all the idle time."],
["Num modelo de raciocínio, por que a conta pode surpreender?",
 ["Os tokens de pensamento são cobrados como saída","Não há cobrança pelos tokens de entrada","O preço é fixo por mês","Respostas curtas custam mais que as longas"],0,
 "O modelo pode gerar muitos tokens de pensamento antes da resposta visível, e eles entram na conta como saída, que é a parte mais cara.",
 "With a reasoning model, why can the bill be surprising?",
 ["Thinking tokens are billed as output","Input tokens are not charged","The price is fixed per month","Short answers cost more than long ones"],

]);

Q(14,[

 "Public leaderboards are hints but may not reflect your task. A mature decision combines quality on your task with cost and latency."],

 "What is the main risk of a model router?",

Q(15,[
["O assistente às vezes promete prazos de entrega que a empresa não garante. Qual correção no prompt de sistema é mais eficaz?",
 ["Escrever \"seja cuidadoso com prazos\"","Explicitar a política (o que pode e o que não pode prometer), com exemplos de resposta correta, e testar em casos de borda","Aumentar a temperatura","Pedir respostas mais curtas"],1,
 "Instruções vagas geram comportamento vago. Regras explícitas, exemplos e testes em casos difíceis transformam o prompt numa especificação verificável.",
 "The assistant sometimes promises delivery dates the company does not guarantee. Which system prompt fix is most effective?",
 ["Write \"be careful with deadlines\"","State the policy explicitly (what it may and may not promise), with examples of correct answers, and test on edge cases","Raise the temperature","Ask for shorter answers"],
 "Vague instructions produce vague behavior. Explicit rules, examples and tests on hard cases turn the prompt into a verifiable spec."],
["Como saber se uma nova versão do prompt é melhor que a anterior?",

 "Impressões de poucos testes enganam. Comparar versões no mesmo conjunto de casos mostra o que melhorou e o que piorou.",
 "How can you tell whether a new prompt version is better than the previous one?",
 ["Test three questions manually","Ask the model which version it prefers","Compare the prompts' length","Run both versions on the same set of cases and compare the results"],
 "Impressions from a few tests are misleading. Comparing versions on the same set of cases shows what improved and what got worse."],
["Para integrar a resposta do modelo a outro sistema, o que pedir no prompt?",
 ["Texto livre, para mais naturalidade","Saída estruturada (por exemplo, JSON) com campos definidos","Resposta sempre em inglês","Emojis para indicar o status"],1,
 "Saída estruturada facilita validar e integrar. Hoje muitos fornecedores oferecem esse recurso de forma nativa, garantindo o formato.",
 "To integrate the model's answer with another system, what should the prompt ask for?",
 ["Free text, for naturalness","Structured output (for example, JSON) with defined fields","Always answer in English","Emojis to signal status"],

Q(16,[
["Conversas longas deixam o assistente mais caro e menos preciso. Qual técnica atacar primeiro?",
 ["Aumentar a janela de contexto","Resumir ou compactar o histórico, mantendo decisões e fatos importantes","Trocar a temperatura","Remover o prompt de sistema"],1,

Q(28,[

 deep:[["Onde as regras ainda vencem","Where rules still win",
  "Regras explícitas são a melhor escolha quando o custo de um erro é alto, quando a decisão precisa ser explicada a um auditor e quando os casos são poucos e bem definidos. Cálculo de impostos, elegibilidade a benefícios, limites de crédito e conformidade regulatória são exemplos. Nesses casos, previsibilidade vale mais do que flexibilidade, e um modelo estatístico, por melhor que seja, adiciona incerteza onde ela não é aceitável.",
  "Explicit rules are the best choice when the cost of an error is high, when the decision must be explained to an auditor and when cases are few and well defined. Tax calculation, benefit eligibility, credit limits and regulatory compliance are examples. In these cases, predictability is worth more than flexibility, and a statistical model, however good, adds uncertainty where it is not acceptable."],
 ["O padrão híbrido na prática","The hybrid pattern in practice",
  "No atendimento, o cliente escreve: \"comprei há 20 dias, a tela veio riscada e quero meu dinheiro de volta\". Um LLM extrai os fatos: dias desde a compra = 20, motivo = defeito, pedido = reembolso. Depois, regras determinísticas aplicam a política: defeito dentro de 30 dias dá direito a reembolso. O LLM lida com a linguagem bagunçada, e a regra garante uma decisão consistente e auditável. Esse desenho é cada vez mais comum em produtos de IA em setores regulados.",
  "In customer support, the customer writes: \"I bought it 20 days ago, the screen arrived scratched and I want my money back\". An LLM extracts the facts: days since purchase = 20, reason = defect, request = refund. Then deterministic rules apply the policy: a defect within 30 days qualifies for a refund. The LLM handles the messy language, and the rule ensures a consistent, auditable decision. This design is increasingly common in AI products in regulated industries."]]});

M(4,{dg:{type:"compare",t:["Fluência não é confiabilidade","Fluency is not reliability"],
  cols:[["ELIZA (1966)","ELIZA (1966)"],["LLM atual","Today's LLM"]],
  rows:[["Como responde","How it answers",["Reformula a frase do usuário com padrões","Gera texto novo, token a token"],["Rephrases the user's sentence with patterns","Generates new text, token by token"]],
        ["Fluência","Fluency",["Baixa, mas convincente","Muito alta"],["Low, but convincing","Very high"]],
        ["Conhecimento","Knowledge",["Nenhum","Amplo, mas pode estar errado ou desatualizado"],["None","Broad, but may be wrong or outdated"]],
        ["Risco principal","Main risk",["Usuário atribuir compreensão","Usuário confiar em erro dito com segurança"],["Users attributing understanding","Users trusting errors stated confidently"]]]},
 deep:[["Por que confiamos em quem fala bem","Why we trust smooth talkers",
  "Pessoas usam fluência como atalho para competência: quem fala com segurança parece saber. Com humanos, o atalho funciona razoavelmente, porque fluência e conhecimento costumam andar juntos. Com LLMs, eles se separam: o modelo escreve com a mesma confiança quando acerta e quando inventa. Pesquisas sobre confiança excessiva mostram que usuários aceitam respostas erradas com mais frequência quando a explicação é longa e bem escrita.",
  "People use fluency as a shortcut for competence: whoever speaks confidently seems to know. With humans, the shortcut works reasonably well, because fluency and knowledge tend to go together. With LLMs they come apart: the model writes with the same confidence whether it is right or making things up. Research on overreliance shows that users accept wrong answers more often when the explanation is long and well written."],
 ["Padrões de produto para calibrar a confiança","Product patterns to calibrate trust",
  "Os padrões mais eficazes são: mostrar a fonte de cada afirmação importante, para que o usuário confira; dizer \"não encontrei\" em vez de improvisar; destacar o que precisa de verificação, como valores e prazos; e evitar personalidade exagerada em contextos sérios. Nas avaliações, inclua casos em que a resposta parece certa mas está errada, e meça quantos usuários percebem. Essa métrica diz mais sobre segurança do que a satisfação média.",
  "The most effective patterns are: show the source of each important claim so users can check it; say \"I could not find it\" instead of improvising; highlight what needs verification, such as amounts and deadlines; and avoid exaggerated personality in serious contexts. In evaluations, include cases where the answer looks right but is wrong, and measure how many users notice. That metric says more about safety than average satisfaction."]]});

M(5,{dg:{type:"compare",t:["Três eixos para classificar um sistema","Three axes to classify a system"],
  cols:[["Capacidade","Capability"],["Abordagem","Approach"],["Aplicação","Application"]],
  rows:[["Pergunta","Question",["Quão geral é?","Como aprende ou decide?","Para que serve?"],["How general is it?","How does it learn or decide?","What is it for?"]],
        ["Exemplos","Examples",["IA estreita, AGI, superinteligência","Simbólica, ML, híbrida","Visão, linguagem, recomendação"],["Narrow AI, AGI, superintelligence","Symbolic, ML, hybrid","Vision, language, recommendation"]],
        ["Quem se importa","Who cares",["Estratégia e expectativas","Engenharia e custo","Jurídico e regulação"],["Strategy and expectations","Engineering and cost","Legal and regulation"]]]},
 deep:[["Por que a AGI é difícil de definir","Why AGI is hard to define",
  "Não há acordo sobre o que conta como inteligência geral. Algumas definições olham para tarefas (fazer a maioria dos trabalhos intelectuais humanos), outras para aprendizado (aprender qualquer tarefa nova com poucos exemplos) e outras para impacto econômico. A proposta do Google DeepMind de níveis combina desempenho e amplitude, mas ainda depende de quais tarefas entram na conta. Para o PM, isso significa tratar \"AGI\" como discurso de mercado, e não como especificação.",
  "There is no agreement on what counts as general intelligence. Some definitions look at tasks (doing most human intellectual work), others at learning (learning any new task from few examples) and others at economic impact. Google DeepMind's levels proposal combines performance and breadth, but still depends on which tasks are counted. For the PM, this means treating \"AGI\" as market talk, not as a specification."],
 ["Como os eixos ajudam em decisões reais","How the axes help with real decisions",
  "O eixo da aplicação define riscos e obrigações: um mesmo modelo usado para sugerir músicas e para triar currículos tem exigências completamente diferentes. O eixo da abordagem define custo e manutenção: regras exigem especialistas; ML exige dados e monitoramento. O eixo da capacidade define expectativas: um sistema estreito vai falhar fora do seu domínio, e a comunicação com usuários precisa deixar esse limite claro.",
  "The application axis defines risks and obligations: the same model used to suggest songs and to screen resumes has completely different requirements. The approach axis defines cost and maintenance: rules need experts; ML needs data and monitoring. The capability axis defines expectations: a narrow system will fail outside its domain, and communication with users must make that limit clear."]]});

M(6,{dg:{type:"nest",t:["Onde cada termo se encaixa","Where each term fits"],
  rings:[["Inteligência artificial","Artificial intelligence","Qualquer técnica que faz máquinas executarem tarefas inteligentes","Any technique that makes machines perform intelligent tasks"],
         ["Machine learning","Machine learning","Aprende padrões a partir de dados","Learns patterns from data"],
         ["Redes neurais","Neural networks","Camadas de unidades conectadas","Layers of connected units"],
         ["Deep learning","Deep learning","Redes com muitas camadas","Networks with many layers"],
         ["LLMs","LLMs","Deep learning treinado em texto, em escala gigante","Deep learning trained on text at huge scale"]]},
 deep:[["Como um modelo aprende, sem matemática","How a model learns, without math",
  "Imagine um modelo de preço de imóveis. Ele começa chutando valores aleatórios. Para cada casa do treino, compara o chute com o preço real e calcula o erro. Depois ajusta seus parâmetros um pouco na direção que reduziria esse erro, processo chamado de descida do gradiente. Repetido milhões de vezes, o modelo encontra parâmetros que erram pouco. Um LLM faz o mesmo, só que o \"preço\" é a próxima palavra e os parâmetros são bilhões.",
  "Imagine a house price model. It starts by guessing random values. For each house in the training data, it compares the guess with the real price and computes the error. Then it nudges its parameters slightly in the direction that would reduce that error, a process called gradient descent. Repeated millions of times, the model finds parameters that make small errors. An LLM does the same, except the \"price\" is the next word and the parameters number in the billions."],
 ["Pré-treino e pós-treino","Pre-training and post-training",
  "O pré-treino ensina o modelo a prever texto e, com isso, ele absorve gramática, fatos e padrões de raciocínio. Mas um modelo só pré-treinado completa textos; não segue instruções nem recusa pedidos perigosos. O pós-treino ajusta esse comportamento com exemplos de boas respostas, preferências humanas (RLHF) ou princípios (Constitutional AI). É no pós-treino que se define boa parte da \"personalidade\" que o usuário percebe, e por isso duas versões do mesmo modelo base podem se comportar de forma bem diferente.",
  "Pre-training teaches the model to predict text, and in doing so it absorbs grammar, facts and reasoning patterns. But a model that is only pre-trained just completes text; it does not follow instructions or refuse dangerous requests. Post-training adjusts this behavior with examples of good answers, human preferences (RLHF) or principles (Constitutional AI). Post-training defines much of the \"personality\" users perceive, which is why two versions of the same base model can behave quite differently."]]});

M(7,{dg:{type:"flow",t:["Ciclo de vida de um modelo","A model's life cycle"],
  steps:[["Dados","Data","coleta e limpeza","collection and cleaning"],["Divisão","Split","treino, validação, teste","train, validation, test"],["Treino","Training","ajuste dos parâmetros","fitting parameters"],["Avaliação","Evaluation","no teste nunca visto","on the unseen test"],["Produção","Production","inferência e monitoramento","inference and monitoring"]],
  note:["Em produção, mudanças nos dados (drift) fazem o ciclo recomeçar.","In production, data changes (drift) restart the cycle."]},
 deep:[["Lendo uma matriz de confusão","Reading a confusion matrix",
  "Num classificador de fraude, há quatro resultados possíveis: fraude detectada (verdadeiro positivo), fraude que passou (falso negativo), compra legítima bloqueada (falso positivo) e compra legítima aprovada (verdadeiro negativo). Precisão responde \"dos bloqueios, quantos eram fraude?\". Recall responde \"das fraudes, quantas pegamos?\". Aumentar uma costuma reduzir a outra, e a escolha do ponto de equilíbrio é uma decisão de produto, porque depende do custo de cada erro.",
  "In a fraud classifier there are four possible outcomes: fraud caught (true positive), fraud missed (false negative), legitimate purchase blocked (false positive) and legitimate purchase approved (true negative). Precision answers \"of the blocks, how many were fraud?\". Recall answers \"of the frauds, how many did we catch?\". Raising one usually lowers the other, and choosing the balance point is a product decision, because it depends on the cost of each error."],
 ["Drift: quando o mundo muda","Drift: when the world changes",
  "Um modelo aprende o mundo como ele era nos dados de treino. Quando o comportamento muda, por uma pandemia, uma campanha nova ou uma mudança de preço, o modelo continua aplicando padrões antigos. Isso é drift. Os sinais são queda gradual nas métricas, mudança na distribuição das entradas e aumento de casos que o modelo marca com baixa confiança. A defesa é monitorar esses sinais e ter um processo de retreino, com dono e frequência definidos.",
  "A model learns the world as it was in the training data. When behavior changes, due to a pandemic, a new campaign or a price change, the model keeps applying old patterns. That is drift. The signs are gradual drops in metrics, shifts in input distributions and more cases the model flags with low confidence. The defense is to monitor these signals and have a retraining process with a defined owner and cadence."]]});

M(8,{dg:{type:"compare",t:["IA tradicional e IA generativa","Traditional and generative AI"],
  cols:[["IA tradicional (discriminativa)","Traditional AI (discriminative)"],["IA generativa","Generative AI"]],
  rows:[["Saída","Output",["Rótulo, número ou ranking","Texto, imagem, áudio, código"],["A label, number or ranking","Text, images, audio, code"]],
        ["Exemplo","Example",["Este e-mail é spam?","Escreva a resposta para este e-mail"],["Is this email spam?","Write the reply to this email"]],
        ["Como avaliar","How to evaluate",["Acurácia, precisão, recall","Rubricas, juízes, avaliação humana"],["Accuracy, precision, recall","Rubrics, judges, human review"]],
        ["Risco típico","Typical risk",["Classificar errado","Inventar com aparência de verdade"],["Misclassifying","Making things up convincingly"]]]},
 deep:[["O que \"modelo de fundação\" muda para produto","What \"foundation model\" changes for product",
  "Antes, cada tarefa de IA exigia um modelo próprio, treinado com dados rotulados específicos. Com modelos de fundação, um único modelo atende dezenas de tarefas apenas mudando as instruções. Isso derruba o custo de experimentar: um PM consegue testar uma ideia em horas, sem time de ciência de dados. A contrapartida é que o diferencial competitivo sai do modelo, que todos podem contratar, e vai para dados próprios, integração ao fluxo e qualidade da experiência.",
  "Previously, each AI task required its own model trained on specific labeled data. With foundation models, a single model handles dozens of tasks just by changing the instructions. That slashes the cost of experimenting: a PM can test an idea in hours, without a data science team. The trade-off is that competitive advantage moves away from the model, which anyone can buy, toward proprietary data, workflow integration and experience quality."],
 ["Avaliar o que não tem gabarito único","Evaluating what has no single answer key",
  "Uma pergunta de classificação tem resposta certa; um resumo bom pode ser escrito de muitas formas. Por isso, a avaliação de IA generativa usa rubricas: critérios como fidelidade à fonte, completude, tom e formato, cada um com uma escala. A rubrica é aplicada por pessoas ou por um modelo juiz calibrado. Escrever boas rubricas é trabalho de produto, porque elas traduzem o que \"bom\" significa para o usuário.",
  "A classification question has a right answer; a good summary can be written in many ways. That is why evaluating generative AI uses rubrics: criteria such as faithfulness to the source, completeness, tone and format, each with a scale. The rubric is applied by people or by a calibrated judge model. Writing good rubrics is product work, because they translate what \"good\" means to the user."]]});
M(9,{dg:{type:"cycle",t:["Como um LLM gera a resposta","How an LLM generates the answer"],
  steps:[["Texto vira tokens","Text becomes tokens","\"devolver o pedido\" vira: dev / olver / o / pedido","\"return the order\" becomes: return / the / order"],["Calcula probabilidades","Computes probabilities","para todos os tokens possíveis","for every possible token"],["Escolhe um token","Picks a token","a temperatura controla a ousadia","temperature controls boldness"],["Acrescenta ao contexto","Appends to context","e repete o ciclo","and repeats the loop"]],
  note:["O ciclo para ao gerar um token de fim ou atingir o limite de saída.","The loop stops at an end token or the output limit."]},
 deep:[["Fazendo a conta de custo","Doing the cost math",
  "Suponha um assistente que recebe 1.500 tokens de entrada (instruções, histórico e pergunta) e gera 400 de saída, com preços de US$ 3 e US$ 15 por milhão. Cada resposta custa 1.500 × 3 / 1.000.000 + 400 × 15 / 1.000.000, ou seja, US$ 0,0105. Com 50 mil conversas de 4 respostas por mês, são cerca de US$ 2.100. Repare que a saída, mesmo menor, pesa mais na conta. Respostas mais enxutas e histórico compactado são as alavancas mais diretas.",
  "Suppose an assistant receives 1,500 input tokens (instructions, history and question) and generates 400 output tokens, at prices of US$ 3 and US$ 15 per million. Each answer costs 1,500 × 3 / 1,000,000 + 400 × 15 / 1,000,000, or US$ 0.0105. With 50 thousand conversations of 4 answers a month, that is about US$ 2,100. Notice that output, though smaller, weighs more. Leaner answers and compacted history are the most direct levers."],
 ["Por que o modelo \"alucina\"","Why the model \"hallucinates\"",
  "O modelo foi treinado para produzir a continuação mais provável, e não para verificar fatos. Quando a informação não está no contexto nem foi bem aprendida, ele ainda gera algo plausível, porque é isso que sabe fazer. Alucinações são mais comuns em detalhes específicos: números, datas, nomes, citações e políticas internas. As defesas são dar a informação no contexto (RAG), pedir que cite a fonte e permitir que diga \"não sei\".",
  "The model was trained to produce the most likely continuation, not to check facts. When the information is not in the context and was not learned well, it still generates something plausible, because that is what it does. Hallucinations are most common in specific details: numbers, dates, names, quotes and internal policies. The defenses are providing the information in context (RAG), asking it to cite the source and allowing it to say \"I don't know\"."]]});

M(10,{dg:{type:"compare",t:["Três jeitos de buscar","Three ways to search"],
  cols:[["Lexical (BM25)","Lexical (BM25)"],["Vetorial","Vector"],["Híbrida","Hybrid"]],
  rows:[["Como funciona","How it works",["Compara palavras exatas","Compara significado (embeddings)","Combina as duas listas"],["Matches exact words","Matches meaning (embeddings)","Combines both lists"]],
        ["Brilha em","Shines at",["Códigos, nomes, termos raros","Sinônimos e paráfrases","Bases reais e variadas"],["Codes, names, rare terms","Synonyms and paraphrases","Real, varied corpora"]],
        ["Falha em","Fails at",["\"Quero devolver\" vs \"troca\"","Números e códigos exatos","Custo e complexidade maiores"],["\"Return\" vs \"exchange\"","Exact numbers and codes","Higher cost and complexity"]]]},
 deep:[["Como uma frase vira coordenadas","How a sentence becomes coordinates",
  "Um modelo de embedding lê o texto e devolve uma lista de centenas ou milhares de números. Cada número não tem significado isolado; o que importa é a posição do vetor em relação aos outros. Frases como \"esqueci minha senha\" e \"não consigo entrar na conta\" ficam próximas, mesmo sem palavras em comum. A busca calcula a distância entre o vetor da pergunta e os vetores dos documentos e devolve os mais próximos.",
  "An embedding model reads text and returns a list of hundreds or thousands of numbers. No single number has meaning on its own; what matters is the vector's position relative to others. Sentences like \"I forgot my password\" and \"I can't log into my account\" end up close, even with no words in common. Search computes the distance between the question's vector and the documents' vectors and returns the closest ones."],
 ["Como avaliar a busca antes de culpar o modelo","How to evaluate search before blaming the model",
  "Monte uma lista de 50 a 100 perguntas reais e, para cada uma, marque qual documento deveria ser encontrado. Depois meça o recall@5: em quantas perguntas o documento certo aparece entre os cinco primeiros resultados. Se esse número for baixo, nenhum LLM vai compensar, porque a informação nem chega até ele. Esse teste simples costuma revelar problemas de divisão dos documentos, metadados ausentes ou falta de busca lexical.",
  "Build a list of 50 to 100 real questions and, for each, mark which document should be found. Then measure recall@5: in how many questions the right document appears among the top five results. If that number is low, no LLM will compensate, because the information never reaches it. This simple test often reveals chunking problems, missing metadata or the lack of lexical search."]]});

M(11,{dg:{type:"compare",t:["O que cada tipo de modelo entrega","What each kind of model provides"],
  cols:[["Fechado","Closed"],["Open-weight","Open-weight"],["Open source (OSI)","Open source (OSI)"]],
  rows:[["Pesos","Weights",["Não","Sim","Sim"],["No","Yes","Yes"]],
        ["Código de treino","Training code",["Não","Às vezes","Sim"],["No","Sometimes","Yes"]],
        ["Informação sobre os dados","Data information",["Resumo","Parcial","Suficiente para reproduzir"],["Summary","Partial","Enough to reproduce"]],
        ["Liberdade de uso","Freedom of use",["Termos do fornecedor","Licença pode restringir","Usar, estudar, modificar, compartilhar"],["Vendor terms","License may restrict","Use, study, modify, share"]]]},
 deep:[["O que olhar numa licença","What to check in a license",
  "Quatro pontos resolvem a maior parte das dúvidas: se o uso comercial é permitido; se há limite de tamanho da empresa ou de usuários; se existe uma política de uso aceitável que proíbe certas aplicações; e se é permitido usar as saídas do modelo para treinar outros modelos. Licenças como Apache 2.0 e MIT são permissivas; licenças próprias de fornecedores variam bastante e precisam de leitura atenta com o jurídico.",
  "Four points settle most questions: whether commercial use is allowed; whether there is a limit on company size or users; whether an acceptable use policy forbids certain applications; and whether using the model's outputs to train other models is permitted. Licenses such as Apache 2.0 and MIT are permissive; vendors' own licenses vary widely and need careful reading with legal."],
 ["Quando escolher um modelo aberto","When to choose an open model",
  "Modelos abertos fazem mais sentido quando há exigência de rodar em ambiente próprio, necessidade de customização profunda, volume alto e estável que justifique infraestrutura, ou estratégia de não depender de um fornecedor. Eles fazem menos sentido quando o time é pequeno, o volume é baixo ou a qualidade de ponta é decisiva. Muitas empresas acabam com uma combinação: modelo fechado para tarefas difíceis e aberto para tarefas de alto volume.",
  "Open models make the most sense when there is a requirement to run in your own environment, a need for deep customization, high and steady volume that justifies infrastructure, or a strategy of not depending on one vendor. They make less sense when the team is small, volume is low or top quality is decisive. Many companies end up with a mix: a closed model for hard tasks and an open one for high-volume tasks."]]});

M(12,{dg:{type:"spectrum",t:["Mais controle, mais operação","More control, more operations"],
  ends:[["Menos operação","Less operations"],["Mais controle","More control"]],
  items:[["API do fornecedor","Vendor API","pague por uso, zero infraestrutura","pay per use, zero infrastructure"],["Modelo na sua nuvem","Model in your cloud","marketplace da AWS, Google ou Azure","AWS, Google or Azure marketplace"],["Open-weight gerenciado","Managed open-weight","provedor de inferência","inference provider"],["Self-hosted","Self-hosted","suas GPUs, seu time","your GPUs, your team"]]},
 deep:[["Perguntas para levantar com o cliente","Questions to raise with the client",
  "Antes de escolher, levante: onde os dados podem ser processados (país e nuvem)? Os dados podem ser usados para treinar modelos do fornecedor? Qual é o tempo máximo de retenção dos registros? Há exigência de certificações, como ISO 27001 ou SOC 2? Qual latência é aceitável e de que região vêm os usuários? Essas respostas eliminam opções rapidamente e evitam descobrir um bloqueio depois que o produto está pronto.",
  "Before choosing, find out: where can data be processed (country and cloud)? Can data be used to train the vendor's models? What is the maximum retention time for logs? Are certifications required, such as ISO 27001 or SOC 2? What latency is acceptable, and which region do users come from? These answers rule out options quickly and avoid discovering a blocker after the product is built."],
 ["O custo escondido do self-hosting","The hidden cost of self-hosting",
  "Rodar o próprio modelo exige mais do que GPUs: alguém precisa atualizar versões, ajustar o motor de inferência, garantir alta disponibilidade, monitorar falhas e responder a incidentes de madrugada. Na prática, isso significa pelo menos uma ou duas pessoas dedicadas. Ao comparar com uma API, inclua esse custo de pessoas, além de considerar que a qualidade dos modelos abertos que você consegue rodar pode ser menor que a dos melhores fechados.",
  "Running your own model takes more than GPUs: someone has to update versions, tune the inference engine, ensure high availability, monitor failures and respond to incidents at night. In practice, that means at least one or two dedicated people. When comparing with an API, include that people cost, and consider that the open models you can run may be of lower quality than the best closed ones."]]});

M(13,{dg:{type:"bars",t:["Exemplo: de onde vem o custo de uma conversa","Example: where a conversation's cost comes from"],
  items:[["Saída (respostas)","Output (answers)",42],["Histórico reenviado","Re-sent history",27],["Prompt de sistema","System prompt",16],["Trechos do RAG","RAG passages",11],["Novas tentativas","Retries",4]],
  note:["Distribuição ilustrativa. Meça a do seu produto antes de otimizar.","Illustrative breakdown. Measure your product's before optimizing."]},
 deep:[["Montando o modelo de custo","Building the cost model",
  "Comece pela unidade que o cliente valoriza, como uma conversa resolvida. Some os tokens de entrada e saída de todas as chamadas dessa unidade, incluindo recuperação, ferramentas e novas tentativas. Multiplique pelos preços e pelo volume esperado. Depois compare com o valor gerado: se uma conversa custa US$ 0,04 e evita um atendimento humano de US$ 3, a margem é grande. Se o produto for vendido por assento, simule o usuário mais intenso, não o médio.",
  "Start with the unit the customer values, such as a resolved conversation. Add up the input and output tokens of every call in that unit, including retrieval, tools and retries. Multiply by prices and expected volume. Then compare with the value created: if a conversation costs US$ 0.04 and avoids a US$ 3 human contact, the margin is large. If the product is sold per seat, simulate the heaviest user, not the average one."],
 ["Alavancas de redução, em ordem de esforço","Cost levers, in order of effort",
  "Primeiro, as baratas: cache para o prompt de sistema, limite de tamanho das respostas e compactação do histórico. Depois, as médias: processamento em lote para tarefas sem urgência e roteamento de tarefas simples para um modelo menor. Por último, as caras: fine-tuning ou destilação para um modelo próprio e hospedagem própria. Medir antes e depois de cada mudança evita trocar qualidade por economia sem perceber.",
  "First, the cheap ones: caching the system prompt, capping answer length and compacting history. Next, the medium ones: batch processing for non-urgent tasks and routing simple tasks to a smaller model. Last, the expensive ones: fine-tuning or distilling into your own model and self-hosting. Measuring before and after each change avoids trading quality for savings without noticing."]]});

M(14,{dg:{type:"flow",t:["Cascata de modelos","Model cascade"],
  steps:[["Pedido","Request","",""],["Modelo pequeno","Small model","rápido e barato","fast and cheap"],["Validação","Validation","confiança, formato, regras","confidence, format, rules"],["Modelo grande","Large model","só se a validação falhar","only if validation fails"]],
  note:["Meça quantos pedidos sobem para o modelo grande: esse número define a economia real.","Measure how many requests escalate to the large model: that number sets the real savings."]},
 deep:[["Como montar uma matriz de decisão","How to build a decision matrix",
  "Liste os critérios que importam (qualidade no seu golden set, custo por tarefa, latência p95, privacidade, licença, facilidade de operação) e dê um peso a cada um conforme o caso de uso. Atribua notas de 1 a 5 para cada modelo, multiplique pelos pesos e some. O número final importa menos que a conversa que ele provoca: discordâncias sobre pesos revelam prioridades diferentes entre produto, engenharia e negócio, e é melhor descobri-las cedo.",
  "List the criteria that matter (quality on your golden set, cost per task, p95 latency, privacy, license, ease of operation) and give each a weight based on the use case. Score each model from 1 to 5, multiply by the weights and add them up. The final number matters less than the conversation it sparks: disagreements over weights reveal different priorities across product, engineering and business, and it is better to find them early."],
 ["Reavaliar faz parte da rotina","Re-evaluating is part of the routine",
  "Fornecedores lançam modelos novos a cada poucos meses, frequentemente mais baratos e melhores. Se o golden set e a matriz estiverem prontos, testar uma novidade leva horas. Sem eles, cada troca vira um projeto. Uma boa prática é revisar a escolha de modelos a cada trimestre e sempre que um fornecedor anunciar uma versão nova relevante.",
  "Vendors release new models every few months, often cheaper and better. If the golden set and matrix are ready, testing a new release takes hours. Without them, every switch becomes a project. A good practice is to review model choices every quarter and whenever a vendor announces a relevant new version."]]});

M(15,{dg:{type:"stack",t:["Anatomia de um prompt de sistema","Anatomy of a system prompt"],
  items:[["Papel e objetivo","Role and goal","Você é o assistente de suporte da Loja X. Seu objetivo é resolver dúvidas de pedidos.","You are Store X's support assistant. Your goal is to resolve order questions."],
         ["Contexto","Context","Política de trocas: 30 dias. Prazo padrão: 5 dias úteis.","Return policy: 30 days. Standard delivery: 5 business days."],
         ["Regras","Rules","Nunca prometa prazos fora da política. Se não souber, ofereça um atendente.","Never promise dates outside the policy. If unsure, offer a human agent."],
         ["Exemplos","Examples","Pergunta: \"chega amanhã?\" Resposta ideal: ...","Question: \"will it arrive tomorrow?\" Ideal answer: ..."],
         ["Formato","Format","Responda em até 3 frases, em português, com tom cordial.","Answer in up to 3 sentences, in a friendly tone."]]},
 deep:[["Erros comuns em prompts de produto","Common mistakes in product prompts",
  "Os mais frequentes são: instruções contraditórias acumuladas ao longo do tempo (\"seja breve\" e \"explique em detalhes\"); regras vagas como \"seja cuidadoso\", que o modelo não sabe como cumprir; ausência de exemplos para os casos difíceis; e prompts gigantes que ninguém revisa. Cada mudança no prompt deveria vir com o motivo e o resultado nos testes, como um commit de código.",
  "The most frequent are: contradictory instructions piled up over time (\"be brief\" and \"explain in detail\"); vague rules such as \"be careful\", which the model does not know how to follow; no examples for hard cases; and giant prompts nobody reviews. Every prompt change should come with the reason and the test results, like a code commit."],
 ["Testando o prompt como uma especificação","Testing the prompt like a spec",
  "Para cada regra do prompt, crie pelo menos um caso de teste que tente quebrá-la. Se a regra é \"não prometer prazos\", inclua um cliente insistindo por uma data. Rode o conjunto a cada alteração e compare com a versão anterior. Com 50 a 100 casos bem escolhidos, você descobre regressões antes dos usuários, e as discussões sobre o prompt passam a ser sobre dados, e não sobre opiniões.",
  "For each rule in the prompt, create at least one test case that tries to break it. If the rule is \"do not promise dates\", include a customer insisting on a date. Run the set on every change and compare with the previous version. With 50 to 100 well-chosen cases, you find regressions before users do, and prompt discussions become about data, not opinions."]]});

M(16,{dg:{type:"stack",t:["O que entra na janela de contexto","What goes into the context window"],
  items:[["Instruções de sistema","System instructions","fixas; boas candidatas a cache","fixed; good caching candidates"],
         ["Memória do usuário","User memory","preferências e decisões salvas","saved preferences and decisions"],
         ["Histórico compactado","Compacted history","resumo do que já foi dito","summary of what was said"],
         ["Documentos recuperados","Retrieved documents","só os trechos relevantes","only the relevant passages"],
         ["Resultados de ferramentas","Tool results","dados do pedido, do CRM etc.","order data, CRM data, etc."],
         ["Pergunta atual","Current question","o que o usuário pediu agora","what the user just asked"]]},
 deep:[["Mais contexto nem sempre é melhor","More context is not always better",
  "Janelas de centenas de milhares de tokens tentam a colocar tudo lá dentro. Mas estudos mostram que a qualidade cai com contextos longos, especialmente para informações no meio. Além disso, cada token custa e aumenta a latência. A boa prática é tratar o contexto como um orçamento: cada bloco precisa justificar seu lugar. Se um trecho raramente muda a resposta, ele não deveria estar ali em toda chamada.",
  "Windows of hundreds of thousands of tokens tempt you to put everything in. But studies show quality drops with long contexts, especially for information in the middle. Also, every token costs money and adds latency. The good practice is to treat context as a budget: each block must earn its place. If a passage rarely changes the answer, it should not be there on every call."],
 ["Memória: o que guardar e por quanto tempo","Memory: what to keep and for how long",
  "Boas candidatas à memória são preferências estáveis (idioma, tom, formato) e decisões já tomadas. Más candidatas são dados sensíveis e informações que mudam rápido. O produto precisa deixar claro o que foi memorizado e oferecer formas de ver, corrigir e apagar. Uma memória errada é pior que nenhuma, porque o assistente passa a repetir o erro com confiança em todas as conversas seguintes.",
  "Good memory candidates are stable preferences (language, tone, format) and decisions already made. Bad candidates are sensitive data and fast-changing information. The product must make clear what was remembered and offer ways to view, correct and delete it. A wrong memory is worse than none, because the assistant starts repeating the error confidently in every following conversation."]]});
M(17,{dg:{type:"flow",t:["O pipeline de RAG","The RAG pipeline"],
  steps:[["Documentos","Documents","políticas, FAQs, manuais","policies, FAQs, manuals"],["Divisão em trechos","Chunking","com metadados e permissões","with metadata and permissions"],["Indexação","Indexing","embeddings + índice lexical","embeddings + lexical index"],["Busca","Retrieval","híbrida, filtrada por permissão","hybrid, permission-filtered"],["Reranking","Reranking","os 5 melhores","the top 5"],["Resposta","Answer","com citações","with citations"]],
  note:["Avalie em duas partes: o trecho certo chegou (busca)? A resposta é fiel a ele (geração)?","Evaluate in two parts: did the right passage arrive (retrieval)? Is the answer faithful to it (generation)?"]},
 deep:[["Decisões de divisão que mudam o resultado","Chunking decisions that change the outcome",
  "Trechos pequenos demais perdem contexto: uma regra de troca separada da exceção que vem no parágrafo seguinte gera resposta errada. Trechos grandes demais diluem a relevância e gastam tokens. Na prática, divida respeitando a estrutura do documento (seções, títulos, listas), inclua o título da seção em cada trecho e guarde metadados como data de atualização, produto e quem pode ver. Esses metadados permitem filtrar antes de buscar, o que melhora qualidade e segurança.",
  "Chunks that are too small lose context: a return rule separated from the exception in the next paragraph produces a wrong answer. Chunks that are too large dilute relevance and waste tokens. In practice, split along the document's structure (sections, headings, lists), include the section title in each chunk and store metadata such as last updated date, product and who can see it. That metadata lets you filter before searching, improving both quality and security."],
 ["As quatro métricas que contam a história","The four metrics that tell the story",
  "Precisão do contexto: dos trechos recuperados, quantos eram relevantes? Recall do contexto: a informação necessária estava entre eles? Fidelidade: a resposta só afirma o que está nos trechos? Relevância da resposta: ela responde à pergunta feita? Olhando as quatro juntas, você sabe onde agir: recall baixo pede ajuste na busca; fidelidade baixa pede ajuste no prompt ou no modelo.",
  "Context precision: of the retrieved passages, how many were relevant? Context recall: was the needed information among them? Faithfulness: does the answer only state what the passages say? Answer relevance: does it answer the question asked? Looking at all four, you know where to act: low recall calls for retrieval work; low faithfulness calls for prompt or model work."]]});

M(18,{dg:{type:"matrix",t:["Qual técnica usar","Which technique to use"],
  x:["Conhecimento muda pouco → muda muito","Knowledge changes little → changes a lot"],y:["Precisa mudar comportamento ↑","Needs behavior change ↑"],
  q:[["Fine-tuning","Fine-tuning","formato, estilo, tarefa específica","format, style, specific task"],["Fine-tuning + RAG","Fine-tuning + RAG","comportamento próprio e fatos atuais","custom behavior and current facts"],
     ["Prompt + contexto longo","Prompt + long context","base pequena e estável","small, stable corpus"],["RAG","RAG","base grande, dinâmica ou com permissões","large, dynamic or permissioned corpus"]]},
 deep:[["Um roteiro de decisão em quatro passos","A four-step decision path",
  "Passo 1: comece com um bom prompt e meça no golden set. Passo 2: se faltar conhecimento e a base for pequena e estável, coloque os documentos no contexto com cache. Passo 3: se a base for grande, mudar com frequência ou exigir permissões, monte um RAG. Passo 4: só se ainda houver um problema de comportamento (formato inconsistente, estilo, custo em alto volume), considere fine-tuning. Cada passo deve ser justificado por números do passo anterior.",
  "Step 1: start with a good prompt and measure on the golden set. Step 2: if knowledge is missing and the corpus is small and stable, put the documents in context with caching. Step 3: if the corpus is large, changes often or needs permissions, build RAG. Step 4: only if a behavior problem remains (inconsistent format, style, cost at high volume), consider fine-tuning. Each step should be justified by numbers from the previous one."],
 ["O que o fine-tuning exige do produto","What fine-tuning demands from the product",
  "Fine-tuning precisa de centenas a milhares de exemplos de alta qualidade, revisados por especialistas, e de um processo para atualizar esses exemplos. Quando o fornecedor lança um modelo base novo, o ajuste pode precisar ser refeito. Por isso, ele é uma decisão de manutenção contínua, e não um projeto único. Inclua no plano quem cuida dos dados, com que frequência e como medir se o modelo ajustado continua melhor que o original.",
  "Fine-tuning needs hundreds to thousands of high-quality examples reviewed by experts, plus a process to update them. When the vendor releases a new base model, the tuning may need to be redone. That makes it an ongoing maintenance decision, not a one-off project. Include in the plan who owns the data, how often it is refreshed and how to measure whether the tuned model still beats the original."]]});

M(19,{dg:{type:"spectrum",t:["Níveis de autonomia","Levels of autonomy"],
  ends:[["Mais previsível","More predictable"],["Mais autônomo","More autonomous"]],
  items:[["Chatbot de FAQ","FAQ chatbot","responde, não age","answers, does not act"],["Assistente com RAG","RAG assistant","responde com fontes","answers with sources"],["Workflow com LLM","LLM workflow","passos fixos em código","fixed steps in code"],["Agente com ferramentas","Agent with tools","decide os próximos passos","decides the next steps"],["Multiagente","Multi-agent","delega e coordena","delegates and coordinates"]]},
 deep:[["Mapeando intenções para padrões","Mapping intents to patterns",
  "Num atendimento real, as intenções não pedem o mesmo nível de autonomia. Perguntas sobre política pedem um assistente com RAG. Rastrear um pedido pede um workflow simples: identificar o pedido e consultar o sistema. Uma reclamação complexa, que pode envolver troca, reembolso ou investigação de entrega, pode justificar um agente, desde que com ações limitadas e aprovação humana para as sensíveis. Montar essa tabela de intenções é um dos primeiros entregáveis do PM.",
  "In real support, intents do not call for the same level of autonomy. Policy questions call for a RAG assistant. Tracking an order calls for a simple workflow: identify the order and query the system. A complex complaint, which may involve an exchange, refund or delivery investigation, may justify an agent, as long as actions are limited and sensitive ones need human approval. Building this intent table is one of the PM's first deliverables."],
 ["Por que medir tarefas longas importa","Why measuring long tasks matters",
  "O estudo da METR mediu a duração das tarefas que modelos completam com sucesso e viu esse tempo dobrar a cada poucos meses. Para produto, isso significa que o limite do que um agente consegue fazer muda rápido, e decisões tomadas há um ano podem estar desatualizadas. Mas taxa de sucesso não é tudo: uma tarefa longa com 80% de sucesso ainda falha em uma de cada cinco vezes, e o produto precisa lidar bem com isso.",
  "METR's study measured the length of tasks models complete successfully and saw that length double every few months. For product, this means the limit of what an agent can do moves fast, and decisions made a year ago may be outdated. But success rate is not everything: a long task with 80% success still fails one time in five, and the product must handle that well."]]});

M(20,{dg:{type:"cycle",t:["O ciclo de um agente","An agent's loop"],
  steps:[["Objetivo","Goal","\"resolver a troca do pedido 4821\"","\"resolve the exchange for order 4821\""],["Pensar","Think","qual o próximo passo?","what is the next step?"],["Agir","Act","chamar uma ferramenta","call a tool"],["Observar","Observe","ler o resultado","read the result"]],
  note:["Guardrails: limite de passos, permissões mínimas e aprovação humana antes de ações irreversíveis.","Guardrails: step limit, minimal permissions and human approval before irreversible actions."]},
 deep:[["Escrevendo a especificação de uma ferramenta","Writing a tool specification",
  "Cada ferramenta precisa de nome claro, descrição do que faz e quando usar, parâmetros com tipos e exemplos, e o formato da resposta, inclusive em caso de erro. Descrições vagas fazem o modelo usar a ferramenta errada. Um exemplo bom: \"consultar_pedido(numero): retorna status, itens e data prevista. Use quando o cliente mencionar um pedido. Não altera nada.\" Deixar claro o que é só leitura e o que modifica dados ajuda o modelo e a revisão de segurança.",
  "Each tool needs a clear name, a description of what it does and when to use it, typed parameters with examples, and the response format, including errors. Vague descriptions make the model pick the wrong tool. A good example: \"get_order(number): returns status, items and expected date. Use when the customer mentions an order. Changes nothing.\" Stating clearly what is read-only and what modifies data helps both the model and the security review."],
 ["Onde colocar a aprovação humana","Where to place human approval",
  "Use duas perguntas: a ação é reversível? Qual o custo se estiver errada? Consultar dados é reversível e barato: sem aprovação. Abrir um chamado é reversível, mas pode duplicar: sem aprovação, com idempotência. Emitir reembolso, enviar e-mail externo ou apagar dados são difíceis de desfazer: com aprovação. A aprovação deve mostrar exatamente o que será feito, para a pessoa decidir em segundos.",
  "Use two questions: is the action reversible? What does it cost if wrong? Reading data is reversible and cheap: no approval. Opening a ticket is reversible but may duplicate: no approval, with idempotency. Issuing a refund, sending an external email or deleting data are hard to undo: require approval. The approval should show exactly what will happen, so the person can decide in seconds."]]});

M(21,{dg:{type:"compare",t:["Arquiteturas de agentes","Agent architectures"],
  cols:[["Workflow fixo","Fixed workflow"],["Agente único","Single agent"],["Orquestrador + subagentes","Orchestrator + subagents"]],
  rows:[["Previsibilidade","Predictability",["Alta","Média","Baixa"],["High","Medium","Low"]],
        ["Custo em tokens","Token cost",["Baixo","Médio","Alto (até ~15x)"],["Low","Medium","High (up to ~15x)"]],
        ["Depuração","Debugging",["Simples","Moderada","Difícil"],["Simple","Moderate","Hard"]],
        ["Bom para","Good for",["Passos conhecidos","Tarefas abertas e curtas","Pesquisas amplas e paralelas"],["Known steps","Short open-ended tasks","Broad, parallel research"]]]},
 deep:[["Sinais de que você precisa de mais autonomia","Signs you need more autonomy",
  "Considere subir de nível quando: o número de caminhos possíveis cresce a ponto de o workflow virar uma árvore impossível de manter; a tarefa exige explorar informações cujo próximo passo depende do que foi encontrado; ou partes independentes podem rodar em paralelo e o tempo total importa. Se nenhum desses sinais aparece, mais autonomia só traz custo e variabilidade.",
  "Consider moving up a level when: the number of possible paths grows until the workflow becomes an unmaintainable tree; the task requires exploring information where the next step depends on what was found; or independent parts can run in parallel and total time matters. If none of these signs appears, more autonomy only brings cost and variability."],
 ["Por que sistemas multiagente falham","Why multi-agent systems fail",
  "As falhas mais comuns são: subagentes trabalhando com contexto incompleto e tomando decisões conflitantes; o orquestrador perdendo o objetivo original no caminho; subagentes repetindo trabalho; e ausência de critério claro de quando parar. As defesas são passar contexto suficiente na delegação, definir o formato do que cada subagente devolve e ter um passo final de síntese que verifica contradições.",
  "The most common failures are: subagents working with incomplete context and making conflicting decisions; the orchestrator losing the original goal along the way; subagents duplicating work; and no clear criterion for when to stop. The defenses are passing enough context when delegating, defining what each subagent returns and having a final synthesis step that checks for contradictions."]]});

M(22,{dg:{type:"compare",t:["Mapa do mercado de agentes","Agent market map"],
  cols:[["Agentes prontos","Ready-made agents"],["Plataformas","Platforms"]],
  rows:[["Exemplos","Examples",["Claude Code, Codex, Deep Research, Cursor","Copilot Studio, Agentforce, SDKs de agentes"],["Claude Code, Codex, Deep Research, Cursor","Copilot Studio, Agentforce, agent SDKs"]],
        ["Quem usa","Who uses it",["O usuário final, direto","Times que constroem agentes próprios"],["End users, directly","Teams building their own agents"]],
        ["Tempo até valor","Time to value",["Dias","Semanas a meses"],["Days","Weeks to months"]],
        ["Diferencial","Differentiation",["Baixo: concorrentes usam o mesmo","Alto: ligado aos seus processos"],["Low: competitors use the same","High: tied to your processes"]]]},
 deep:[["Como conduzir uma avaliação de fornecedores","How to run a vendor evaluation",
  "Escolha de 10 a 20 tarefas reais e representativas, incluindo algumas difíceis. Defina antes o que é sucesso: tarefa concluída, quanto a pessoa precisou editar, tempo economizado e erros graves. Peça para usuários reais testarem, e não só o time técnico. Avalie também o que fica em volta: permissões, registros de auditoria, integração com seus sistemas, custo por usuário e política de uso dos seus dados.",
  "Choose 10 to 20 real, representative tasks, including some hard ones. Define success beforehand: task completed, how much the person had to edit, time saved and serious errors. Have real users test, not only the technical team. Also evaluate what surrounds it: permissions, audit logs, integration with your systems, cost per user and the policy for using your data."],
 ["Adoção é o verdadeiro desafio","Adoption is the real challenge",
  "Muitas empresas compram ferramentas de IA que ficam pouco usadas. As causas mais comuns são falta de casos de uso claros, medo de errar, desconfiança dos resultados e ausência de tempo para aprender. O PM pode reduzir isso com casos de uso concretos por função, campeões internos que mostram resultados, métricas de uso acompanhadas por time e espaço para compartilhar o que funcionou.",
  "Many companies buy AI tools that end up underused. The most common causes are lack of clear use cases, fear of mistakes, distrust of the results and no time to learn. The PM can reduce this with concrete use cases per role, internal champions who show results, usage metrics tracked by team and space to share what worked."]]});

M(23,{dg:{type:"cycle",t:["O ciclo de evals","The eval loop"],
  steps:[["Coletar casos reais","Collect real cases","incluindo falhas","including failures"],["Análise de erros","Error analysis","categorizar o que falhou","categorize what failed"],["Ajustar","Adjust","prompt, busca, modelo","prompt, retrieval, model"],["Medir no golden set","Measure on golden set","comparar com a versão anterior","compare with the previous version"]],
  note:["Os casos de teste final ficam separados: eles medem, não ajustam.","Final test cases stay separate: they measure, they do not tune."]},
 deep:[["Comece pela análise de erros","Start with error analysis",
  "Antes de criar métricas, leia de 50 a 100 respostas reais e anote o que deu errado em cada uma, com suas palavras. Depois agrupe as anotações em categorias, como \"citou política antiga\", \"não pediu número do pedido\" ou \"tom inadequado\". Conte quantas vezes cada uma aparece. Essa lista mostra o que realmente importa e vira a base das métricas e do golden set, em vez de métricas genéricas que não refletem seus problemas.",
  "Before creating metrics, read 50 to 100 real answers and note what went wrong in each, in your own words. Then group the notes into categories, such as \"cited an old policy\", \"did not ask for the order number\" or \"inappropriate tone\". Count how often each appears. This list shows what really matters and becomes the basis for metrics and the golden set, instead of generic metrics that do not reflect your problems."],
 ["Escrevendo uma boa rubrica","Writing a good rubric",
  "Uma rubrica útil tem critérios específicos e observáveis. Em vez de \"a resposta é boa?\", use perguntas como \"a resposta cita a política correta?\", \"pede os dados necessários antes de prometer algo?\" e \"tem no máximo três frases?\". Critérios binários, de sim ou não, costumam ser mais consistentes entre avaliadores do que escalas de 1 a 10. Teste a rubrica com duas pessoas avaliando os mesmos casos: se discordarem muito, o critério está ambíguo.",
  "A useful rubric has specific, observable criteria. Instead of \"is the answer good?\", use questions such as \"does it cite the correct policy?\", \"does it ask for the required data before promising anything?\" and \"is it three sentences or fewer?\". Binary yes or no criteria tend to be more consistent across graders than 1 to 10 scales. Test the rubric with two people grading the same cases: if they disagree a lot, the criterion is ambiguous."]]});

M(24,{dg:{type:"flow",t:["Quando algo falha","When something fails"],
  steps:[["Chamada ao modelo","Model call","",""],["Timeout?","Timeout?","nova tentativa com espera crescente","retry with growing wait"],["Falhou de novo?","Failed again?","provedor alternativo","alternative provider"],["Ainda sem resposta?","Still no answer?","transferência para humano com contexto","handoff to a human with context"]],
  note:["Ações de escrita usam chave de idempotência para não duplicar efeitos nas novas tentativas.","Write actions use an idempotency key so retries do not duplicate effects."]},
 deep:[["Orçamento de erro na prática","Error budgets in practice",
  "Se o SLO é que 99,5% das respostas cheguem em até 5 segundos, o orçamento de erro é 0,5%: em 100 mil respostas por semana, até 500 podem ser lentas. Enquanto o orçamento não acaba, o time lança novidades normalmente. Se ele se esgota, a prioridade muda para estabilidade até o sistema voltar ao normal. Esse acordo transforma discussões subjetivas sobre qualidade em uma regra clara entre produto e engenharia.",
  "If the SLO is that 99.5% of answers arrive within 5 seconds, the error budget is 0.5%: out of 100 thousand answers a week, up to 500 may be slow. While the budget lasts, the team ships features normally. If it runs out, priority shifts to stability until the system recovers. This agreement turns subjective debates about quality into a clear rule between product and engineering."],
 ["Confiabilidade além da disponibilidade","Reliability beyond availability",
  "Em IA, um sistema pode estar no ar e ainda assim falhar: responder com formato inválido, variar a resposta para a mesma pergunta ou executar a ação errada. Por isso, além de disponibilidade e latência, vale acompanhar a taxa de saídas inválidas, a consistência em perguntas repetidas e a taxa de sucesso das ações. Para agentes, medir se ele acerta todas as vezes em várias tentativas revela instabilidades que uma única execução esconde.",
  "In AI, a system can be up and still fail: return an invalid format, vary its answer to the same question or take the wrong action. So beyond availability and latency, track the rate of invalid outputs, consistency on repeated questions and the success rate of actions. For agents, measuring whether they succeed every time across several attempts reveals instability that a single run hides."]]});
M(25,{dg:{type:"flow",t:["Um trace, passo a passo","A trace, step by step"],
  steps:[["Pergunta","Question","\"cadê meu pedido?\"","\"where is my order?\""],["Contexto montado","Context built","prompt v12 + 3 trechos","prompt v12 + 3 passages"],["Ferramenta","Tool","consultar_pedido(4821) → ok","get_order(4821) → ok"],["Resposta","Answer","1,8 s e 2.140 tokens","1.8 s and 2,140 tokens"],["Avaliação","Evaluation","juiz: fiel às fontes","judge: faithful to sources"]],
  note:["Cada etapa registra versão, tempo, tokens e resultado, com dados pessoais mascarados.","Each step logs version, time, tokens and result, with personal data masked."]},
 deep:[["O ritual semanal de leitura","The weekly reading ritual",
  "Reserve uma hora por semana para ler uma amostra de conversas reais, misturando aleatórias com as que tiveram nota baixa, recontato ou transferência para humano. Para cada falha, anote a causa provável usando o trace: faltou informação, a busca trouxe o trecho errado, o modelo ignorou uma regra, a ferramenta falhou. Em poucas semanas, surge um ranking de problemas que orienta o backlog melhor que qualquer opinião.",
  "Set aside one hour a week to read a sample of real conversations, mixing random ones with those that got low ratings, re-contacts or human handoffs. For each failure, note the likely cause using the trace: missing information, retrieval brought the wrong passage, the model ignored a rule, the tool failed. Within a few weeks, a ranking of problems emerges that guides the backlog better than any opinion."],
 ["Sinais de usuário como sensores","User signals as sensors",
  "Além de avaliações explícitas, como joinha e nota, os sinais implícitos dizem muito: o usuário reformulou a pergunta logo depois, copiou a resposta, pediu um humano, abandonou a conversa ou voltou com o mesmo problema dias depois. Esses sinais aparecem em escala e sem esforço do usuário. Combinados com os traces, mostram onde investigar primeiro.",
  "Beyond explicit ratings, such as thumbs up and scores, implicit signals say a lot: the user rephrased the question right away, copied the answer, asked for a human, abandoned the chat or came back with the same problem days later. These signals arrive at scale and without user effort. Combined with traces, they show where to investigate first."]]});

M(26,{dg:{type:"stack",t:["As três camadas do painel","The three dashboard layers"],

 deep:[["Escolhendo a métrica norte","Choosing the north star metric",

M(27,{dg:{type:"bars",t:["Exemplo: efeito de cada otimização no custo","Example: effect of each optimization on cost"],

M(28,{dg:{type:"triad",t:["A tríade letal","The lethal trifecta"],

M(29,{dg:{type:"matrix",hl:1,t:["Onde começar com IA","Where to start with AI"],

const LT=a=>EN()?a[1]:a[0];
function dgHTML(d){
  if(!d) return "";
  let body="";
  if(d.type==="nest"){
    let inner="";
    for(let i=d.rings.length-1;i>=0;i--){const r=d.rings[i];
      inner=`<div class="dg-ring" style="--lv:${i}"><div class="dg-ring-h"><b>${esc(LT(r))}</b><span>${esc(EN()?r[3]:r[2])}</span></div>${inner}</div>`;}
    body=`<div class="dg-nest">${inner}</div>`;
  } else if(d.type==="timeline"){
    body=`<div class="dg-scroll"><ol class="dg-tl" style="--n:${d.items.length}">${d.items.map(x=>`<li><span class="y">${esc(x[0])}</span><i></i><span class="l">${esc(EN()?x[2]:x[1])}</span></li>`).join("")}</ol></div>`;
  } else if(d.type==="flow"||d.type==="cycle"){
    body=`<ol class="dg-flow ${d.type==="cycle"?"is-cycle":""} ${d.steps.length>4?"is-long":""}" style="--n:${d.steps.length}">${d.steps.map((s,i)=>`<li><span class="k">${i+1}</span><b>${esc(LT(s))}</b>${(EN()?s[3]:s[2])?`<span class="s">${esc(EN()?s[3]:s[2])}</span>`:""}</li>`).join("")}</ol>
      ${d.type==="cycle"?`<div class="dg-loop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg>${EN()?"Repeats until the goal is reached":"Repete até atingir o objetivo"}</div>`:""}`;
  } else if(d.type==="compare"){
    body=`<div class="dg-scroll"><table class="dg-table"><thead><tr><th></th>${d.cols.map(c=>`<th>${esc(LT(c))}</th>`).join("")}</tr></thead>
      <tbody>${d.rows.map(r=>`<tr><th scope="row">${esc(LT(r))}</th>${(EN()?r[3]:r[2]).map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  } else if(d.type==="spectrum"){
    body=`<div class="dg-spec"><div class="dg-spec-ends"><span>${esc(LT(d.ends[0]))}</span><span>${esc(LT(d.ends[1]))}</span></div>
      <div class="dg-spec-bar"></div>
      <ol class="dg-spec-items" style="--n:${d.items.length}">${d.items.map(x=>`<li><i></i><b>${esc(LT(x))}</b><span>${esc(EN()?x[3]:x[2])}</span></li>`).join("")}</ol></div>`;
  } else if(d.type==="bars"){
    const mx=Math.max(...d.items.map(x=>x[2]));
    body=`<div class="dg-bars">${d.items.map(x=>`<div class="dg-bar"><span class="l">${esc(LT(x))}</span><div class="t"><i style="width:${x[2]/mx*100}%"></i></div><b>${x[2]}%</b></div>`).join("")}</div>`;
  } else if(d.type==="stack"){
    body=`<ol class="dg-stack">${d.items.map((x,i)=>`<li style="--i:${i}"><b>${esc(LT(x))}</b><span>${esc(EN()?x[3]:x[2])}</span></li>`).join("")}</ol>`;
  } else if(d.type==="matrix"){
    const q=d.q;
    body=`<div class="dg-matrix"><div class="ylab">${esc(LT(d.y))}</div>
      <div class="grid">${[q[0],q[1],q[2],q[3]].map((c,i)=>`<div class="cell c${i} ${d.hl===i?"hl":""}"><b>${esc(LT(c))}</b><span>${esc(EN()?c[3]:c[2])}</span></div>`).join("")}</div>
      <div class="xlab">${esc(LT(d.x))}</div></div>`;
  } else if(d.type==="triad"){
    const it=d.items;
    body=`<div class="dg-triad"><svg viewBox="0 0 300 250" role="img" aria-label="${esc(LT(d.t))}">
        <circle cx="110" cy="95" r="72"/><circle cx="190" cy="95" r="72"/><circle cx="150" cy="160" r="72"/>
        <text x="80" y="80">${esc(LT(it[0]).split(" ")[0])}</text><text x="220" y="80">${esc(LT(it[1]).split(" ")[0])}</text><text x="150" y="205">${esc(LT(it[2]).split(" ")[0])}</text>
        <text x="150" y="120" class="mid">!</text></svg>
      <ul>${it.map(x=>`<li><b>${esc(LT(x))}</b><span>${esc(EN()?x[3]:x[2])}</span></li>`).join("")}</ul></div>`;
  }
  return `<figure class="block dg" aria-label="${esc(LT(d.t))}"><figcaption><span class="ico" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4a2 2 0 0 1 2 2V14"/></svg></span>${esc(LT(d.t))}</figcaption>${body}${d.note?`<p class="dg-note">${esc(LT(d.note))}</p>`:""}</figure>`;

/* ============ ESTADO E PERSISTÊNCIA ============ */
const LS_KEY="trilha-ai-pm-v1";
const BLANK=()=>({done:{},exDone:{},notes:{},ex:{},exFb:{},quiz:{},chats:{},theme:null,lang:"pt",iv:null,qa:{},qs:{},sim:null});
let state = BLANK();
let dbRef=null, saveTimer=null, saving=false, pending=false;

function loadLocal(){try{const r=localStorage.getItem(LS_KEY);if(r)Object.assign(state,JSON.parse(r));}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function persist(){state.updatedAt=Date.now();saveLocal();clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200);}
function flushNow(){clearTimeout(saveTimer);flush();}
window.addEventListener("pagehide",flushNow);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushNow();});
async function flush(){
  if(!dbRef) return;
  if(saving){pending=true;return;}
  saving=true;
  try{ await dbRef.set(JSON.parse(JSON.stringify(state))); }catch(e){}
  saving=false;
  if(pending){pending=false;flush();}
}
async function initStore(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id();
    if(!uid) return;
    dbRef=db.doc("data/users/"+uid+"/progress");
    const snap=await dbRef.get();
    if(snap.exists){
      // Os dados chegam congelados (somente leitura): clonar antes de usar
      const remote=JSON.parse(JSON.stringify(snap.data()||{}));
      if((remote.updatedAt||0)>=(state.updatedAt||0)){
        state=Object.assign(BLANK(),remote);
        saveLocal(); applyTheme(); render();
      } else flush();
    } else flush();
  }catch(e){ dbRef=null; }
}

function paras(t){
  t=String(t);
  if(t.length<420) return "<p>"+esc(t)+"</p>";
  const re=/[.!?]["”)]?\s+(?=["“(]?[A-ZÀ-ÖØ-Þ0-9])/g; let m, cands=[];
  while((m=re.exec(t))){
    const before=t.slice(Math.max(0,m.index-6),m.index+1);
    if(/(\bal\.|\bet\.|\bed\.|\bvs\.|\bnº\.|\b[A-Z]\.|\b[A-Z]\.[A-Z]\.|!)$/.test(before)) continue;
    cands.push(m.index+m[0].length);
  }
  if(!cands.length) return "<p>"+esc(t)+"</p>";
  let cut=cands[0],bd=1e9;
  cands.forEach(c=>{const d=Math.abs(c-t.length/2);if(d<bd){bd=d;cut=c;}});
  return "<p>"+esc(t.slice(0,cut).trim())+"</p><p>"+esc(t.slice(cut).trim())+"</p>";
}

function animateHome(){
  const r=document.querySelector(".ring[data-p]");
  if(r){const to=+r.dataset.p; requestAnimationFrame(()=>requestAnimationFrame(()=>r.style.setProperty("--p",to))); window._lastPct=to;}
  const c=document.querySelector(".count[data-to]");
  if(c){const to=+c.dataset.to, from=window._lastPtsShown==null?0:window._lastPtsShown; window._lastPtsShown=to;
    if(RM()||from===to){c.textContent=fmtN(to);return;}
    const t0=performance.now(), d=700;
    const step=t=>{const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); c.textContent=fmtN(Math.round(from+(to-from)*e)); if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);}
}

  if(!EN()) return t;
  return t.replace(/ e /g," and ").replace(/(\d)ª ed\./g,(m,d)=>d+(d==="2"?"nd":d==="3"?"rd":"th")+" ed.")
   .replace("(documentação)","(docs)").replace("atualizado","updated").replace("(métrica pass^k)","(pass^k metric)")
   .replace("Prêmio Nobel de Física 2024: Hopfield e Hinton","Nobel Prize in Physics 2024: Hopfield and Hinton").replace("Nobel Prize in Physics 2024: Hopfield and Hinton","Nobel Prize in Physics 2024: Hopfield and Hinton")
   .replace("Regulamento de Inteligência Artificial (AI Act)","Artificial Intelligence Act").replace("União Europeia","European Union")
   .replace("Brasil (2018). Lei Geral de Proteção de Dados (Lei nº 13.709).","Brazil (2018). General Data Protection Law, LGPD (Law 13,709).")
   .replace("System cards dos modelos Claude.","Claude model system cards.");
}
function cleanDash(t){return String(t).replace(/\s*[—–]\s*/g,", ");}
function errCopy(code){
  switch(code){
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      sampleOff=true; return u("err_off");
    case "rate_limited": return u("err_rate");
    case "session_expired": return u("err_session");
    case "refused": return u("err_refused");
    case "cancelled": return "";
    default: return u("err_default");
  }
}

/* ============ UTILIDADES ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function md(src){
  let t=esc(cleanDash(src));
  const blocks=[]; t=t.replace(/```[\s\S]*?```/g,m=>{blocks.push(m.replace(/```\w*\n?|```/g,""));return "\u0000"+(blocks.length-1)+"\u0000";});
  t=t.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  const lines=t.split("\n"); let out=[],list=null,para=[];
  const fp=()=>{if(para.length){out.push("<p>"+para.join("<br>")+"</p>");para=[];}};
  const fl=()=>{if(list){out.push("<"+list.type+">"+list.items.map(i=>"<li>"+i+"</li>").join("")+"</"+list.type+">");list=null;}};
  for(const raw of lines){
    const l=raw.trim(); let m;
    if(!l){fp();fl();continue;}
    if(m=l.match(/^#{1,4}\s+(.*)/)){fp();fl();out.push("<p><strong>"+m[1]+"</strong></p>");continue;}
    if(m=l.match(/^[-*•]\s+(.*)/)){fp();if(!list||list.type!=="ul"){fl();list={type:"ul",items:[]};}list.items.push(m[1]);continue;}
    if(m=l.match(/^\d+[.)]\s+(.*)/)){fp();if(!list||list.type!=="ol"){fl();list={type:"ol",items:[]};}list.items.push(m[1]);continue;}
    fl();para.push(l);
  }
  fp();fl();
  return out.join("").replace(/\u0000(\d+)\u0000/g,(_,i)=>"<pre><code>"+blocks[+i]+"</code></pre>");
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200);}

function route(){
  const h=location.hash.replace(/^#/,"")||"/";
  const parts=h.split("/").filter(Boolean);
  return {name:parts[0]||"home",id:parts[1]?+parts[1]:null};
}
let chatAbort=null;
function render(){
  if(chatAbort){chatAbort.abort();chatAbort=null;}
  document.body.classList.remove("sheet-open");
  if(typeof simTimer!=="undefined")clearInterval(simTimer); document.onkeydown=null;
  {const c=state.sim&&state.sim.cur;if(c&&!c.done&&c.resumeAt&&route().name!=="simulado"){c.el=simElapsed(c);c.resumeAt=null;}}
  applyChrome();
  const r=route(), app=$("#app");
  document.querySelectorAll("[data-nav]").forEach(a=>a.removeAttribute("aria-current"));
  const navKey=r.name==="aula"||r.name==="exercicio"?"home":r.name;
  const cur=$('[data-nav="'+navKey+'"]'); if(cur) cur.setAttribute("aria-current","page");
  if(r.name==="aula"&&r.id&&LESSONS[r.id-1]) renderLesson(app,LESSONS[r.id-1]);
  else if(r.name==="exercicio"&&r.id&&MODULES[r.id-1]) renderExercise(app,MODULES[r.id-1]);
  else if(r.name==="glossario") renderGlossary(app);
  else if(r.name==="tutor") renderTutor(app);
  else if(r.name==="entrevista") renderInterview(app);
  else if(r.name==="biblioteca") renderLibrary(app);
  else if(r.name==="simulado") renderSim(app);
  else {renderHome(app); animateHome();}
  app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter");
}
